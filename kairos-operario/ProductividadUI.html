<style>
  /* ——— Panel de productividad (modo jefe). Todo con variables del tema: sirve en claro y oscuro. ——— */
  .pr { display:flex; flex-direction:column; gap:14px; }
  .pr-card { background:linear-gradient(160deg, var(--ink-850) 0%, var(--ink-900) 100%); border:1px solid var(--ink-800); border-radius:var(--radius-card); box-shadow:var(--shadow-card); padding:16px 18px; min-width:0; }
  .pr-card h2 { font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--text-500); margin:0 0 12px; display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .pr-card h2 small { font-size:11px; font-weight:600; text-transform:none; letter-spacing:0; color:var(--text-600); }
  .pr-cab { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; }

  .pr-acc { display:flex; gap:8px; }
  .pr button.pr-btn { min-height:36px; padding:7px 14px; font-size:12.5px; border-radius:var(--radius-chip); background:var(--ink-800); color:var(--text-300); border:1px solid var(--ink-700); }
  .pr button.pr-btn.primario { background:var(--accent); color:var(--accent-ink); border-color:transparent; }

  /* filtros */
  .pr-filtros { z-index:5; display:flex; flex-direction:column; gap:10px; padding:12px 14px; }
  .pr-grupo { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pr-grupo > label { font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--text-600); min-width:62px; }
  .pr-segs { display:inline-flex; background:var(--ink-950); border:1px solid var(--ink-800); border-radius:var(--radius-chip); padding:3px; gap:2px; flex-wrap:wrap; }
  .pr button.pr-seg { min-height:30px; padding:5px 13px; font-size:12.5px; font-weight:700; border-radius:var(--radius-chip); background:transparent; color:var(--text-500); display:inline-flex; align-items:center; gap:6px; }
  .pr button.pr-seg[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); box-shadow:0 2px 10px -3px var(--accent); }
  .pr button.pr-chip { min-height:32px; padding:5px 12px 5px 9px; font-size:12.5px; font-weight:700; border-radius:var(--radius-chip); background:var(--ink-900); color:var(--text-500); border:1px solid var(--ink-700); display:inline-flex; align-items:center; gap:7px; }
  .pr button.pr-chip[aria-pressed="true"] { background:var(--ink-850); color:var(--text-100); border-color:var(--text-600); }
  .pr button.pr-chip .pr-n { font-size:11px; font-weight:800; color:var(--text-600); font-variant-numeric:tabular-nums; }
  .pr-punto { width:9px; height:9px; border-radius:50%; flex:0 0 9px; }
  .pr-select, .pr-fecha { margin:0; padding:6px 10px; font-size:13px; min-height:36px; }
  .pr-resumen { font-size:12px; color:var(--text-500); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pr-resumen a { color:var(--accent); font-weight:700; cursor:pointer; text-decoration:none; }

  @media (min-width: 900px) and (min-height: 820px) { .pr-filtros { position:sticky; top:0; } }

  /* KPI */
  .pr-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .pr-kpi { padding:14px 16px 12px; display:flex; flex-direction:column; gap:4px; position:relative; overflow:hidden; }
  .pr-kpi .et { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--text-500); }
  .pr-kpi .val { font-size:34px; font-weight:800; letter-spacing:-.03em; line-height:1.05; font-variant-numeric:tabular-nums; color:var(--text-100); }
  .pr-kpi .val small { font-size:14px; font-weight:700; color:var(--text-500); letter-spacing:0; margin-left:4px; }
  .pr-kpi .sub { font-size:12px; color:var(--text-500); }
  .pr-kpi svg.spark { position:absolute; right:14px; top:38px; width:84px; height:30px; opacity:.9; }
  .pr-delta { display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:800; padding:2px 8px; border-radius:var(--radius-chip); width:fit-content; font-variant-numeric:tabular-nums; }
  .pr-delta.bien { background:rgba(26,143,76,.14); color:var(--ok); }
  .pr-delta.mal { background:var(--danger-bg); color:var(--danger-fg); }
  .pr-delta.igual { background:var(--ink-800); color:var(--text-500); }
  .pr-delta small { font-weight:600; opacity:.8; }

  /* destacados */
  .pr-destacados { display:flex; gap:10px; flex-wrap:wrap; }

  .pr-dest .ic { font-size:20px; line-height:1; }
  .pr-dest b { display:block; font-size:13px; color:var(--text-100); }
  .pr-dest span { font-size:12px; color:var(--text-500); }

  /* cuadrículas */
  .pr-fila2 { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:14px; }
  .pr-fila2.igual { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }

  /* barras */
  .pr-barras { display:flex; align-items:flex-end; gap:6px; height:200px; padding-top:20px; position:relative; border-bottom:1px solid var(--ink-700); background-image:repeating-linear-gradient(to top, transparent 0, transparent calc(25% - 1px), var(--ink-800) calc(25% - 1px), var(--ink-800) 25%); }
  .pr-col { flex:1; min-width:0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; position:relative; }
  .pr-col .pila { width:100%; max-width:46px; display:flex; flex-direction:column-reverse; border-radius:6px 6px 0 0; overflow:hidden; transform-origin:bottom; animation:pr-crece .45s cubic-bezier(.2,.8,.2,1) both; }
  .pr-col .pila i { display:block; width:100%; }
  .pr-col .tot { position:absolute; top:-18px; font-size:10.5px; font-weight:700; color:var(--text-500); font-variant-numeric:tabular-nums; }
  .pr-col.fuera .pila { opacity:.28; }
  .pr-col.hoy .pila { outline:2px dashed var(--accent); outline-offset:-2px; }
  .pr-ejex { display:flex; gap:6px; margin-top:6px; }
  .pr-ejex span { flex:1; text-align:center; font-size:10.5px; color:var(--text-500); font-variant-numeric:tabular-nums; min-width:0; overflow:hidden; text-overflow:clip; white-space:nowrap; }
  .pr-ejex span.fuera { opacity:.55; }
  .pr-linea { position:absolute; left:0; right:0; top:20px; bottom:0; width:100%; height:calc(100% - 20px); pointer-events:none; overflow:visible; }
  @keyframes pr-crece { from { transform:scaleY(0); } to { transform:scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { .pr-col .pila { animation:none; } }
  .pr-leyenda { display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; font-size:11.5px; color:var(--text-500); }
  .pr-leyenda span { display:inline-flex; align-items:center; gap:6px; }

  /* servicios */
  .pr-servicios { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px; }
  .pr-serv { padding:14px 16px; cursor:pointer; text-align:left; display:block; width:100%; border:1px solid var(--ink-800); background:linear-gradient(160deg, var(--ink-850) 0%, var(--ink-900) 100%); border-radius:var(--radius-card); box-shadow:var(--shadow-card); color:var(--text-100); font:inherit; min-height:0; }
  .pr-serv.apagado { opacity:.45; }
  .pr-serv .cab { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:800; }
  .pr-serv .num { font-size:30px; font-weight:800; letter-spacing:-.02em; margin:6px 0 2px; font-variant-numeric:tabular-nums; }
  .pr-serv .num small { font-size:12px; font-weight:700; color:var(--text-500); margin-left:4px; }
  .pr-mini { display:grid; grid-template-columns:repeat(3,max-content); justify-content:space-between; gap:8px 12px; margin-top:8px; }
  .pr-mini div { font-size:11px; color:var(--text-500); }
  .pr-mini b { display:block; font-size:14px; color:var(--text-100); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .pr-barra { height:6px; border-radius:99px; background:var(--ink-800); overflow:hidden; margin-top:10px; }
  .pr-barra > i { display:block; height:100%; border-radius:99px; }

  /* ranking */
  .pr-rank { display:flex; flex-direction:column; gap:6px; }
  .pr-fila { display:grid; grid-template-columns:34px minmax(110px,1.3fr) minmax(120px,2fr) 64px 64px 64px 64px; gap:12px; align-items:center; padding:8px 10px; border-radius:12px; background:var(--ink-900); border:1px solid var(--ink-800); cursor:pointer; text-align:left; width:100%; font:inherit; color:var(--text-100); min-height:0; }
  .pr-fila.activa { border-color:var(--accent); background:var(--accent-dim); }
  .pr-fila.cabecera { background:transparent; border-color:transparent; cursor:default; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--text-600); padding-top:0; padding-bottom:0; }
  .pr-fila .av { width:34px; height:34px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; }
  .pr-fila .nom { font-weight:800; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pr-fila .nom small { display:block; font-size:11px; font-weight:600; color:var(--text-500); }
  .pr-fila .bar { height:10px; border-radius:99px; background:var(--ink-800); overflow:hidden; display:flex; }
  .pr-fila .bar i { display:block; height:100%; }
  .pr-fila .c { text-align:right; font-variant-numeric:tabular-nums; font-size:13px; font-weight:700; }
  .pr-fila .c small { display:block; font-size:10.5px; font-weight:600; color:var(--text-600); }
  .pr-fila .c.malo { color:var(--danger-fg); }
  @media (max-width: 900px) { .pr-fila { grid-template-columns:34px minmax(0,1fr) 56px 56px; } .pr-fila .bar, .pr-fila .c:nth-of-type(n+5) { display:none; } .pr-fila.cabecera { display:none; } }
  .pr-mas { margin-top:8px; }

  /* calidad, pendiente, ciclo */
  .pr-fila-q { display:grid; grid-template-columns:minmax(90px,1fr) 2fr 54px; gap:10px; align-items:center; font-size:12.5px; margin-bottom:9px; }
  .pr-fila-q .b { height:8px; border-radius:99px; background:var(--ink-800); overflow:hidden; }
  .pr-fila-q .b i { display:block; height:100%; border-radius:99px; background:var(--accent); }
  .pr-fila-q .n { text-align:right; font-weight:800; font-variant-numeric:tabular-nums; }
  .pr-ahora { display:flex; flex-direction:column; gap:10px; }
  .pr-ah { padding:10px 12px; border-radius:12px; background:var(--ink-900); border:1px solid var(--ink-800); }
  .pr-ah .t { display:flex; align-items:center; gap:8px; font-weight:800; font-size:13px; }
  .pr-ah .d { font-size:12px; color:var(--text-500); margin-top:4px; }
  .pr-ah .d b { color:var(--text-100); font-variant-numeric:tabular-nums; }
  .pr-ah .quien { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .pr-ah .quien span { font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:99px; background:var(--ink-800); color:var(--text-300); }
  .pr-vieja { color:var(--danger-fg); }
  .pr-ciclo { display:flex; height:16px; border-radius:99px; overflow:hidden; background:var(--ink-800); }
  .pr-ciclo i { display:block; height:100%; }
  .pr-ciclo-leyenda { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px 12px; margin-top:12px; font-size:11.5px; color:var(--text-500); }
  .pr-ciclo-leyenda b { color:var(--text-100); font-variant-numeric:tabular-nums; }

  /* mapa de calor */
  .pr-mapa { display:grid; gap:3px; overflow-x:auto; padding-bottom:4px; }
  .pr-mapa .h, .pr-mapa .dia { font-size:10.5px; color:var(--text-500); display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .pr-mapa .dia { justify-content:flex-start; padding-right:8px; }
  .pr-mapa .cel { height:24px; border-radius:5px; background:var(--ink-800); position:relative; min-width:20px; }
  .pr-mapa .cel i { position:absolute; inset:0; border-radius:5px; background:var(--accent); }

  .pr-vacio { text-align:center; padding:34px 12px; color:var(--text-500); font-size:14px; }
  .pr-vacio b { display:block; font-size:16px; color:var(--text-300); margin-bottom:4px; }
  .pr-esq { background:linear-gradient(100deg, var(--ink-850) 30%, var(--ink-800) 50%, var(--ink-850) 70%); background-size:200% 100%; animation:pr-brillo 1.3s linear infinite; border-radius:var(--radius-card); min-height:120px; border:1px solid var(--ink-800); }
  @keyframes pr-brillo { from { background-position:200% 0; } to { background-position:-200% 0; } }
  .pr-nota { font-size:11.5px; color:var(--text-600); line-height:1.5; }
  .pr-nota b { color:var(--text-500); }
</style>

<script>
// ============================ PRODUCTIVIDAD ============================
// Datos agregados del servidor (Productividad.js) → filtros y cálculos en el
// navegador. Prefijo PR_ en todo lo global para no chocar con Index.html.

var PR_SERVICIOS_ = [
  { k: 'pc_s', n: 'Pedido cliente · sin transporte', corto: 'Pedido cliente', c: 'var(--tipo-pedido)' },
  { k: 'pc_t', n: 'Pedido cliente · con transporte', corto: 'Con transporte', c: '#22b8cf' },
  { k: 'ces', n: 'Cesión', corto: 'Cesión', c: 'var(--tipo-cesion)' },
  { k: 'ref', n: 'Refill', corto: 'Refill', c: 'var(--tipo-refill)' },
  { k: 'rev', n: 'Revisión de stock', corto: 'Revisión', c: '#f59e0b' },
];
var PR_INCIDENCIAS_ = [
  { k: 'sp', n: 'Sin palet' }, { k: 'sm', n: 'Sin mercancía' }, { k: 'oi', n: 'Otras incidencias' },
  { k: 'pa', n: 'Preparación parcial' }, { k: 'df', n: 'Diferencia en revisión' },
];
var PR_TRAMOS_ = [
  { n: 'Menos de 1 h', c: '#34d17a' }, { n: '1 a 2 h', c: '#8bdc5a' }, { n: '2 a 4 h', c: '#f5d34a' },
  { n: '4 a 8 h', c: '#f59e0b' }, { n: '8 a 24 h', c: '#ef6c4a' }, { n: 'Más de 24 h', c: '#d9304f' },
];
var PR_TIENDAS_ = { '014': { n: 'Marbella', c: 'var(--tienda-marbella)' }, '279': { n: 'Mijas', c: 'var(--tienda-mijas)' } };
var PR_CLAVE_ = 'kairos_prod_v1';

var PR_ESTADO_ = { datos: null, cargadoEn: 0, cargando: false, error: '', f: null, verTodos: false, timer: null };

// ——————————— utilidades ———————————
function PR_nf_(n, dec) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('es-ES', { maximumFractionDigits: dec === undefined ? 0 : dec, minimumFractionDigits: 0 });
}
function PR_dur_(min) {
  if (min === null || min === undefined || isNaN(min)) return '—';
  min = Math.round(min);
  if (min < 60) return min + ' min';
  if (min < 1440) { var h = Math.floor(min / 60), m = min % 60; return h + ' h' + (m ? ' ' + m + ' min' : ''); }
  var d = Math.floor(min / 1440), hh = Math.floor((min % 1440) / 60);
  return d + ' d' + (hh ? ' ' + hh + ' h' : '');
}
function PR_esc_(t) { return (typeof escHtmlSie_ === 'function') ? escHtmlSie_(t) : String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function PR_sumarDias_(dia, n) { var p = dia.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)).toISOString().slice(0, 10); }
function PR_difDias_(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }
function PR_fechaCorta_(dia) { var p = dia.split('-'); return p[2] + '/' + p[1]; }
var PR_DIAS_SEMANA_ = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
function PR_diaSemana_(dia) { return PR_DIAS_SEMANA_[new Date(dia + 'T12:00:00Z').getUTCDay()]; }
function PR_servicio_(k) { for (var i = 0; i < PR_SERVICIOS_.length; i++) { if (PR_SERVICIOS_[i].k === k) return PR_SERVICIOS_[i]; } return { k: k, n: k, corto: k, c: 'var(--text-500)' }; }
function PR_iniciales_(nombre) {
  var partes = String(nombre).split('+')[0].trim().replace(/[.]/g, ' ').split(/\s+/).filter(Boolean);
  return ((partes[0] || '?')[0] + (partes[1] ? partes[1][0] : (partes[0] || '')[1] || '')).toUpperCase();
}

// ——————————— filtros y periodos ———————————
function PR_filtrosPorDefecto_() {
  var sv = {}; PR_SERVICIOS_.forEach(function (s) { sv[s.k] = true; });
  return { periodo: '7', desde: '', hasta: '', tienda: '', servicios: sv, vista: 'equipos', operario: '' };
}
function PR_cargarFiltros_() {
  var f = PR_filtrosPorDefecto_();
  try {
    var g = JSON.parse(localStorage.getItem(PR_CLAVE_) || 'null');
    if (g) {
      if (['hoy', 'ayer', '7', '30', 'mes', 'custom'].indexOf(g.periodo) !== -1) f.periodo = g.periodo;
      if (g.desde) f.desde = g.desde; if (g.hasta) f.hasta = g.hasta;
      if (g.tienda === '014' || g.tienda === '279') f.tienda = g.tienda;
      if (g.vista === 'personas') f.vista = 'personas';
      if (g.servicios) PR_SERVICIOS_.forEach(function (s) { if (g.servicios[s.k] === false) f.servicios[s.k] = false; });
    }
  } catch (e) {}
  if (!PR_serviciosActivos_(f).length) f = PR_filtrosPorDefecto_();
  return f;
}
function PR_guardarFiltros_() { try { localStorage.setItem(PR_CLAVE_, JSON.stringify(PR_ESTADO_.f)); } catch (e) {} }
function PR_serviciosActivos_(f) { return PR_SERVICIOS_.filter(function (s) { return f.servicios[s.k]; }).map(function (s) { return s.k; }); }

/** Periodo elegido y el anterior de la misma duración (mismo nº de días). */
function PR_periodos_(f, hoy) {
  var d, h;
  if (f.periodo === 'hoy') { d = h = hoy; }
  else if (f.periodo === 'ayer') { d = h = PR_sumarDias_(hoy, -1); }
  else if (f.periodo === '7') { d = PR_sumarDias_(hoy, -6); h = hoy; }
  else if (f.periodo === '30') { d = PR_sumarDias_(hoy, -29); h = hoy; }
  else if (f.periodo === 'mes') { d = hoy.slice(0, 8) + '01'; h = hoy; }
  else { d = f.desde || PR_sumarDias_(hoy, -6); h = f.hasta || hoy; if (h < d) { var t = d; d = h; h = t; } }
  if (PR_difDias_(d, h) > 59) d = PR_sumarDias_(h, -59);
  var n = PR_difDias_(d, h) + 1;
  var pd = PR_sumarDias_(d, -n), ph = PR_sumarDias_(d, -1);
  if (f.periodo === 'mes') { // mes anterior, mismos días
    var y = +hoy.slice(0, 4), m = +hoy.slice(5, 7) - 1;
    var primero = new Date(Date.UTC(y, m - 1, 1)).toISOString().slice(0, 10);
    pd = primero; ph = PR_sumarDias_(primero, n - 1);
  }
  return { desde: d, hasta: h, n: n, prevDesde: pd, prevHasta: ph, incluyeHoy: h >= hoy, soloHoy: f.periodo === 'hoy' };
}
/** Días que hay que pedir al servidor: periodo, anterior y, como mínimo, 14 días para la tendencia. */
function PR_rangoNecesario_(f, hoy) {
  var p = PR_periodos_(f, hoy);
  var desde = p.prevDesde < PR_sumarDias_(p.hasta, -13) ? p.prevDesde : PR_sumarDias_(p.hasta, -13);
  var hasta = p.hasta > hoy ? p.hasta : hoy;
  if (PR_difDias_(desde, hasta) > 99) desde = PR_sumarDias_(hasta, -99);
  return { desde: desde, hasta: hasta };
}

// ——————————— datos ———————————
function PR_decodificar_(r) {
  var D = { generado: r.generado, hoy: r.hoy, desde: r.desde, hasta: r.hasta };
  D.L = r.L.map(function (f) { return { d: r.d[f[0]], h: f[1], t: r.t[f[2]], s: r.s[f[3]], o: r.o[f[4]], i: f[5], l: f[6], u: f[7], p: f[8] }; });

  lineas.push(['Productividad Kairos', p.desde + ' a ' + p.hasta, 'Tienda: ' + (f.tienda ? PR_TIENDAS_[f.tienda].n : 'Todas'), 'Servicios: ' + PR_serviciosActivos_(f).map(function (k) { return PR_servicio_(k).n; }).join(' / ')].map(q).join(';'));
  lineas.push('');
  lineas.push([f.vista === 'personas' ? 'Persona' : 'Equipo', 'Líneas', 'Unidades', 'Palets', 'Pedidos', 'Horas con actividad', 'Líneas por hora', '% incidencias'].map(q).join(';'));
  PR_bloqueRanking_(D, f, p).forEach(function (r) {
    lineas.push([r.o, r.l.toFixed(1).replace('.', ','), Math.round(r.u), r.p.toFixed(1).replace('.', ','), r.pedidos.toFixed(1).replace('.', ','), r.horas, r.ritmo === null ? '' : r.ritmo.toFixed(2).replace('.', ','), r.pctInc.toFixed(1).replace('.', ',')].map(q).join(';'));
  });
  lineas.push('');
  lineas.push(['Día', 'Líneas', 'Pedidos completados'].map(q).join(';'));
  var sl = PR_serieDiaria_(D, f, p.hasta, p.n, 'lineas'), sp = PR_serieDiaria_(D, f, p.hasta, p.n, 'pedidos');
  sl.forEach(function (s, i) { lineas.push([s.d, s.v.toFixed(1).replace('.', ','), sp[i].v].map(q).join(';')); });
  var texto = '﻿' + lineas.join('\r\n');
  try {
    var blob = new Blob([texto], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'productividad-' + p.desde + '-a-' + p.hasta + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch (err) {
    kAlerta('No se ha podido descargar el archivo en este dispositivo. Pruébalo desde un ordenador.');
  }
}

function PR_delegar_(ev) {
  var el = ev.target.closest ? ev.target.closest('[data-pr]') : null;
  if (!el) return;
  ev.preventDefault();
  PR_accion_(el.getAttribute('data-pr'));
}

function renderProductividad_() {
  var E = PR_ESTADO_;
  if (E.timer) { clearInterval(E.timer); E.timer = null; }
  document.getElementById('app').innerHTML = renderBrandHeaderHtml_() + renderTabsBar_() + '<div id="prRaiz"></div>';
  sincronizarPickers_();
  var raiz = document.getElementById('prRaiz');
  raiz.addEventListener('click', PR_delegar_);
  raiz.addEventListener('keydown', function (ev) { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.getAttribute && ev.target.getAttribute('role') === 'button') PR_delegar_(ev); });
  raiz.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'prOperario') { E.f.operario = t.value; PR_guardarFiltros_(); PR_pintar_(); }
    else if (t.id === 'prDesde' || t.id === 'prHasta') {
      var d = document.getElementById('prDesde').value, h = document.getElementById('prHasta').value;
      if (d && h) { E.f.desde = d; E.f.hasta = h; PR_guardarFiltros_(); PR_cargar_(false); }
    }
  });
  if (!E.f) E.f = PR_cargarFiltros_();
  PR_pintar_();
  PR_cargar_(false);
  // El periodo que incluye hoy se refresca solo cada 2 minutos mientras esta pantalla está abierta.
  E.timer = setInterval(function () {
    if (typeof VISTA === 'undefined' || VISTA.nombre !== 'volumenes' || !document.getElementById('prRaiz')) { clearInterval(E.timer); E.timer = null; return; }
    if (document.hidden) return;
    var hoy = (E.datos && E.datos.hoy) || PR_hoyMadrid_();
    if (PR_periodos_(E.f, hoy).incluyeHoy) PR_cargar_(true);
  }, 120000);
}
</script>
