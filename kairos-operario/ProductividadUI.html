<script>
// ============================ PRODUCTIVIDAD ============================
// Datos agregados del servidor (Productividad.js) → filtros y cálculos en el
// navegador. Prefijo PR_ en todo lo global para no chocar con Index.html.

var PR_SERVICIOS_ = [
  { k: 'pc_s', n: 'Pedido cliente · sin transporte', corto: 'Pedido cliente', c: 'var(--tipo-pedido)' },
  { k: 'pc_t', n: 'Pedido cliente · con transporte', corto: 'Con transporte', c: '#22b8cf' },
  { k: 'ces', n: 'Cesión', corto: 'Cesión', c: 'var(--tipo-cesion)' },
  { k: 'ref', n: 'Refill', corto: 'Refill', c: 'var(--tipo-refill)' },
  { k: 'rev', n: 'Revisión de stock', corto: 'Revisión', c: '#f59e0b' },
];
var PR_INCIDENCIAS_ = [
  { k: 'sp', n: 'Sin palet' }, { k: 'sm', n: 'Sin mercancía' }, { k: 'oi', n: 'Otras incidencias' },
  { k: 'pa', n: 'Preparación parcial' }, { k: 'df', n: 'Diferencia en revisión' },
];
var PR_TRAMOS_ = [
  { n: 'Menos de 1 h', c: '#34d17a' }, { n: '1 a 2 h', c: '#8bdc5a' }, { n: '2 a 4 h', c: '#f5d34a' },
  { n: '4 a 8 h', c: '#f59e0b' }, { n: '8 a 24 h', c: '#ef6c4a' }, { n: 'Más de 24 h', c: '#d9304f' },
];
var PR_TIENDAS_ = { '014': { n: 'Marbella', c: 'var(--tienda-marbella)' }, '279': { n: 'Mijas', c: 'var(--tienda-mijas)' } };
var PR_CLAVE_ = 'kairos_prod_v1';

var PR_ESTADO_ = { datos: null, cargadoEn: 0, cargando: false, error: '', f: null, verTodos: false, timer: null };

// ——————————— utilidades ———————————
function PR_nf_(n, dec) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('es-ES', { maximumFractionDigits: dec === undefined ? 0 : dec, minimumFractionDigits: 0 });
}
function PR_dur_(min) {

    '<div style="display:flex;flex-direction:column;gap:14px;min-width:0"><div class="pr-card"><h2>Calidad <small>incidencias del periodo</small></h2>' + PR_htmlCalidad_(calidad) + '</div>' +
    '<div class="pr-card"><h2>Rapidez de los pedidos <small>tiempo de ciclo</small></h2>' + PR_htmlCiclo_(ciclo) + '</div></div></div>';
  if (mapa) h += '<div class="pr-card"><h2>Mapa de intensidad <small>líneas por día y hora</small></h2>' + PR_htmlMapa_(mapa) + '</div>';
  h += '<p class="pr-nota"><b>Cómo se mide.</b> Los días y horas son hora de Madrid. «Ritmo» = líneas preparadas dividido por las horas en las que esa persona o equipo tuvo actividad. «Ciclo» no se calcula por persona. Los datos salen de las líneas marcadas como preparadas, los pedidos cerrados y las revisiones de palet.</p></div>';
  raiz.innerHTML = h;
  PR_ESTADO_.pintadoEn = Date.now();
  if (scroll) window.scrollTo(0, scroll);
}

// ——————————— carga, eventos, exportación ———————————
function PR_hoyMadrid_() { try { return new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/Madrid' }); } catch (e) { return new Date().toISOString().slice(0, 10); } }

/** Carga los datos. La primera vez (o si cambia el periodo y faltan días) pide el rango completo;
 *  para refrescar lo que ya hay solo pide ayer y hoy y lo mezcla (el historial no cambia, y así
 *  se gasta mucho menos de la base de datos). Cada media hora vuelve a pedirlo todo. */
function PR_cargar_(forzar, seguimiento) {
  var E = PR_ESTADO_;
  if (!E.f) E.f = PR_cargarFiltros_();
  var hoy = (E.datos && E.datos.hoy) || PR_hoyMadrid_();
  var necesario = PR_rangoNecesario_(E.f, hoy);
  var cubre = !!(E.datos && E.datos.desde <= necesario.desde && E.datos.hasta >= necesario.hasta);
  var edad = Date.now() - E.cargadoEn;
  if (cubre && !forzar && edad < 90000) { PR_pintar_(); return; }
  if (E.cargando) return;
  var parcial = cubre && (Date.now() - (E.completoEn || 0)) < 1800000;
  var ahoraMadrid = PR_hoyMadrid_(), hasta = ahoraMadrid > hoy ? ahoraMadrid : hoy;
  var pedido = parcial ? { desde: PR_sumarDias_(hasta, -1), hasta: hasta } : necesario;
  E.cargando = true; E.error = '';
  if (E.datos) PR_pintar_(); // "actualizando…" sin perder lo que se ve
  google.script.run
    .withSuccessHandler(function (json) {
      E.cargando = false;
      try {
        var N = PR_decodificar_(JSON.parse(json));
        if (parcial && E.datos) PR_mezclar_(E.datos, N); else { E.datos = N; E.completoEn = Date.now(); }
        E.cargadoEn = Date.now(); E.error = '';
      } catch (err) { E.error = 'Los datos no tienen el formato esperado.'; }
      PR_pintar_();
      // si mientras tanto el periodo pedía más días, se vuelve a cargar
      if (!E.error && E.datos && !seguimiento) { var n2 = PR_rangoNecesario_(E.f, E.datos.hoy); if (E.datos.desde > n2.desde || E.datos.hasta < n2.hasta) PR_cargar_(true, true); }
    })
    .withFailureHandler(function (err) {
      E.cargando = false; E.error = (err && err.message) || 'Error de conexión.';
      PR_pintar_();
    })
    .obtenerProductividad(pedido.desde, pedido.hasta);
}

function PR_accion_(texto, valorSelect) {
  var E = PR_ESTADO_, f = E.f, i = texto.indexOf(':'), tipo = texto.slice(0, i), v = texto.slice(i + 1);
  if (tipo === 'periodo') { f.periodo = v; if (v === 'custom' && !f.desde) { var hoy = (E.datos && E.datos.hoy) || PR_hoyMadrid_(); f.desde = PR_sumarDias_(hoy, -6); f.hasta = hoy; } }
  else if (tipo === 'tienda') f.tienda = v;
  else if (tipo === 'vista') { f.vista = v; f.operario = ''; }
  else if (tipo === 'serv') { f.servicios[v] = !f.servicios[v]; if (!PR_serviciosActivos_(f).length) f.servicios[v] = true; }
  else if (tipo === 'solo') { var todosOn = PR_serviciosActivos_(f).length === 1 && f.servicios[v]; PR_SERVICIOS_.forEach(function (s) { f.servicios[s.k] = todosOn ? true : s.k === v; }); }
  else if (tipo === 'persona') f.operario = f.operario === v ? '' : v;
  else if (tipo === 'ver') E.verTodos = !E.verTodos;
  else if (tipo === 'reiniciar') { E.f = PR_filtrosPorDefecto_(); }
  else if (tipo === 'jt') f.jt = (v === 'm' || v === 't') ? v : '';
  else if (tipo === 'jm') f.jm = PR_metricaJefe_(v).k;
  else if (tipo === 'asig') { var q = v.split('|'); if (q.length === 3) PR_asignar_(q[0], q[1], q[2]); return; }
  else if (tipo === 'cal') { E.editor = !E.editor; PR_pintar_(); return; }
  else if (tipo === 'hist') { PR_historial_(); return; }
  else if (tipo === 'recargar') { PR_cargar_(true); return; }
  else if (tipo === 'csv') { PR_csv_(); return; }
  PR_guardarFiltros_();
  PR_cargar_(false);
}

/** Muestra u oculta los últimos cambios de la asignación de turnos (se piden al abrirlos). */
function PR_historial_() {
  var E = PR_ESTADO_;
  if (E.historial) { E.historial = null; PR_pintar_(); return; }
  E.historial = 'cargando'; PR_pintar_();
  google.script.run
    .withSuccessHandler(function (json) { try { E.historial = JSON.parse(json); } catch (err) { E.historial = []; } PR_pintar_(); })
    .withFailureHandler(function () { E.historial = null; PR_pintar_(); kAlerta('No se han podido cargar los últimos cambios.'); })
    .obtenerHistorialTurnos();
}

function PR_csv_() {
  var E = PR_ESTADO_, D = E.datos; if (!D) return;
  var f = E.f, p = PR_periodos_(f, D.hoy), lineas = [];
  var q = function (t) { return '"' + String(t).replace(/"/g, '""') + '"'; };
  lineas.push(['Productividad Kairos', p.desde + ' a ' + p.hasta, 'Tienda: ' + (f.tienda ? PR_TIENDAS_[f.tienda].n : 'Todas'), 'Servicios: ' + PR_serviciosActivos_(f).map(function (k) { return PR_servicio_(k).n; }).join(' / ')].map(q).join(';'));
  lineas.push('');
  lineas.push([f.vista === 'personas' ? 'Persona' : 'Equipo', 'Líneas', 'Unidades', 'Palets', 'Pedidos', 'Horas con actividad', 'Líneas por hora', '% incidencias'].map(q).join(';'));
  PR_bloqueRanking_(D, f, p).forEach(function (r) {
    lineas.push([r.o, r.l.toFixed(1).replace('.', ','), Math.round(r.u), r.p.toFixed(1).replace('.', ','), r.pedidos.toFixed(1).replace('.', ','), r.horas, r.ritmo === null ? '' : r.ritmo.toFixed(2).replace('.', ','), r.pctInc.toFixed(1).replace('.', ',')].map(q).join(';'));
  });
  var J = PR_bloqueJefes_(D, f, p);
  if (!J.bloqueado && J.lista.length) {
    var nf = function (n, d) { return n === null ? '' : Number(n).toFixed(d).replace('.', ','); };
    lineas.push('');
    lineas.push(['Jefe de turno', 'Turnos', 'Turnos de mañana', 'Turnos de tarde', 'Pedidos', 'Pedidos por turno', 'Líneas', 'Líneas por turno', 'Personas por turno', 'Líneas por hora', '% incidencias', 'Índice vs media del turno (' + J.met.n + ')'].map(q).join(';'));
    J.lista.forEach(function (j) {
      var t = j.tot;
      lineas.push([j.nombre, t.tur, j.s.m.tur, j.s.t.tur, t.ped, nf(t.tur ? t.ped / t.tur : null, 2), nf(t.lin, 1), nf(t.tur ? t.lin / t.tur : null, 1), nf(j.personasMedia, 1), nf(j.ritmo, 2), nf(j.pctInc, 1), nf(j.indice, 2)].map(q).join(';'));
    });
    if (J.sin.n) lineas.push(['(sin jefe)', J.sin.n, '', '', J.sin.ped, '', nf(J.sin.lin, 1), '', '', '', '', ''].map(q).join(';'));
  }
  lineas.push('');
  lineas.push(['Día', 'Líneas', 'Pedidos completados'].map(q).join(';'));
  var sl = PR_serieDiaria_(D, f, p.hasta, p.n, 'lineas'), sp = PR_serieDiaria_(D, f, p.hasta, p.n, 'pedidos');
  sl.forEach(function (s, i) { lineas.push([s.d, s.v.toFixed(1).replace('.', ','), sp[i].v].map(q).join(';')); });
  var texto = '﻿' + lineas.join('\r\n');
  try {
    var blob = new Blob([texto], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'productividad-' + p.desde + '-a-' + p.hasta + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch (err) {
    kAlerta('No se ha podido descargar el archivo en este dispositivo. Pruébalo desde un ordenador.');
  }
}

function PR_delegar_(ev) {
  var el = ev.target.closest ? ev.target.closest('[data-pr]') : null;
  if (!el) return;
  ev.preventDefault();
  PR_accion_(el.getAttribute('data-pr'));
}

function renderProductividad_() {
  var E = PR_ESTADO_;
  if (E.timer) { clearInterval(E.timer); E.timer = null; }
  document.getElementById('app').innerHTML = renderBrandHeaderHtml_() + renderTabsBar_() + '<div id="prRaiz"></div>';
  sincronizarPickers_();
  var raiz = document.getElementById('prRaiz');
  raiz.addEventListener('click', PR_delegar_);
  raiz.addEventListener('keydown', function (ev) { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.getAttribute && ev.target.getAttribute('role') === 'button') PR_delegar_(ev); });
  raiz.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'prOperario') { E.f.operario = t.value; PR_guardarFiltros_(); PR_pintar_(); }
    else if (t.id === 'prDesde' || t.id === 'prHasta') {
      var d = document.getElementById('prDesde').value, h = document.getElementById('prHasta').value;
      if (d && h) { E.f.desde = d; E.f.hasta = h; PR_guardarFiltros_(); PR_cargar_(false); }
    }
  });
  if (!E.f) E.f = PR_cargarFiltros_();
  PR_pintar_();
  PR_cargar_(false);
  // El periodo que incluye hoy se refresca solo cada 2 minutos mientras esta pantalla está abierta.
  E.timer = setInterval(function () {
    if (typeof VISTA === 'undefined' || VISTA.nombre !== 'volumenes' || !document.getElementById('prRaiz')) { clearInterval(E.timer); E.timer = null; return; }
    if (document.hidden) return;
    var hoy = (E.datos && E.datos.hoy) || PR_hoyMadrid_();
    if (PR_periodos_(E.f, hoy).incluyeHoy) PR_cargar_(true);
  }, 180000);
}
</script>
