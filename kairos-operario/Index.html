<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    select, input, button { font-size: 16px; padding: 8px; margin: 4px 0; }
    button { cursor: pointer; background: #1565c0; color: white; border: none; border-radius: 4px; padding: 10px 16px; }
    button.secundario { background: #757575; }
    button.aviso { background: #ef6c00; }
    button.peligro { background: #c62828; }
    .fila { background: white; border-radius: 6px; padding: 12px; margin-bottom: 8px; cursor: pointer; border-left: 6px solid #ccc; }
    .fila .tipo { font-weight: bold; }
    .fila .meta { color: #666; font-size: 13px; }
    .linea { background: white; border-radius: 6px; padding: 10px; margin-bottom: 6px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; }
    .linea.preparada { opacity: 0.5; }
    .linea label { flex: 1; }
    .filtros { margin-bottom: 12px; }
    .volver { margin-bottom: 12px; display: inline-block; }
    #operarioBar { background: #fff3e0; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
    #app { max-width: 480px; margin: 0 auto; }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .tabs a { padding: 6px 12px; border-radius: 6px; text-decoration: none; color: #333; background: #e0e0e0; font-size: 14px; }
    .tabs a.activa { background: #1565c0; color: #fff; }
  </style>
</head>
<body>
  <div id="app">Cargando…</div>

  <script>
    var OPERARIO = localStorage.getItem('kairos_operario') || '';
    var ROL = localStorage.getItem('kairos_rol') || 'operario';
    var VISTA = { nombre: 'cola', peticionId: null };
    var CFG_TIENDA_COLOR = { '036': '#2e7d32', '014': '#1565c0', '279': '#6a1b9a' };
    var CFG_TIENDA_NOMBRE = { '036': 'Málaga', '014': 'Marbella', '279': 'Mijas' };
    var ultimoDetalle = null; // {peticion, lineas} con sscc ya asignado — usado por el clic de marcar
    var vistaLinea = {}; // lineaId -> 'pregunta' | 'tipos' | 'motivo' (ausente = vista normal)
    var INCIDENCIAS = ['Sin Palet', 'Sin Mercancía', 'Otras Incidencias'];

    var CFG_SHORTCUTS = {
      // TRANSFERS — reutiliza el shortcut YA configurado en el dispositivo
      // Android del operario para PreparacionPedidosPC (misma operación).
      STOCK_SHORTCUT_ID: 'b02c92a5-ca50-418f-93e9-4a7e8770cdfb',
      // move-to-address a 05-XP1-A-1-10-A — shortcut NUEVO, pendiente de
      // crear con Pedro. Rellenar el ID real tras crearlo.
      SHORTCUT_ID_REFILL: 'PENDIENTE-crear-con-Pedro',
    };

    function render() {
      if (!OPERARIO) return renderElegirOperario();
      if (VISTA.nombre === 'cola') return renderCola();
      if (VISTA.nombre === 'detalle') return renderDetalle();
      if (VISTA.nombre === 'stock') return renderStock();
      if (VISTA.nombre === 'estado') return renderEstado();
      if (VISTA.nombre === 'panel') return renderPanel();
      if (VISTA.nombre === 'volumenes') return renderVolumenes();
    }

    function renderTabsBar_() {
      if (ROL !== 'jefe_equipo') return '';
      var tabs = [
        { nombre: 'cola', label: 'Peticiones' },
        { nombre: 'stock', label: 'Stock' },
        { nombre: 'estado', label: 'Estado' },
        { nombre: 'panel', label: 'Panel' },
        { nombre: 'volumenes', label: 'Volúmenes' },
      ];
      return '<div class="tabs">' + tabs.map(function (t) {
        return '<a href="#" class="' + (VISTA.nombre === t.nombre ? 'activa' : '') +
          '" onclick="event.preventDefault(); VISTA={nombre:\'' + t.nombre + '\',peticionId:null}; render();">' + t.label + '</a>';
      }).join('') + '</div>';
    }

    function renderElegirOperario() {
      document.getElementById('app').innerHTML = '<h1>Kairos · Operario</h1><p>¿Quién eres?</p><select id="selOperario"><option value="">Cargando…</option></select>';
      google.script.run.withSuccessHandler(function (json) {
        const operarios = JSON.parse(json);
        const sel = document.getElementById('selOperario');
        sel.innerHTML = '<option value="">-- elige --</option>' +
          operarios.map(function (o) { return '<option value="' + o.nombre + '" data-rol="' + o.rol + '">' + o.nombre + '</option>'; }).join('');
        sel.onchange = function () {
          if (!sel.value) return;
          OPERARIO = sel.value;
          ROL = sel.options[sel.selectedIndex].getAttribute('data-rol') || 'operario';
          localStorage.setItem('kairos_operario', OPERARIO);
          localStorage.setItem('kairos_rol', ROL);
          render();
        };
      }).listarOperarios();
    }

    function renderCola() {
      document.getElementById('app').innerHTML =
        renderTabsBar_() +
        '<h1>Kairos · Operario</h1>' +
        '<div id="operarioBar">' + OPERARIO + ' — <a href="#" id="cambiarOperario">cambiar</a></div>' +
        '<div class="filtros">' +
        '<select id="filtroTienda"><option value="">Todas las tiendas</option><option value="014">Marbella</option><option value="279">Mijas</option><option value="036">Málaga</option></select> ' +
        '<select id="filtroTipo"><option value="">Todos los tipos</option><option value="pedido_cliente">Pedido cliente</option><option value="cesion">Cesión</option><option value="refill">Refill</option></select>' +
        '</div>' +
        '<div id="listaCola">Cargando…</div>';

      document.getElementById('cambiarOperario').onclick = function (e) {
        e.preventDefault();
        OPERARIO = ''; ROL = 'operario';
        localStorage.removeItem('kairos_operario');
        localStorage.removeItem('kairos_rol');
        render();
      };
      document.getElementById('filtroTienda').onchange = cargarCola;
      document.getElementById('filtroTipo').onchange = cargarCola;
      cargarCola();
    }

    function cargarCola() {
      const tienda = document.getElementById('filtroTienda').value;
      const tipo = document.getElementById('filtroTipo').value;
      google.script.run.withSuccessHandler(function (json) {
        const peticiones = JSON.parse(json);
        const cont = document.getElementById('listaCola');
        if (!peticiones.length) { cont.innerHTML = '<p>No hay peticiones pendientes.</p>'; return; }
        const normales = peticiones.filter(function (p) { return !p.cola_individual; });
        const individuales = peticiones.filter(function (p) { return p.cola_individual; });
        function filaHtml(p) {
          const etiquetaTipo = p.tipo === 'pedido_cliente' ? ('Pedido cliente ' + (p.num_pedido || '')) : (p.tipo === 'cesion' ? 'Cesión → ' + p.tiendaDestinoNombre : 'Refill');
          return '<div class="fila" style="border-left-color:' + (CFG_TIENDA_COLOR[p.tienda_origen] || '#ccc') + '" onclick="abrirDetalle(\'' + p.id + '\')">' +
            '<div class="tipo">' + etiquetaTipo + '</div>' +
            '<div class="meta">' + p.tiendaNombre + ' · ' + p.lineasPreparadas + '/' + p.totalLineas + ' líneas</div>' +
            '</div>';
        }
        var html = normales.map(filaHtml).join('');
        if (individuales.length) {
          html += '<h3>Individual</h3>' + individuales.map(filaHtml).join('');
        }
        cont.innerHTML = html;
      }).listarCola(tienda || null, tipo || null);
    }

    function abrirDetalle(id) {
      VISTA = { nombre: 'detalle', peticionId: id };
      render();
    }

    function renderDetalle() {
      document.getElementById('app').innerHTML = '<div class="volver"><a href="#" id="volverCola">← Cola</a></div><div id="detalleBody">Cargando…</div>';
      document.getElementById('volverCola').onclick = function (e) { e.preventDefault(); VISTA = { nombre: 'cola', peticionId: null }; render(); };
      google.script.run.withSuccessHandler(pintarDetalle).obtenerPeticion(VISTA.peticionId);
    }

    function pintarDetalle(json) {
      ultimoDetalle = JSON.parse(json);
      vistaLinea = {};
      renderDetalleBody_();
    }

    function renderDetalleBody_() {
      const p = ultimoDetalle.peticion;
      var titulo = p.tipo === 'pedido_cliente' ? ('Pedido cliente ' + (p.num_pedido || '')) : (p.tipo === 'cesion' ? ('Cesión → ' + p.tiendaDestinoNombre) : ('Refill: ' + (p.motivo || '')));

      var html = '<h1>' + titulo + '</h1><p class="meta">' + p.tiendaNombre + '</p>';
      html += ultimoDetalle.lineas.map(function (l) { return renderLineaHtml_(p, l); }).join('');

      if (p.tipo === 'pedido_cliente' || p.tipo === 'cesion') {
        html += '<h3>Estado</h3><div id="estadoDetalle" class="meta">Cargando…</div>';
      }

      if (p.estado === 'a_ubicar') {
        html += '<h3>A ubicar</h3><input type="text" id="ubicacion" placeholder="Ubicación de consolidación"> <button onclick="guardarUbicacion(\'' + p.id + '\')">Guardar</button>';
      } else if (p.estado === 'cerrada') {
        html += '<p><strong>Petición completada.</strong></p>';
      }

      document.getElementById('detalleBody').innerHTML = html;

      const contEstado = document.getElementById('estadoDetalle');
      if (contEstado) {
        google.script.run.withSuccessHandler(function (json) {
          const fila = JSON.parse(json).filter(function (x) { return x.id === p.id; })[0];
          contEstado.textContent = fila
            ? ('HODOS: ' + (fila.hodosOk ? 'etiqueta creada' : 'sin etiqueta') + ' · Carta de Portes: ' + (fila.porteEstado || 'sin carta todavía'))
            : 'Sin datos.';
        }).listarEstadoPeticiones();
      }
    }

    function renderLineaHtml_(p, l) {
      const cabecera = l.codigo_lm + ' — ' + (l.designacion || '') + ' (' + l.cantidad + ' ' + l.unidad_medida + ')';
      var extraInfo = '';
      if (l.avisoStock) extraInfo = '<div class="meta" style="color:#c62828;">⚠️ ' + l.avisoStock + '</div>';
      else if (l.ubicacion) extraInfo = '<div class="meta">📍 ' + l.ubicacion + '</div>';

      const preparada = l.estado_preparacion === 'preparado';
      if (preparada) {
        const resumen = l.estado_negocio ? (l.estado_negocio + (l.incidencia_motivo ? ' — ' + l.incidencia_motivo : '')) : '';
        var botonDeshacer = '';
        if (p.tipo === 'pedido_cliente' || p.tipo === 'cesion') {
          botonDeshacer = ' <button class="secundario" onclick="deshacerLinea(\'' + l.id + '\')">Deshacer</button>';
        }
        return '<div class="linea preparada"><div>' + cabecera + '</div>' + extraInfo +
          '<div class="meta">✓ Preparada' + (resumen ? ' · ' + resumen : '') + '</div>' + botonDeshacer + '</div>';
      }

      const bloqueada = !l.sscc;

      if (p.tipo === 'refill') {
        return '<div class="linea"><label><input type="checkbox" ' + (bloqueada ? 'disabled' : '') + ' onchange="marcarLinea(\'' + l.id + '\', this)"> ' + cabecera + '</label>' + extraInfo + '</div>';
      }

      // pedido_cliente / cesion: flujo de incidencia
      if (bloqueada) {
        return '<div class="linea"><div>' + cabecera + '</div>' + extraInfo + '</div>';
      }

      const vista = vistaLinea[l.id];

      if (vista === 'motivo') {
        return '<div class="linea"><div>' + cabecera + '</div>' +
          '<input type="text" id="motivo-' + l.id + '" placeholder="Motivo de la incidencia"> ' +
          '<button onclick="confirmarOtrasIncidencias(\'' + l.id + '\')">Confirmar</button> ' +
          '<button class="secundario" onclick="verIncidenciaTipos(\'' + l.id + '\')">‹ Volver</button></div>';
      }
      if (vista === 'tipos') {
        return '<div class="linea"><div>' + cabecera + '</div>' +
          '<button class="aviso" onclick="cerrarLinea(\'' + l.id + '\', \'Sin Palet\', \'\')">Sin Palet</button> ' +
          '<button class="peligro" onclick="cerrarLinea(\'' + l.id + '\', \'Sin Mercancía\', \'\')">Sin Mercancía</button> ' +
          '<button class="secundario" onclick="verIncidenciaMotivo(\'' + l.id + '\')">Otras Incidencias</button> ' +
          '<button class="secundario" onclick="verIncidenciaPregunta(\'' + l.id + '\')">‹ Volver</button></div>';
      }
      if (vista === 'pregunta') {
        return '<div class="linea"><div>' + cabecera + '</div>' +
          '<button onclick="cerrarLinea(\'' + l.id + '\', \'\', \'\')">Sin incidencia</button> ' +
          '<button class="secundario" onclick="verIncidenciaTipos(\'' + l.id + '\')">⚠ Con incidencia</button></div>';
      }
      return '<div class="linea"><div>' + cabecera + '</div>' + extraInfo +
        '<button onclick="verIncidenciaPregunta(\'' + l.id + '\')">Marcar preparada</button></div>';
    }

    function verIncidenciaPregunta(lineaId) { vistaLinea[lineaId] = 'pregunta'; renderDetalleBody_(); }
    function verIncidenciaTipos(lineaId) { vistaLinea[lineaId] = 'tipos'; renderDetalleBody_(); }
    function verIncidenciaMotivo(lineaId) { vistaLinea[lineaId] = 'motivo'; renderDetalleBody_(); }

    function confirmarOtrasIncidencias(lineaId) {
      const input = document.getElementById('motivo-' + lineaId);
      const texto = (input.value || '').trim();
      if (!texto) { input.focus(); return; }
      cerrarLinea(lineaId, 'Otras Incidencias', texto);
    }

    function cerrarLinea(lineaId, incidencia, motivo) {
      delete vistaLinea[lineaId];
      dispararPuenteMyIsoSiProcede_(lineaId, !!incidencia);
      google.script.run
        .withSuccessHandler(function () { renderDetalle(); })
        .withFailureHandler(function (err) { alert(err.message); })
        .marcarLineaPreparada(lineaId, OPERARIO, incidencia, motivo);
    }

    function deshacerLinea(lineaId) {
      google.script.run
        .withSuccessHandler(function () { renderDetalle(); })
        .withFailureHandler(function (err) { alert(err.message); })
        .deshacerLineaPreparada(lineaId, OPERARIO);
    }

    function marcarLinea(lineaId, checkbox) {
      checkbox.disabled = true;
      dispararPuenteMyIsoSiProcede_(lineaId, false);
      google.script.run
        .withSuccessHandler(function () { renderDetalle(); })
        .withFailureHandler(function (err) { alert(err.message); checkbox.disabled = false; checkbox.checked = false; })
        .marcarLineaPreparada(lineaId, OPERARIO);
    }

    // Debe llamarse SÍNCRONAMENTE dentro del onclick — si se dispara tras la
    // respuesta de google.script.run (async), el navegador bloquea el salto
    // a http-shortcuts:// en silencio. Por eso usa ultimoDetalle (ya en
    // memoria desde que se abrió el detalle) y no espera nada del servidor.
    // incidenciaMarcada: true/false para la línea que se está cerrando AHORA
    // (su estado_negocio aún no está en ultimoDetalle — el resto de líneas sí).
    function dispararPuenteMyIsoSiProcede_(lineaIdMarcada, incidenciaMarcada) {
      if (!ultimoDetalle) return;
      const p = ultimoDetalle.peticion;
      const lineas = ultimoDetalle.lineas;

      if (p.tipo === 'refill') {
        const l = lineas.filter(function (x) { return x.id === lineaIdMarcada; })[0];
        if (!l || !l.sscc) return;
        dispararMoveToAddress_([limpiarSscc(l.sscc)], p.tienda_origen);
        return;
      }

      if (p.tipo === 'pedido_cliente' || p.tipo === 'cesion') {
        const quedanPendientes = lineas.some(function (x) {
          return x.id !== lineaIdMarcada && x.estado_preparacion !== 'preparado';
        });
        if (quedanPendientes) return;

        function esIncidencia(l) {
          return l.id === lineaIdMarcada ? !!incidenciaMarcada : INCIDENCIAS.indexOf(l.estado_negocio) !== -1;
        }

        const transfers = [];
        lineas.forEach(function (l) {
          if (esIncidencia(l)) return;
          parsearSsccMulti(l.sscc, l.cantidad).forEach(function (parte) {
            if (!parte.sscc || !parte.cantidad) return;
            transfers.push({
              source: limpiarSscc(parte.sscc), sourceType: 'CONTAINER',
              stock: { productId: l.codigo_lm, quantity: parte.cantidad, measureUnit: 'EA', lotId: null, expirationDate: null, blocking: null },
            });
          });
        });
        dispararTransfers_(transfers, p.tienda_origen);
      }
    }

    function limpiarSscc(sscc) { return String(sscc || '').replace(/^0+/, ''); }

    // Espejo de _parseSsccMulti_ (StockAsignacion.js) — "sscc1 (Xud) + sscc2 (Yud)".
    function parsearSsccMulti(valorSscc, cantidadFila) {
      var raw = String(valorSscc || '').trim();
      if (!raw) return [];
      var partes = raw.indexOf(' + ') === -1 ? [raw] : raw.split(' + ');
      return partes.map(function (parte) {
        var m = parte.trim().match(/^(.+?)\s*\((\d+(?:[.,]\d+)?)\s*ud\)$/);
        if (m) return { sscc: m[1].trim(), cantidad: Number(m[2].replace(',', '.')) || 0 };
        return { sscc: parte.trim(), cantidad: partes.length === 1 ? (Number(cantidadFila) || 0) : 0 };
      });
    }

    function dispararTransfers_(transfers, tienda) {
      if (!transfers.length) return;
      var url = 'http-shortcuts://' + CFG_SHORTCUTS.STOCK_SHORTCUT_ID +
        '?TRANSFERS=' + encodeURIComponent(JSON.stringify(transfers)) +
        '&TIENDA=' + encodeURIComponent(tienda);
      window.location.href = url;
    }

    function dispararMoveToAddress_(ssccList, tienda) {
      if (!CFG_SHORTCUTS.SHORTCUT_ID_REFILL || CFG_SHORTCUTS.SHORTCUT_ID_REFILL.indexOf('PENDIENTE') === 0) return;
      var url = 'http-shortcuts://' + CFG_SHORTCUTS.SHORTCUT_ID_REFILL +
        '?SSCC_LIST=' + encodeURIComponent(JSON.stringify(ssccList)) +
        '&TIENDA=' + encodeURIComponent(tienda);
      window.location.href = url;
    }

    function guardarUbicacion(peticionId) {
      const ubicacion = document.getElementById('ubicacion').value;
      google.script.run
        .withSuccessHandler(function () { renderDetalle(); })
        .withFailureHandler(function (err) { alert(err.message); })
        .guardarUbicacionConsolidacion(peticionId, ubicacion);
    }

    function renderStock() {
      document.getElementById('app').innerHTML = renderTabsBar_() +
        '<h1>Stock</h1>' +
        '<input type="text" id="inBuscarStock" placeholder="Código LM"> ' +
        '<button onclick="buscarStockUI()">Buscar</button>' +
        '<div id="resultadoStock"></div>';
      document.getElementById('inBuscarStock').onkeydown = function (e) { if (e.key === 'Enter') buscarStockUI(); };
      document.getElementById('inBuscarStock').focus();
    }

    function buscarStockUI() {
      const codigo = document.getElementById('inBuscarStock').value.trim();
      const cont = document.getElementById('resultadoStock');
      if (!codigo) { cont.innerHTML = ''; return; }
      cont.innerHTML = '<p class="meta">Buscando…</p>';
      google.script.run
        .withSuccessHandler(function (json) {
          const filas = JSON.parse(json);
          if (!filas.length) { cont.innerHTML = '<p>Sin stock para ese código.</p>'; return; }
          const total = filas.reduce(function (s, f) { return s + Number(f.cantidad); }, 0);
          cont.innerHTML = '<p><strong>Total: ' + total + ' ud</strong></p>' +
            filas.map(function (f) {
              return '<div class="linea"><div>' + (CFG_TIENDA_NOMBRE[f.tienda] || f.tienda) + ' — ' + f.cantidad + ' ud</div>' +
                '<div class="meta">' + f.sscc + ' · ' + f.ubicacion + '</div></div>';
            }).join('');
        })
        .withFailureHandler(function (err) { cont.innerHTML = '<p style="color:#c62828;">' + err.message + '</p>'; })
        .buscarStock(codigo);
    }

    function renderEstado() {
      document.getElementById('app').innerHTML = renderTabsBar_() +
        '<h1>Estado (HODOS + Carta de Portes)</h1><div id="listaEstado">Cargando…</div>';
      google.script.run.withSuccessHandler(function (json) {
        const peticiones = JSON.parse(json);
        const cont = document.getElementById('listaEstado');
        if (!peticiones.length) { cont.innerHTML = '<p>No hay peticiones.</p>'; return; }
        cont.innerHTML = peticiones.map(function (p) {
          const etiquetaTipo = p.tipo === 'pedido_cliente' ? ('Pedido cliente ' + (p.num_pedido || '')) : (p.tipo === 'cesion' ? 'Cesión → ' + (CFG_TIENDA_NOMBRE[p.tienda_destino] || p.tienda_destino) : 'Refill');
          return '<div class="fila" onclick="abrirDetalle(\'' + p.id + '\')">' +
            '<div class="tipo">' + etiquetaTipo + '</div>' +
            '<div class="meta">' + p.tiendaNombre + ' · HODOS: ' + (p.hodosOk ? '✓' : '—') +
            ' · Porte: ' + (p.porteEstado || '—') + '</div></div>';
        }).join('');
      }).listarEstadoPeticiones();
    }

    function renderPanel() {
      document.getElementById('app').innerHTML = renderTabsBar_() +
        '<h1>Panel</h1>' +
        '<h3>Todas las peticiones</h3><div id="listaTodas">Cargando…</div>' +
        '<h3>Etiquetas HODOS creadas</h3><div id="listaEtiquetas">Cargando…</div>';
      cargarTodasPeticiones_();
      cargarEtiquetasHodos_();
    }

    function cargarTodasPeticiones_() {
      google.script.run.withSuccessHandler(function (json) {
        const peticiones = JSON.parse(json);
        const cont = document.getElementById('listaTodas');
        if (!peticiones.length) { cont.innerHTML = '<p>No hay peticiones.</p>'; return; }
        cont.innerHTML = peticiones.map(function (p) {
          const etiquetaTipo = p.tipo === 'pedido_cliente' ? ('Pedido cliente ' + (p.num_pedido || '')) : (p.tipo === 'cesion' ? 'Cesión → ' + (CFG_TIENDA_NOMBRE[p.tienda_destino] || p.tienda_destino) : 'Refill');
          var botonReintentar = '';
          if (p.necesitaHodos && !p.tieneHodos && p.estado === 'cerrada') {
            botonReintentar = ' <button class="secundario" onclick="event.stopPropagation(); reintentarHodosUI(\'' + p.id + '\', this)">Reintentar HODOS</button>';
          }
          var botonIndividual = '';
          if (p.tipo !== 'refill' && (p.estado === 'pendiente' || p.estado === 'en_preparacion')) {
            botonIndividual = ' <button class="secundario" onclick="event.stopPropagation(); marcarColaIndividualUI(\'' + p.id + '\', ' + (!p.cola_individual) + ', this)">' +
              (p.cola_individual ? 'Volver a normal' : 'Mover a individual') + '</button>';
          }
          return '<div class="fila" onclick="abrirDetalle(\'' + p.id + '\')">' +
            '<div class="tipo">' + etiquetaTipo + '</div>' +
            '<div class="meta">' + p.tiendaNombre + ' · ' + p.lineasPreparadas + '/' + p.totalLineas + ' líneas · ' + p.estado + (p.cola_individual ? ' · individual' : '') + botonReintentar + botonIndividual + '</div></div>';
        }).join('');
      }).listarTodasPeticiones();
    }

    function cargarEtiquetasHodos_() {
      google.script.run.withSuccessHandler(function (json) {
        const etiquetas = JSON.parse(json);
        const cont = document.getElementById('listaEtiquetas');
        if (!etiquetas.length) { cont.innerHTML = '<p>Sin etiquetas todavía.</p>'; return; }
        cont.innerHTML = etiquetas.map(function (e) {
          return '<div class="linea"><div>' + (e.numero_pedido || '(sin nº)') + ' → ' + e.destino + '</div>' +
            '<div class="meta">' + e.id_unico + ' · ' + e.estado + ' · ' + new Date(e.fecha_creacion).toLocaleString('es-ES') + '</div></div>';
        }).join('');
      }).listarEtiquetasHodos();
    }

    function reintentarHodosUI(peticionId, boton) {
      boton.disabled = true; boton.textContent = 'Enviando…';
      google.script.run
        .withSuccessHandler(function () { cargarTodasPeticiones_(); cargarEtiquetasHodos_(); })
        .withFailureHandler(function (err) { alert(err.message); boton.disabled = false; boton.textContent = 'Reintentar HODOS'; })
        .reintentarHodos(peticionId);
    }

    function marcarColaIndividualUI(peticionId, valor, boton) {
      boton.disabled = true;
      google.script.run
        .withSuccessHandler(function () { cargarTodasPeticiones_(); })
        .withFailureHandler(function (err) { alert(err.message); boton.disabled = false; })
        .marcarColaIndividual(peticionId, valor);
    }

    function renderVolumenes() {
      document.getElementById('app').innerHTML = renderTabsBar_() +
        '<h1>Volúmenes de trabajo</h1>' +
        '<h3>Hoy</h3><div id="volHoy">Cargando…</div>' +
        '<h3>Últimos 14 días</h3><div id="volHistorico">Cargando…</div>';

      google.script.run.withSuccessHandler(function (json) {
        const datos = JSON.parse(json);
        const cont = document.getElementById('volHoy');
        if (!datos.filas.length) { cont.innerHTML = '<p>Sin líneas preparadas hoy todavía.</p>'; return; }
        var html = '<table style="width:100%;border-collapse:collapse;background:#fff;"><tr><th style="text-align:left;padding:4px;">Operario</th>' +
          datos.horas.map(function (h) { return '<th style="padding:4px;">' + h + 'h</th>'; }).join('') +
          '<th style="padding:4px;">Total</th></tr>';
        html += datos.filas.map(function (f) {
          return '<tr><td style="padding:4px;">' + f.operario + '</td>' +
            f.porHora.map(function (n) { return '<td style="padding:4px;text-align:center;">' + (n || '') + '</td>'; }).join('') +
            '<td style="padding:4px;text-align:center;font-weight:bold;">' + f.total + '</td></tr>';
        }).join('');
        html += '</table>';
        cont.innerHTML = html;
      }).listarVolumenesHoy();

      google.script.run.withSuccessHandler(function (json) {
        const dias = JSON.parse(json);
        const cont = document.getElementById('volHistorico');
        if (!dias.length) { cont.innerHTML = '<p>Sin datos todavía.</p>'; return; }
        const max = Math.max.apply(null, dias.map(function (d) { return d.total; }));
        cont.innerHTML = '<div style="display:flex;align-items:flex-end;gap:4px;height:120px;background:#fff;padding:8px;border-radius:6px;">' +
          dias.map(function (d) {
            const alturaPct = max ? Math.round((d.total / max) * 100) : 0;
            return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">' +
              '<div style="font-size:11px;">' + d.total + '</div>' +
              '<div style="width:100%;background:#1565c0;height:' + alturaPct + '%;min-height:2px;"></div>' +
              '<div style="font-size:10px;color:#666;">' + d.dia.slice(5) + '</div></div>';
          }).join('') + '</div>';
      }).listarVolumenesHistorico();
    }

    document.addEventListener('DOMContentLoaded', function () { render(); });
  </script>
</body>
</html>
