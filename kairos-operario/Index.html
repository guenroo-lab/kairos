<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script>
    (function () {
      var m = 'dark', t = 'taisared';
      try {
        m = localStorage.getItem('kairos_mode_pick') || 'dark';
        t = localStorage.getItem('kairos_theme_pick') || 'taisared';
      } catch (e) {}
      document.documentElement.setAttribute('data-kmode', m);
      document.documentElement.setAttribute('data-ktheme', t);
    })();
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Permanent+Marker&display=swap">
  <style>
    :root {
      --ink-950:#090d13; --ink-900:#0f151e; --ink-850:#141b26; --ink-800:#1a2230;
      --ink-700:#28323f; --ink-600:#3a4757;
      --text-100:#eef2f7; --text-300:#c3ccd8; --text-500:#8b97a8; --text-600:#66707e;
      --ok:#34d17a; --ok-ink:#062b12;
      --warn-bg:#4a2c0b; --warn-fg:#ffcd8a; --warn-line:#7a4a15;
      --danger-bg:#3a1414; --danger-fg:#ffb0ab; --danger-line:#7a2a24;
      --chip-marbella-bg:#12213f; --chip-marbella-fg:#8fb2ff;
      --chip-mijas-bg:#26123b; --chip-mijas-fg:#d6a6ff;
      --chip-malaga-bg:#0f2a1a; --chip-malaga-fg:#7fe0a4;
      --tienda-marbella:#2f6fed; --tienda-mijas:#9333ea; --tienda-malaga:#16a34a;
      --tipo-refill:#3fb54a; --tipo-pedido:#4c7dff; --tipo-cesion:#a855f7;
      --radius-card:14px; --radius-btn:10px; --radius-chip:999px;
      --shadow-card:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.6);
    }
    [data-kmode="light"] {
      --ink-950:#f6f4f1; --ink-900:#ffffff; --ink-850:#fbfaf8; --ink-800:#e8e4de;
      --ink-700:#d7d2ca; --ink-600:#b6afa4;
      --text-100:#201f1c; --text-300:#4a473f; --text-500:#7a7568; --text-600:#96917f;
      --ok:#1a8f4c; --ok-ink:#eafff2;
      --warn-bg:#fff1d6; --warn-fg:#92400e; --warn-line:#f0c878;
      --danger-bg:#fde7e5; --danger-fg:#b91c1c; --danger-line:#f4b3ac;
      --chip-marbella-bg:#e5edff; --chip-marbella-fg:#1d4ed8;
      --chip-mijas-bg:#f2e6ff; --chip-mijas-fg:#7e22ce;
      --chip-malaga-bg:#e2f6e9; --chip-malaga-fg:#15803d;
      --tipo-refill:#2f9e3f; --tipo-pedido:#1d4ed8; --tipo-cesion:#7e22ce;
      --shadow-card:0 1px 2px rgba(30,25,15,.04), 0 10px 24px -14px rgba(30,25,15,.18);
    }
    [data-ktheme="indigo"]   { --accent:#4c7dff; --accent-ink:#ffffff; --accent-dim:#1c2b52; --accent-line:#3a55a8; }
    [data-ktheme="lmgreen"]  { --accent:#3fb54a; --accent-ink:#04220a; --accent-dim:#123420; --accent-line:#2f7a3c; }
    [data-ktheme="taisared"] { --accent:#e2263a; --accent-ink:#ffffff; --accent-dim:#3a1216; --accent-line:#8a2530; }
    [data-ktheme="amber"]    { --accent:#f0a020; --accent-ink:#241400; --accent-dim:#3a2708; --accent-line:#93672a; }
    [data-kmode="light"][data-ktheme="lmgreen"]  { --accent:#2f9e3f; --accent-ink:#ffffff; --accent-dim:#e4f5e7; --accent-line:#a9dab4; }
    [data-kmode="light"][data-ktheme="taisared"] { --accent:#dc1a23; --accent-ink:#ffffff; --accent-dim:#fde6e6; --accent-line:#f0aaac; }

    * { box-sizing: border-box; }
    html, body { background: var(--ink-950); }
    body { margin:0; padding:16px; color:var(--text-100); font-family:'Inter',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; transition:background .15s ease,color .15s ease; }
    h1 { font-size:19px; font-weight:800; margin:0 0 4px; letter-spacing:-.01em; }
    h3 { font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--text-500); margin:16px 0 6px; }
    select, input { font-size:15px; padding:9px 11px; margin:4px 0; background:var(--ink-900); border:1px solid var(--ink-700); border-radius:var(--radius-btn); color:var(--text-100); }
    button { cursor:pointer; border:none; border-radius:var(--radius-btn); padding:10px 15px; min-height:44px; font-size:13.5px; font-weight:700; background:var(--accent); color:var(--accent-ink); }
    button.secundario { background:var(--ink-800); color:var(--text-300); }
    /* Botones de acción de línea (preparar/incidencia): paleta pastel calcada
       de PreparacionPedidosPC (Preparacion.html .btn-color) a propósito — el
       operario ya los reconoce así, distinto del resto del sistema oscuro. */
    button.aviso, button.peligro, button.ok, button.neutro { color:#0b1220; min-height:56px; box-shadow:0 3px 0 rgba(0,0,0,.18); }
    button.aviso   { background:linear-gradient(155deg,#ffe2ad,#ffc063); }
    button.peligro { background:linear-gradient(155deg,#ffc7ce,#ff96a3); }
    button.ok      { background:linear-gradient(155deg,#baf2cd,#7fe0a0); }
    button.neutro  { background:linear-gradient(155deg,#e4e6ee,#c3c7d6); }
    button.aviso:active, button.peligro:active, button.ok:active, button.neutro:active { transform:scale(.96); }
    .fila { background:linear-gradient(160deg, var(--ink-850) 0%, var(--ink-900) 100%); border:1px solid var(--ink-800); border-top:1px solid rgba(255,255,255,.06); border-radius:var(--radius-card); padding:14px 16px; margin-bottom:10px; cursor:pointer; border-left:4px solid var(--ink-700); box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 12px 28px -16px rgba(0,0,0,.6); transition:transform .12s ease; }
    .fila:active { transform:scale(.98); }
    .fila .tipo { font-weight:800; font-size:14.5px; display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
    .fila .tipo .fecha { font-weight:600; font-size:11px; color:var(--text-500); white-space:nowrap; }
    .fila .meta { color:var(--text-500); font-size:12.5px; margin-top:3px; }
    .fila .articulo { color:var(--text-300); font-size:13px; margin-top:5px; font-weight:600; }
    .fila .ubicacion { color:var(--accent); font-size:12px; margin-top:5px; font-weight:700; }
    .fila .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
    .fila .chips .chip { font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:var(--radius-chip); background:var(--ink-800); color:var(--text-500); }
    .fila .progreso { height:4px; border-radius:999px; background:var(--ink-800); margin-top:10px; overflow:hidden; }
    .fila .progreso > div { height:100%; background:var(--accent); border-radius:999px; }
    .linea { background:var(--ink-900); border:1px solid var(--ink-800); border-radius:var(--radius-card); padding:11px 12px; margin-bottom:6px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:7px; }
    .linea.preparada { opacity:.6; }
    .linea label { flex:1; color:var(--text-100); }
    .linea .desc { font-weight:700; font-size:15px; line-height:1.35; }
    .linea .meta { font-size:13.5px; }
    .meta { color:var(--text-500); font-size:12.5px; }
    .filtros { margin-bottom:12px; display:flex; gap:6px; flex-wrap:wrap; }
    .volver { margin-bottom:12px; display:inline-block; }
    a { color:var(--text-300); }
    #operarioBar { background:var(--accent-dim); border:1px solid var(--accent-line); color:var(--accent-ink); padding:9px 12px; border-radius:var(--radius-btn); margin-bottom:12px; font-size:13px; display:flex; align-items:center; justify-content:space-between; }
    [data-kmode="light"] #operarioBar { color:var(--accent); }
    #operarioBar a { color:inherit; opacity:.85; font-weight:600; }
    #app { max-width:480px; margin:0 auto; }
    #app.ancho { max-width:1600px; }
    .tabs { display:flex; background:var(--ink-900); border:1px solid var(--ink-800); border-radius:var(--radius-card); padding:4px; margin-bottom:14px; gap:2px; }
    .tabs a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:8px 2px; border-radius:calc(var(--radius-card) - 4px); text-decoration:none; color:var(--text-500); font-size:10.5px; font-weight:700; min-height:52px; }
    .tabs a svg { width:20px; height:20px; }
    .tabs a.activa { background:var(--accent-dim); color:var(--accent-ink); }
    [data-kmode="light"] .tabs a.activa { color:var(--accent); }
    .chip { font-size:11px; font-weight:700; padding:3px 9px; border-radius:var(--radius-chip); white-space:nowrap; display:inline-block; }
    .chip-marbella { background:var(--chip-marbella-bg); color:var(--chip-marbella-fg); }
    .chip-mijas { background:var(--chip-mijas-bg); color:var(--chip-mijas-fg); }
    .chip-malaga { background:var(--chip-malaga-bg); color:var(--chip-malaga-fg); }
    .chip-urgencia { font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:var(--radius-chip); white-space:nowrap; display:inline-block; }
    .chip-urgencia.ok { background:var(--ink-800); color:var(--ok); }
    .chip-urgencia.aviso { background:var(--warn-bg); color:var(--warn-fg); }
    .chip-urgencia.peligro { background:var(--danger-bg); color:var(--danger-fg); }
    .panel-tiendas-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px; align-items:start; }
    .filtros-tipo { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
    .chip-tipo { padding:7px 14px; border-radius:var(--radius-chip); background:var(--ink-800); border:1px solid var(--ink-700); color:var(--text-300); font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; }
    .chip-tipo.activo { background:var(--accent-dim); border-color:var(--accent-line); color:var(--accent-ink); }
    [data-kmode="light"] .chip-tipo.activo { color:var(--accent); }
    .panel-contadores { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .contador-flujo { display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:var(--radius-card); background:linear-gradient(160deg, var(--ink-850) 0%, var(--ink-900) 100%); border:1px solid var(--ink-800); border-left:4px solid var(--ink-700); font-size:11.5px; font-weight:700; color:var(--text-300); box-shadow:var(--shadow-card); flex:1; min-width:88px; justify-content:center; }
    .contador-flujo b { font-size:18px; font-weight:800; color:var(--text-100); }
    .contador-flujo.tipo-refill { border-left-color:var(--tipo-refill); }
    .contador-flujo.tipo-pedido_cliente { border-left-color:var(--tipo-pedido); }
    .contador-flujo.tipo-cesion { border-left-color:var(--tipo-cesion); }
    button.btn-individual { background:linear-gradient(155deg, var(--accent), color-mix(in srgb, var(--accent) 65%, #000)); color:var(--accent-ink); min-height:38px; padding:8px 14px; font-size:12.5px; box-shadow:0 3px 0 rgba(0,0,0,.22), 0 1px 0 rgba(255,255,255,.15) inset; }
    button.btn-individual:active { transform:scale(.96); }
    button.btn-equipo { background:linear-gradient(155deg, var(--ink-700), var(--ink-850)); color:var(--text-100); border:1px solid var(--ink-600); min-height:38px; padding:8px 14px; font-size:12.5px; box-shadow:0 3px 0 rgba(0,0,0,.22); }
    button.btn-equipo:active { transform:scale(.96); }
    .tienda-header { display:flex; align-items:center; gap:8px; }
    .tienda-header .punto { width:10px; height:10px; border-radius:50%; display:inline-block; }
    .fila.tipo-refill { border-left-color:var(--tipo-refill); }
    .fila.tipo-pedido_cliente { border-left-color:var(--tipo-pedido); }
    .fila.tipo-cesion { border-left-color:var(--tipo-cesion); }
    #zonaImprimir { display:none; }
    @media print {
      body > *:not(#zonaImprimir) { display:none !important; }
      #zonaImprimir { display:block !important; color:#000; padding:40px; }
    }

    .brand-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .brand-badge { background:#fff; border-radius:10px; padding:6px 10px; display:flex; align-items:center; box-shadow:0 2px 8px -3px rgba(0,0,0,.4); }
    .brand-badge img { display:block; height:30px; width:auto; }
    .brand-x { color:var(--text-600); font-size:14px; font-weight:600; }
    .brand-nombre {
      font-family:'Permanent Marker', cursive; font-size:38px; color:var(--accent); line-height:1; letter-spacing:.015em;
      -webkit-text-stroke:1px var(--ink-950); text-stroke:1px var(--ink-950);
      text-shadow:0 2px 0 rgba(0,0,0,.35), 0 6px 14px color-mix(in srgb, var(--accent) 55%, transparent);
    }
    [data-kmode="light"] .brand-nombre { -webkit-text-stroke:1px var(--ink-900); text-stroke:1px var(--ink-900); text-shadow:0 2px 0 rgba(0,0,0,.15), 0 6px 14px color-mix(in srgb, var(--accent) 45%, transparent); }
    .theme-toggle { margin-left:auto; display:flex; gap:6px; }
    button.theme-btn { background:var(--ink-800); color:var(--text-300); padding:7px 10px; font-size:12px; display:flex; align-items:center; gap:5px; min-height:36px; }
    .theme-btn svg { width:16px; height:16px; }

    .koverlay { position:fixed; inset:0; background:rgba(5,7,10,.6); display:flex; align-items:center; justify-content:center; padding:20px; z-index:1000; }
    .kmodal { background:var(--ink-900); border:1px solid var(--ink-800); border-radius:var(--radius-card); padding:18px; max-width:360px; width:100%; box-shadow:var(--shadow-card); }
    .kmodal p { margin:0 0 14px; font-size:14.5px; line-height:1.45; color:var(--text-100); }
    .kmodal input { width:100%; }
    .kmodal .fila-botones { display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
    .kmodal .fila-botones button { min-width:84px; }
    .theme-panel { background:var(--ink-900); border:1px solid var(--ink-800); border-radius:var(--radius-card); padding:12px; margin-bottom:12px; display:none; }
    .theme-panel.abierto { display:block; }
    .picker-row { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
    .picker-row:last-child { margin-bottom:0; }
    .picker-label { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-600); width:52px; flex:none; }
    .pick { display:flex; align-items:center; gap:7px; padding:7px 11px 7px 8px; border-radius:var(--radius-chip); background:var(--ink-800); border:1px solid var(--ink-700); color:var(--text-300); font-size:12.5px; font-weight:600; cursor:pointer; }
    .pick .dot { width:13px; height:13px; border-radius:50%; flex:none; }
    .pick[data-for="indigo"] .dot { background:#4c7dff; }
    .pick[data-for="lmgreen"] .dot { background:#3fb54a; }
    .pick[data-for="taisared"] .dot { background:#e2263a; }
    .pick[data-for="amber"] .dot { background:#f0a020; }
    .pick.active { background:var(--accent-dim); border-color:var(--accent-line); color:var(--accent-ink); }
    [data-kmode="light"] .pick.active { color:var(--accent); }
    .pick[data-hidden] { display:none; }

    table.vol { width:100%; border-collapse:collapse; font-size:12px; background:var(--ink-900); border:1px solid var(--ink-800); border-radius:var(--radius-card); overflow:hidden; }
    table.vol th { text-align:center; color:var(--text-500); font-weight:600; padding:6px 4px; border-bottom:1px solid var(--ink-800); }
    table.vol th:first-child { text-align:left; padding-left:10px; }
    table.vol td { text-align:center; padding:6px 4px; color:var(--text-300); }
    table.vol td:first-child { text-align:left; padding-left:10px; color:var(--text-100); font-weight:600; }
    table.vol td.total { color:var(--text-100); font-weight:800; }
    .bars { display:flex; align-items:flex-end; gap:5px; height:100px; margin-top:6px; background:var(--ink-900); border:1px solid var(--ink-800); border-radius:var(--radius-card); padding:10px; }
    .bars .bar { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:3px; }
    .bars .fill { width:100%; background:var(--accent); border-radius:3px 3px 0 0; min-height:2px; }
    .bars .n { font-size:10px; color:var(--text-500); }
    .bars .d { font-size:9.5px; color:var(--text-600); }

    .tabs a svg, .theme-btn svg { stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

    /* Pantallas de selección (operario/tienda) — mismo lenguaje visual
       grande y pastel que PreparacionPedidosPC para que se reconozca. */
    .grid-operarios { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
    .btn-operario { min-height:72px; border-radius:16px; border:2px solid var(--ink-700); background:var(--ink-900); color:var(--text-100); font-size:16px; font-weight:800; cursor:pointer; padding:10px; }
    .btn-operario.activo { background:var(--accent-dim); border-color:var(--accent); color:var(--accent-ink); }
    [data-kmode="light"] .btn-operario.activo { color:var(--accent); }
    .grid-tiendas { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:8px; }
    .btn-tienda { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; min-height:168px; border-radius:20px; border:none; padding:16px; font-size:18px; font-weight:900; letter-spacing:.02em; text-transform:uppercase; color:#0b1220; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.18); }
    .btn-tienda .avatar { width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.55); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900; }
    .btn-tienda.marbella { background:linear-gradient(155deg,#d3ecff,#8fcdff); }
    .btn-tienda.mijas { background:linear-gradient(155deg,#ecdcff,#c298ff); }
    .contador-tienda { font-size:11px; font-weight:800; text-transform:none; letter-spacing:normal; background:rgba(11,18,32,.18); padding:3px 10px; border-radius:20px; color:#0b1220; }
  </style>
</head>
<body>

    // ——— Modal in-página (sustituye prompt/confirm/alert nativos) ———
    function kModal_(opts) {
      return new Promise(function (resolve) {
        var overlay = document.createElement('div');
        overlay.className = 'koverlay';
        var inputHtml = opts.input
          ? '<input type="' + (opts.numerico ? 'number' : 'text') + '" id="kmodalInput" value="' + (opts.valorInicial || '') + '">'
          : '';
        var botonesHtml = opts.cancelar
          ? '<button class="secundario" id="kmodalCancelar">Cancelar</button><button id="kmodalAceptar">' + (opts.textoAceptar || 'Aceptar') + '</button>'
          : '<button id="kmodalAceptar">' + (opts.textoAceptar || 'Aceptar') + '</button>';
        overlay.innerHTML = '<div class="kmodal"><p>' + opts.mensaje + '</p>' + inputHtml + '<div class="fila-botones">' + botonesHtml + '</div></div>';
        document.body.appendChild(overlay);
        var input = overlay.querySelector('#kmodalInput');
        if (input) { input.focus(); input.select(); }
        function cerrar(valor) { document.body.removeChild(overlay); resolve(valor); }
        overlay.querySelector('#kmodalAceptar').onclick = function () { cerrar(opts.input ? input.value : true); };
        var btnCancelar = overlay.querySelector('#kmodalCancelar');
        if (btnCancelar) btnCancelar.onclick = function () { cerrar(opts.input ? null : false); };
        if (input) input.onkeydown = function (e) { if (e.key === 'Enter') overlay.querySelector('#kmodalAceptar').click(); };
      });
    }
    function kAlerta(mensaje) { return kModal_({ mensaje: mensaje, cancelar: false }); }
    function kConfirmar(mensaje) { return kModal_({ mensaje: mensaje, cancelar: true }); }

    function setKModo(modo) {
      document.documentElement.setAttribute('data-kmode', modo);

    function sincronizarPickers_() {
      var modo = document.documentElement.getAttribute('data-kmode');
      var tema = document.documentElement.getAttribute('data-ktheme');
      var picks = document.querySelectorAll('.pick[data-mode]');
      for (var i = 0; i < picks.length; i++) picks[i].classList.toggle('active', picks[i].getAttribute('data-mode') === modo);
      picks = document.querySelectorAll('.pick[data-for]');
      for (var j = 0; j < picks.length; j++) {
        var p = picks[j];
        var nombre = p.getAttribute('data-for');
        p.toggleAttribute('data-hidden', TEMAS_MODOS[nombre].indexOf(modo) === -1);
        p.classList.toggle('active', nombre === tema);
      }
    }

          return '<button class="btn-operario" data-i="' + i + '">' + o.nombre + '</button>';

        const botones = grid.querySelectorAll('.btn-operario');
        botones.forEach(function (b, i) {

    var PETICIONES_CACHE_ = [];

    function cargarCola() {
      google.script.run.withSuccessHandler(function (json) {
        PETICIONES_CACHE_ = JSON.parse(json);
        const secciones = [];
        PETICIONES_CACHE_.forEach(function (p) {
          (p.secciones || []).forEach(function (s) { if (s && secciones.indexOf(s) === -1) secciones.push(s); });
        });
        secciones.sort();
        document.getElementById('filtroSeccion').innerHTML = '<option value="">Todas las secciones</option>' +
          secciones.map(function (s) { return '<option value="' + s + '">' + s + '</option>'; }).join('');
        pintarCola_();
      }).listarCola(TIENDA_ACTIVA, null);

    function pintarCola_() {
      const tipo = document.getElementById('filtroTipo').value;
      const seccion = document.getElementById('filtroSeccion').value;
      const fecha = document.getElementById('filtroFecha').value;
      const filtradas = PETICIONES_CACHE_.filter(function (p) {
        if (tipo && p.tipo !== tipo) return false;
        if (seccion && (p.secciones || []).indexOf(seccion) === -1) return false;
        if (fecha && p.creada_en.slice(0, 10) !== fecha) return false;
        return true;
      });
      const cont = document.getElementById('listaCola');
      if (!filtradas.length) { cont.innerHTML = '<p class="meta">No hay peticiones.</p>'; return; }

      function filaHtml(p) {
        const etiquetaTipo = p.tipo === 'pedido_cliente' ? ('Pedido cliente ' + (p.num_pedido || '')) : (p.tipo === 'cesion' ? 'Cesión ' + (p.num_cesion || '') + ' → ' + p.tiendaDestinoNombre : ('Refill' + (p.motivo ? ': ' + p.motivo : '')));
        const fechaObj = new Date(p.creada_en);
        const fechaTexto = fechaObj.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }) + ' ' + fechaObj.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        const articuloTexto = p.articulo ? p.articulo : (p.totalLineas + ' artículo' + (p.totalLineas === 1 ? '' : 's'));
        const chips = (p.secciones || []).map(function (s) { return '<span class="chip">' + s + '</span>'; }).join('');
        const ubicacionTexto = (p.ubicaciones && p.ubicaciones.length) ? p.ubicaciones.join(' · ') : '';
        const ssccTexto = (p.sscc && p.sscc.length) ? p.sscc.join(' · ') : '';
        const pct = p.totalLineas ? Math.round(100 * p.lineasPreparadas / p.totalLineas) : 0;
        const enCurso = (p.en_curso_por && p.en_curso_por !== OPERARIO)
          ? '<div class="meta" style="color:var(--warn-fg);">👤 En curso: ' + p.en_curso_por + ' (' + tiempoDesde_(p.en_curso_desde) + ')</div>' : '';
        return '<div class="fila" style="border-left-color:' + (CFG_TIENDA_COLOR[p.tienda_origen] || '#ccc') + '" onclick="abrirDetalle(\'' + p.id + '\')">' +
          '<div class="tipo"><span>' + etiquetaTipo + '</span><span class="fecha">' + fechaTexto + '</span></div>' +
          '<div class="meta">' + p.tiendaNombre + ' · ' + p.lineasPreparadas + '/' + p.totalLineas + ' líneas · pide: ' + (p.solicitante_ldap || '—') + '</div>' +
          '<div class="articulo">' + articuloTexto + '</div>' +
          (ubicacionTexto ? '<div class="ubicacion">📍 ' + ubicacionTexto + '</div>' : '') +
          (ssccTexto ? '<div class="meta">SSCC ' + ssccTexto + '</div>' : '') +
          enCurso +
          (chips ? '<div class="chips">' + chips + '</div>' : '') +
          '<div class="progreso"><div style="width:' + pct + '%;"></div></div>' +
          '</div>';
      }
      const GRUPOS = [
        { tipo: 'refill', label: 'Refill' },
        { tipo: 'pedido_cliente', label: 'Pedido cliente' },
        { tipo: 'cesion', label: 'Cesión' },
      ];
      var html = '';
      GRUPOS.forEach(function (g) {
        const deEsteGrupo = filtradas.filter(function (p) { return p.tipo === g.tipo; });
        if (!deEsteGrupo.length) return;
        const normales = deEsteGrupo.filter(function (p) { return !p.cola_individual; });
        const individuales = deEsteGrupo.filter(function (p) { return p.cola_individual; });
        html += '<h3>' + g.label + '</h3>' + normales.map(filaHtml).join('');
        if (individuales.length) html += '<h3>' + g.label + ' · Individual</h3>' + individuales.map(filaHtml).join('');
      });
      cont.innerHTML = html || '<p class="meta">No hay peticiones con esos filtros.</p>';
    }

    function renderDetalleBody_() {
      const p = ultimoDetalle.peticion;
      var titulo = p.tipo === 'pedido_cliente' ? ('Pedido cliente ' + (p.num_pedido || '')) : (p.tipo === 'cesion' ? ('Cesión ' + (p.num_cesion || '') + ' → ' + p.tiendaDestinoNombre) : ('Refill: ' + (p.motivo || '')));

      var html = '<h1>' + titulo + '</h1><p class="meta">' + p.tiendaNombre + '</p>';
      if (ultimoDetalle.otroEnCurso) {
        html += '<p class="meta" style="color:var(--warn-fg);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--radius-btn);padding:8px 10px;margin:8px 0;">⚠ ' +
          ultimoDetalle.otroEnCurso.operario + ' también está en este pedido (' + tiempoDesde_(ultimoDetalle.otroEnCurso.desde) + ')</p>';
      }
      html += ultimoDetalle.lineas.map(function (l) { return renderLineaHtml_(p, l); }).join('');

      if (p.tipo === 'cesion' || p.tipo === 'refill' || (p.tipo === 'pedido_cliente' && !p.transporte)) {
        html += '<h3>Estado</h3><div id="estadoDetalle" class="meta">Cargando…</div>';

        html += '<h3>A ubicar</h3><input type="text" id="ubicacion" placeholder="Ubicación de consolidación"> <button onclick="guardarUbicacion(\'' + p.id + '\')">Guardar</button>';
      } else if (p.estado === 'cerrada') {
        html += '<p><strong>Petición completada.</strong></p>';
      }

      document.getElementById('detalleBody').innerHTML = html;

      const contEstado = document.getElementById('estadoDetalle');
      if (contEstado) {
        google.script.run.withSuccessHandler(function (json) {
          const fila = JSON.parse(json).filter(function (x) { return x.id === p.id; })[0];
          contEstado.textContent = !fila ? 'Sin datos.'
            : p.tipo === 'refill' ? ('Refill: ' + fila.refillEstado + (fila.refillFecha ? ' (entrega ' + fila.refillFecha + (fila.refillHora ? ' ' + fila.refillHora : '') + ')' : ''))
            : ('HODOS: ' + fila.hodosEstado + (fila.hodosFecha ? ' (entrega ' + fila.hodosFecha + (fila.hodosHora ? ' ' + fila.hodosHora : '') + ')' : ''));
        }).listarEstadoPeticiones();
      }
    }

    function renderLineaHtml_(p, l) {
      const cabecera = l.codigo_lm + ' — ' + (l.designacion || '') + ' (' + l.cantidad + ' ' + l.unidad_medida + ')';
      var extraInfo = '';
      if (l.avisoStock) extraInfo = '<div class="meta" style="color:var(--danger-fg);">⚠️ ' + l.avisoStock + '</div>';
      else if (l.ubicacion) extraInfo = '<div class="meta">📍 ' + l.ubicacion + '</div>';

      const preparada = l.estado_preparacion === 'preparado';
      if (preparada) {
        const resumen = l.estado_negocio ? (l.estado_negocio + (l.incidencia_motivo ? ' — ' + l.incidencia_motivo : '')) : '';
        var botonDeshacer = '';
        if (p.tipo === 'pedido_cliente' || p.tipo === 'cesion') {
          botonDeshacer = ' <button class="secundario" onclick="deshacerLinea(\'' + l.id + '\')">Deshacer</button>';
        }
        return '<div class="linea preparada"><div class="desc">' + cabecera + '</div>' + extraInfo +
          '<div class="meta">✓ Preparada' + (resumen ? ' · ' + resumen : '') + '</div>' + botonDeshacer + '</div>';
      }

      const bloqueada = !l.sscc;
      if (bloqueada) {
        return '<div class="linea"><div class="desc">' + cabecera + '</div>' + extraInfo +
          '<button class="secundario" disabled title="Esperando ubicación de palet">Marcar preparada</button></div>';
      }

      // Línea repartida en varios palets (ver parsearSsccMulti): checklist que
      // hay que marcar entero antes de poder cerrar la línea — evita cerrarla
      // habiendo cogido mercancía de un solo palet cuando hacían falta varios.
      const partesPalet = parsearSsccMulti(l.sscc, l.cantidad);
      const esMultiPalet = partesPalet.length > 1;
      if (!confirmadosPalet[l.id]) confirmadosPalet[l.id] = partesPalet.map(function () { return false; });
      const confirmados = confirmadosPalet[l.id];
      const todosConfirmados = !esMultiPalet || confirmados.every(function (v) { return v; });

      var bloquePalet = '';
      if (esMultiPalet) {
        const direcciones = String(l.ubicacion || '').split(' + ').map(function (s) { return s.trim(); });
        bloquePalet += '<p class="meta" style="margin:8px 0 4px;font-weight:700;">📦 Repartido en ' + partesPalet.length + ' palets — confirma cada uno al cogerlo:</p>';
        bloquePalet += partesPalet.map(function (parte, idx) {
          const etiquetaPalet = 'SSCC ' + parte.sscc + ' · ' + (direcciones[idx] || '—') + ' · ' + parte.cantidad + ' ud';
          return confirmados[idx]
            ? '<button class="ok" style="width:100%;margin-bottom:6px;" onclick="marcarPaletConfirmado(\'' + l.id + '\', ' + idx + ', false)">✓ Confirmado — ' + etiquetaPalet + '</button>'
            : '<button class="secundario" style="width:100%;margin-bottom:6px;" onclick="marcarPaletConfirmado(\'' + l.id + '\', ' + idx + ', true)">Confirmar palet cogido — ' + etiquetaPalet + '</button>';
        }).join('');
      }

      const sel = selectorPalet[l.id];
      var bloqueSelector;
      if (sel === 'cargando') {
        bloqueSelector = '<div class="meta" style="margin-top:6px;">Buscando palets…</div>';
      } else if (Array.isArray(sel)) {
        if (!sel.length) {
          bloqueSelector = '<div class="meta" style="margin-top:6px;">No se han encontrado otros palets con este código en el edificio 05.</div>' +
            '<button class="secundario" style="margin-top:6px;" onclick="cerrarSelectorPalet(\'' + l.id + '\')">Cerrar</button>';
        } else {
          bloqueSelector = '<p class="meta" style="margin:8px 0 4px;font-weight:700;">Elige el palet:</p>' +
            sel.map(function (c) {
              const suficiente = c.remanente >= Number(l.cantidad || 0);
              const clase = c.esActual ? 'neutro' : (suficiente ? 'ok' : 'aviso');
              const etiqueta = 'SSCC ' + c.sscc + ' · ' + c.ubicacion + ' · ' + c.remanente + ' ud' + (c.esActual ? ' (actual)' : (suficiente ? '' : ' ⚠ insuficiente'));
              return c.esActual
                ? '<button class="' + clase + '" disabled style="width:100%;margin-bottom:6px;">' + etiqueta + '</button>'
                : '<button class="' + clase + '" style="width:100%;margin-bottom:6px;" onclick="elegirPalet(\'' + l.id + '\', \'' + c.sscc + '\', \'' + c.ubicacion + '\')">' + etiqueta + '</button>';

          '<button ' + (!todosConfirmados ? 'disabled title="Confirma todos los palets primero"' : 'onclick="marcarLinea(\'' + l.id + '\', this)"') + '>Marcar preparada</button>' + cola + '</div>';

          '<button class="peligro" onclick="cerrarLinea(\'' + l.id + '\', \'Sin Mercancía\', \'\')">Sin Mercancía</button> ' +
          '<button class="neutro" onclick="verIncidenciaMotivo(\'' + l.id + '\')">Otras Incidencias</button> ' +
          '<button class="secundario" onclick="verIncidenciaPregunta(\'' + l.id + '\')">‹ Volver</button>' + cola + '</div>';
      }
      if (vista === 'pregunta') {

          '<button class="ok" onclick="cerrarLinea(\'' + l.id + '\', \'\', \'\')">Sin incidencia</button> ' +
          '<button class="aviso" onclick="verIncidenciaTipos(\'' + l.id + '\')">⚠ Con incidencia</button>' + cola + '</div>';

    // Debe llamarse SÍNCRONAMENTE dentro del onclick — si se dispara tras la
    // respuesta de google.script.run (async), el navegador bloquea el salto
    // a http-shortcuts:// en silencio. Por eso usa ultimoDetalle (ya en
    // memoria desde que se abrió el detalle) y no espera nada del servidor.
    // incidenciaMarcada: true/false para la línea que se está cerrando AHORA
    // (su estado_negocio aún no está en ultimoDetalle — el resto de líneas sí).
    function dispararPuenteMyIsoSiProcede_(lineaIdMarcada, incidenciaMarcada) {
      if (!ultimoDetalle) return;
      const p = ultimoDetalle.peticion;
      const lineas = ultimoDetalle.lineas;

      if (p.tipo === 'refill') {
        const l = lineas.filter(function (x) { return x.id === lineaIdMarcada; })[0];
        if (!l || !l.sscc) return;
        dispararMoveToAddress_([limpiarSscc(l.sscc)], p.tienda_origen);
        return;
      }

      if (p.tipo === 'pedido_cliente' || p.tipo === 'cesion') {
        const quedanPendientes = lineas.some(function (x) {
          return x.id !== lineaIdMarcada && x.estado_preparacion !== 'preparado';
        });
        if (quedanPendientes) return;

        function esIncidencia(l) {
          return l.id === lineaIdMarcada ? !!incidenciaMarcada : INCIDENCIAS.indexOf(l.estado_negocio) !== -1;
        }

        const transfers = [];
        lineas.forEach(function (l) {
          if (esIncidencia(l)) return;
          parsearSsccMulti(l.sscc, l.cantidad).forEach(function (parte) {
            if (!parte.sscc || !parte.cantidad) return;
            transfers.push({
              source: limpiarSscc(parte.sscc), sourceType: 'CONTAINER',
              stock: { productId: l.codigo_lm, quantity: parte.cantidad, measureUnit: 'EA', lotId: null, expirationDate: null, blocking: null },
            });
          });
        });
        dispararTransfers_(transfers, p.tienda_origen);
      }
    }

    function limpiarSscc(sscc) { return String(sscc || '').replace(/^0+/, ''); }

    function tiempoDesde_(iso) {
      if (!iso) return '';
      const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
      if (min < 1) return 'ahora mismo';
      if (min < 60) return 'hace ' + min + ' min';
      return 'hace ' + Math.round(min / 60) + 'h';
    }

    // Espejo de _parseSsccMulti_ (StockAsignacion.js) — "sscc1 (Xud) + sscc2 (Yud)".
    function parsearSsccMulti(valorSscc, cantidadFila) {
      var raw = String(valorSscc || '').trim();
      if (!raw) return [];
      var partes = raw.indexOf(' + ') === -1 ? [raw] : raw.split(' + ');
      return partes.map(function (parte) {
        var m = parte.trim().match(/^(.+?)\s*\((\d+(?:[.,]\d+)?)\s*ud\)$/);
        if (m) return { sscc: m[1].trim(), cantidad: Number(m[2].replace(',', '.')) || 0 };
        return { sscc: parte.trim(), cantidad: partes.length === 1 ? (Number(cantidadFila) || 0) : 0 };
      });
    }

    function dispararTransfers_(transfers, tienda) {
      if (!transfers.length) return;
      var url = 'http-shortcuts://' + CFG_SHORTCUTS.STOCK_SHORTCUT_ID +
        '?TRANSFERS=' + encodeURIComponent(JSON.stringify(transfers)) +
        '&TIENDA=' + encodeURIComponent(tienda);
      window.location.href = url;
    }

    function dispararMoveToAddress_(ssccList, tienda) {
      if (!CFG_SHORTCUTS.SHORTCUT_ID_REFILL || CFG_SHORTCUTS.SHORTCUT_ID_REFILL.indexOf('PENDIENTE') === 0) return;
      var url = 'http-shortcuts://' + CFG_SHORTCUTS.SHORTCUT_ID_REFILL +
        '?SSCC_LIST=' + encodeURIComponent(JSON.stringify(ssccList)) +
        '&TIENDA=' + encodeURIComponent(tienda);
      window.location.href = url;
    }

    // Ventana de 24h laborables: fin de semana no cuenta, corte a las 14h.
    // Viernes >=14h, sábado o domingo -> como si se pidiera el lunes 00:00.
    // Cualquier otro día >=14h -> pasa al día siguiente 00:00.
    function inicioEfectivoUrgencia_(creadaEnIso) {
      const d = new Date(creadaEnIso);
      const dia = d.getDay(); // 0=domingo..6=sábado
      const hora = d.getHours();
      if (dia === 6 || dia === 0 || (dia === 5 && hora >= 14)) {
        const offset = dia === 6 ? 2 : dia === 0 ? 1 : 3;
        return new Date(d.getFullYear(), d.getMonth(), d.getDate() + offset, 0, 0, 0, 0);
      }
      if (hora >= 14) return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 0, 0, 0, 0);
      return d;
    }
    function horasHabilesTranscurridas_(desde, hasta) {
      var actual = new Date(desde);
      var totalMs = 0, tope = 0;
      while (actual < hasta && tope < 60) {
        const finDia = new Date(actual.getFullYear(), actual.getMonth(), actual.getDate() + 1, 0, 0, 0, 0);
        const tramoFin = finDia < hasta ? finDia : hasta;
        const dia = actual.getDay();
        if (dia !== 0 && dia !== 6) totalMs += (tramoFin - actual);
        actual = finDia;
        tope++;
      }
      return totalMs / 3600000;
    }
    function urgenciaHtml_(creadaEnIso) {
      const inicio = inicioEfectivoUrgencia_(creadaEnIso);
      const restante = 24 - horasHabilesTranscurridas_(inicio, new Date());
      var clase, texto;
      if (restante > 6) { clase = 'ok'; texto = Math.round(restante) + 'h restantes'; }
      else if (restante > 0) { clase = 'aviso'; texto = Math.round(restante) + 'h restantes'; }
      else { clase = 'peligro'; texto = 'vencido hace ' + Math.round(-restante) + 'h'; }
      return '<span class="chip-urgencia ' + clase + '">' + texto + '</span>';
    }

          (p.cola_individual ? 'Mover a En Equipo' : 'Mover a individual') + '</button>';
      }
      const activa = p.estado !== 'cerrada' && p.estado !== 'anulada';
      const preparando = p.en_curso_por ? (' · preparando: ' + p.en_curso_por + ' (' + tiempoDesde_(p.en_curso_desde) + ')') : '';
      const urgencia = activa ? urgenciaHtml_(p.creada_en) : '';
      return '<div class="fila tipo-' + p.tipo + '" onclick="abrirDetalle(\'' + p.id + '\')">' +
        '<div class="tipo">' + etiquetaTipo + ' ' + urgencia + '</div>' +
        '<div class="meta">' + p.lineasPreparadas + '/' + p.totalLineas + ' líneas · ' + p.estado + (p.cola_individual ? ' · individual' : '') + preparando + '</div>' +
        (articulosTexto ? '<div class="meta">' + articulosTexto + '</div>' : '') +
        '<div class="meta">' + botonReintentar + botonIndividual + '</div></div>';
    }

      const cont = document.getElementById('formCrearEtiqueta');
      if (cont) cont.innerHTML = '';
    }

    function _etiquetaPorId_(idUnico) {
      return HODOS_CACHE_.filter(function (e) { return e.id_unico === idUnico; })[0];
    }

    function pintarHodos_(lista) {
      const cont = document.getElementById('listaHodosCompleto');
      if (!cont) return;
      if (!lista.length) { cont.innerHTML = '<p class="meta">Sin etiquetas.</p>'; return; }
      cont.innerHTML = lista.map(function (e) {
        const anulada = e.estado === 'ANULADA';
        return '<div class="linea">' +
          '<div><div class="desc">' + (e.numero_pedido || '(sin nº)') + ' → ' + e.destino + '</div>' +
          '<div class="meta">' + e.id_unico + ' · ' + e.estado + ' · ' + (e.origen || '') + ' · ' + new Date(e.fecha_creacion).toLocaleString('es-ES') + '</div></div>' +
          '<div><button class="secundario" onclick="imprimirEtiqueta_(\'' + e.id_unico + '\')">Imprimir</button> ' +
          (anulada ? '' :
            '<button class="secundario" onclick="renderFormEditarEtiqueta_(\'' + e.id_unico + '\')">Editar</button> ' +
            '<button class="peligro" onclick="anularEtiquetaUI_(\'' + e.id_unico + '\', this)">Anular</button>') +
          '</div></div>';
      }).join('');
    }

    function renderFormCrearEtiqueta_() {
      const cont = document.getElementById('formCrearEtiqueta');
      cont.innerHTML =
        '<div class="linea" style="flex-direction:column;align-items:stretch;gap:6px;">' +
        '<input class="entrada" id="ceDestino" placeholder="Destino (ej. Marbella, Mijas, Granada…)">' +
        '<input class="entrada" id="ceNumPedido" placeholder="Nº de pedido (opcional)">' +
        '<input class="entrada" id="ceCodigoLm" placeholder="Código LM">' +
        '<input class="entrada" id="ceCantidad" type="number" placeholder="Cantidad">' +
        '<button onclick="crearEtiquetaUI_(this)">Crear etiqueta</button>' +
        '</div>';
    }

    function crearEtiquetaUI_(boton) {
      const destino = document.getElementById('ceDestino').value.trim();
      const numPedido = document.getElementById('ceNumPedido').value.trim();
      const codigoLm = document.getElementById('ceCodigoLm').value.trim();
      const cantidad = document.getElementById('ceCantidad').value;
      boton.disabled = true; boton.textContent = 'Creando…';
      google.script.run
        .withSuccessHandler(function () { cargarHodosCompleto_(); })
        .withFailureHandler(function (err) { kAlerta(err.message); boton.disabled = false; boton.textContent = 'Crear etiqueta'; })
        .crearEtiquetaHodosManual(destino, numPedido, codigoLm, cantidad, OPERARIO);
    }

    function renderFormEditarEtiqueta_(idUnico) {
      const e = _etiquetaPorId_(idUnico);
      if (!e) return;
      kPedirTexto('Destino:', { valorInicial: e.destino }).then(function (nuevoDestino) {
        if (nuevoDestino === null) return;
        kPedirTexto('Nº de pedido:', { valorInicial: e.numero_pedido || '' }).then(function (nuevoPedido) {
          if (nuevoPedido === null) return;
          google.script.run
            .withSuccessHandler(cargarHodosCompleto_)
            .withFailureHandler(function (err) { kAlerta(err.message); })
            .editarEtiquetaHodos(idUnico, nuevoDestino, nuevoPedido);
        });
      });
    }

    function anularEtiquetaUI_(idUnico, boton) {
      kConfirmar('¿Anular la etiqueta ' + idUnico + '? Esto actualiza la base directamente.').then(function (ok) {
        if (!ok) return;
        boton.disabled = true;
        google.script.run
          .withSuccessHandler(cargarHodosCompleto_)
          .withFailureHandler(function (err) { kAlerta(err.message); boton.disabled = false; })
          .anularEtiquetaHodos(idUnico);
      });
    }

    function imprimirEtiqueta_(idUnico) {
      const e = _etiquetaPorId_(idUnico);
      if (!e) return;
      var zona = document.getElementById('zonaImprimir');
      if (!zona) {
        zona = document.createElement('div');
        zona.id = 'zonaImprimir';
        document.body.appendChild(zona);
      }
      zona.innerHTML =
        '<div style="font-size:28px;font-weight:800;">' + e.destino + '</div>' +
        '<div style="font-size:20px;margin-top:10px;">Pedido: ' + (e.numero_pedido || '—') + '</div>' +
        '<div style="font-size:16px;margin-top:6px;">' + e.id_unico + '</div>' +
        '<div style="font-size:14px;margin-top:6px;">' + new Date(e.fecha_creacion).toLocaleString('es-ES') + '</div>';
      window.print();
    }

    /** ============ Pantalla Operarios (jefe de equipo): alta/baja ============ */

    var OPERARIOS_CACHE_ = [];

    function renderOperariosGestion() {
      document.getElementById('app').innerHTML = renderBrandHeaderHtml_() + renderTabsBar_() +
        '<h1>Operarios del almacén</h1>' +
        '<p class="meta">Quitar no borra el histórico, solo lo saca de la lista para preparar.</p>' +
        '<div class="linea" style="flex-direction:column;align-items:stretch;gap:6px;">' +
        '<input class="entrada" id="opNombre" placeholder="Nombre (ej. Antonio.M)">' +
        '<select class="entrada" id="opRol">' +
        '<option value="operario">Operario</option>' +
        '<option value="jefe_equipo">Jefe de equipo</option>' +
        '</select>' +
        '<button onclick="crearOperarioUI_(this)">+ Añadir operario</button>' +
        '</div>' +
        '<div id="listaOperariosGestion" style="margin-top:10px;">Cargando…</div>';
      sincronizarPickers_();
      cargarOperariosGestion_();
    }

    function cargarOperariosGestion_() {
      google.script.run.withSuccessHandler(function (json) {
        OPERARIOS_CACHE_ = JSON.parse(json);
        pintarOperariosGestion_();
      }).listarOperariosGestion();
    }

    function pintarOperariosGestion_() {
      const cont = document.getElementById('listaOperariosGestion');
      if (!cont) return;
      if (!OPERARIOS_CACHE_.length) { cont.innerHTML = '<p class="meta">Sin operarios.</p>'; return; }
      cont.innerHTML = OPERARIOS_CACHE_.map(function (o) {
        return '<div class="linea">' +
          '<div><div class="desc">' + o.nombre + (o.activo ? '' : ' <span class="meta">(inactivo)</span>') + '</div>' +
          '<div class="meta">' + (o.rol === 'jefe_equipo' ? 'Jefe de equipo' : 'Operario') + '</div></div>' +
          '<div>' + (o.activo
            ? '<button class="peligro" onclick="cambiarActivoOperarioUI_(\'' + o.nombre + '\', false, this)">Quitar</button>'
            : '<button class="secundario" onclick="cambiarActivoOperarioUI_(\'' + o.nombre + '\', true, this)">Reactivar</button>') +
          '</div></div>';
      }).join('');
    }

    function crearOperarioUI_(boton) {
      const nombre = document.getElementById('opNombre').value.trim();
      const rol = document.getElementById('opRol').value;
      boton.disabled = true; boton.textContent = 'Añadiendo…';
      google.script.run
        .withSuccessHandler(function () {
          document.getElementById('opNombre').value = '';
          boton.disabled = false; boton.textContent = '+ Añadir operario';
          cargarOperariosGestion_();
        })
        .withFailureHandler(function (err) { kAlerta(err.message); boton.disabled = false; boton.textContent = '+ Añadir operario'; })
        .crearOperario(nombre, rol);
    }

    function cambiarActivoOperarioUI_(nombre, activo, boton) {
      boton.disabled = true;
      google.script.run
        .withSuccessHandler(cargarOperariosGestion_)
        .withFailureHandler(function (err) { kAlerta(err.message); boton.disabled = false; })
        .cambiarActivoOperario(nombre, activo);
    }

    function reintentarHodosUI(peticionId, boton) {
      boton.disabled = true; boton.textContent = 'Enviando…';
      google.script.run
        .withSuccessHandler(function () { cargarTodasPeticiones_(); })
        .withFailureHandler(function (err) { kAlerta(err.message); boton.disabled = false; boton.textContent = 'Reintentar HODOS'; })
        .reintentarHodos(peticionId);
    }

    function marcarColaIndividualUI(peticionId, valor, boton) {
      boton.disabled = true;
      google.script.run
        .withSuccessHandler(function () { cargarTodasPeticiones_(); })
        .withFailureHandler(function (err) { kAlerta(err.message); boton.disabled = false; })
        .marcarColaIndividual(peticionId, valor);
    }

    function renderVolumenes() {
      document.getElementById('app').innerHTML = renderBrandHeaderHtml_() + renderTabsBar_() +
        '<h1>Volúmenes de trabajo</h1>' +
        '<h3>Hoy</h3><div id="volHoy">Cargando…</div>' +
        '<h3>Últimos 14 días</h3><div id="volHistorico">Cargando…</div>';
      sincronizarPickers_();

      google.script.run.withSuccessHandler(function (json) {
        const datos = JSON.parse(json);
        const cont = document.getElementById('volHoy');
        if (!datos.filas.length) { cont.innerHTML = '<p class="meta">Sin líneas preparadas hoy todavía.</p>'; return; }
        var html = '<table class="vol"><tr><th>Operario</th>' +
          datos.horas.map(function (h) { return '<th>' + h + 'h</th>'; }).join('') +
          '<th>Total</th></tr>';
        html += datos.filas.map(function (f) {
          return '<tr><td>' + f.operario + '</td>' +
            f.porHora.map(function (n) { return '<td>' + (n || '') + '</td>'; }).join('') +
            '<td class="total">' + f.total + '</td></tr>';
        }).join('');
        html += '</table>';
        cont.innerHTML = html;
      }).listarVolumenesHoy();

      google.script.run.withSuccessHandler(function (json) {
        const dias = JSON.parse(json);
        const cont = document.getElementById('volHistorico');
        if (!dias.length) { cont.innerHTML = '<p class="meta">Sin datos todavía.</p>'; return; }
        const max = Math.max.apply(null, dias.map(function (d) { return d.total; }));
        cont.innerHTML = '<div class="bars">' +
          dias.map(function (d) {
            const alturaPct = max ? Math.round((d.total / max) * 100) : 0;
            return '<div class="bar"><div class="n">' + d.total + '</div>' +
              '<div class="fill" style="height:' + alturaPct + '%"></div>' +
              '<div class="d">' + d.dia.slice(5) + '</div></div>';
          }).join('') + '</div>';
      }).listarVolumenesHistorico();
    }

    document.addEventListener('DOMContentLoaded', function () { render(); });
  </script>
</body>
</html>
