<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --ink-950:#090d13; --ink-900:#0f151e; --ink-850:#141b26; --ink-800:#1a2230;
    --ink-700:#28323f; --ink-600:#3a4757;
    --text-100:#eef2f7; --text-300:#c3ccd8; --text-500:#8b97a8; --text-600:#66707e;
    --ok:#34d17a; --ok-ink:#062b12;
    --warn-bg:#4a2c0b; --warn-fg:#ffcd8a; --warn-line:#7a4a15;
    --danger-bg:#3a1414; --danger-fg:#ffb0ab; --danger-line:#7a2a24;
    --radius-card:14px; --radius-btn:10px; --radius-chip:999px;
    --shadow-card:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.6);
    --tipo-refill:#3fb54a; --tipo-refill-bg:#123420; --tipo-refill-fg:#8fe0a4;
    --tipo-pedido:#4c7dff; --tipo-pedido-bg:#12213f; --tipo-pedido-fg:#8fb2ff;
    --tipo-cesion:#a855f7; --tipo-cesion-bg:#26123b; --tipo-cesion-fg:#d6a6ff;
  }
  [data-kmode="light"] {
    --ink-950:#f6f4f1; --ink-900:#ffffff; --ink-850:#fbfaf8; --ink-800:#e8e4de;
    --ink-700:#d7d2ca; --ink-600:#b6afa4;
    --text-100:#201f1c; --text-300:#4a473f; --text-500:#7a7568; --text-600:#96917f;
    --ok:#1a8f4c; --ok-ink:#eafff2;
    --warn-bg:#fff1d6; --warn-fg:#92400e; --warn-line:#f0c878;
    --danger-bg:#fde7e5; --danger-fg:#b91c1c; --danger-line:#f4b3ac;
    --shadow-card:0 1px 2px rgba(30,25,15,.04), 0 10px 24px -14px rgba(30,25,15,.18);
    --tipo-refill:#2f9e3f; --tipo-refill-bg:#e4f5e7; --tipo-refill-fg:#1a7a2c;
    --tipo-pedido:#1d4ed8; --tipo-pedido-bg:#e5edff; --tipo-pedido-fg:#1d4ed8;
    --tipo-cesion:#7e22ce; --tipo-cesion-bg:#f2e6ff; --tipo-cesion-fg:#7e22ce;
  }
  [data-ktheme="indigo"]   { --accent:#4c7dff; --accent-ink:#ffffff; --accent-dim:#1c2b52; --accent-line:#3a55a8; }
  [data-ktheme="lmgreen"]  { --accent:#3fb54a; --accent-ink:#04220a; --accent-dim:#123420; --accent-line:#2f7a3c; }
  [data-ktheme="taisared"] { --accent:#e2263a; --accent-ink:#ffffff; --accent-dim:#3a1216; --accent-line:#8a2530; }
  [data-ktheme="amber"]    { --accent:#f0a020; --accent-ink:#241400; --accent-dim:#3a2708; --accent-line:#93672a; }
  [data-kmode="light"][data-ktheme="lmgreen"]  { --accent:#2f9e3f; --accent-ink:#ffffff; --accent-dim:#e4f5e7; --accent-line:#a9dab4; }
  [data-kmode="light"][data-ktheme="taisared"] { --accent:#dc1a23; --accent-ink:#ffffff; --accent-dim:#fde6e6; --accent-line:#f0aaac; }

  * { box-sizing:border-box; }
  html, body { background:var(--ink-950); }
  body {
    background-image:
      radial-gradient(900px 620px at -10% -15%, var(--accent) 0%, transparent 55%),
      radial-gradient(800px 700px at 115% 10%, var(--accent-line) 0%, transparent 50%),
      linear-gradient(160deg, var(--ink-950) 0%, var(--ink-900) 55%, var(--ink-950) 100%);
    background-size: auto, auto, 100% 100%;
    background-position: 0 0, 0 0, 0 0;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  [data-kmode="light"] body {
    background-image:
      radial-gradient(900px 620px at -10% -15%, var(--accent) 0%, transparent 50%),
      radial-gradient(800px 700px at 115% 10%, var(--accent-line) 0%, transparent 42%),
      linear-gradient(160deg, var(--ink-950) 0%, var(--ink-800) 55%, var(--ink-950) 100%);
  }
  body { margin:0; color:var(--text-100); font-family:'Inter',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; transition:background .15s ease,color .15s ease; }
  h2 { font-size:18px; font-weight:800; margin:0 0 10px; letter-spacing:-.01em; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--ink-800); }
  .card {
    background: linear-gradient(160deg, var(--ink-850) 0%, var(--ink-900) 100%);
    border:1px solid var(--ink-800); border-top:1px solid rgba(255,255,255,.07);
    border-radius:18px; padding:18px; margin-bottom:14px;
    box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 14px 34px -16px rgba(0,0,0,.65);
  }
  .btn {
    width:100%; padding:14px; min-height:52px; border-radius:14px; border:none;
    font-weight:800; font-size:15px; letter-spacing:.01em; cursor:pointer; margin-top:8px;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 70%, #000) 100%);
    color: var(--accent-ink);
    box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--accent) 70%, transparent), 0 1px 0 rgba(255,255,255,.25) inset;
  }
  .btn-primary:active { filter: brightness(.94); }
  .tabs {
    display:flex; background: linear-gradient(160deg, var(--ink-850), var(--ink-900));
    border:1px solid var(--ink-800); border-radius:22px; padding:6px; margin:0 16px 14px; gap:4px;
    box-shadow: 0 10px 26px -14px rgba(0,0,0,.6);
  }
  .tabs a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:10px 2px; border-radius:16px; text-decoration:none; color:var(--text-500); font-size:12px; font-weight:700; min-height:56px; transition: background .15s ease, color .15s ease; }
  .tabs a svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .tabs a.activa {
    background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 65%, #000) 100%);
    color: var(--accent-ink);
    box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .btn-primary { background:var(--accent); color:var(--accent-ink); }
  .btn-ghost { background:var(--ink-800); color:var(--text-300); border:1px solid var(--ink-700); }
  .btn-danger { background:var(--danger-bg); color:var(--danger-fg); border:1px solid var(--danger-line); }
  .entrada { width:100%; padding:10px 11px; border-radius:var(--radius-btn); border:1px solid var(--ink-700); background:var(--ink-900); color:var(--text-100); margin-bottom:8px; font-size:14px; }
  .fila {
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background: linear-gradient(160deg, var(--ink-850) 0%, var(--ink-900) 100%);
    border:1px solid var(--ink-800); border-top:1px solid rgba(255,255,255,.06);
    border-left:4px solid var(--ink-700);
    border-radius:14px; padding:12px 14px; margin-bottom:10px; cursor:pointer;
    box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 10px 24px -14px rgba(0,0,0,.55);
    transition: transform .12s ease;
  }
  .fila:active { transform: scale(.98); }
  .fila:last-child { margin-bottom:0; }
  .fila.tipo-refill { border-left-color: var(--tipo-refill); }
  .fila.tipo-pedido_cliente { border-left-color: var(--tipo-pedido); }
  .fila.tipo-cesion { border-left-color: var(--tipo-cesion); }
  .estado { font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--ink-800); color:var(--text-500); white-space:nowrap; }
  .fila.tipo-refill .estado { background: var(--tipo-refill-bg); color: var(--tipo-refill-fg); }
  .fila.tipo-pedido_cliente .estado { background: var(--tipo-pedido-bg); color: var(--tipo-pedido-fg); }
  .fila.tipo-cesion .estado { background: var(--tipo-cesion-bg); color: var(--tipo-cesion-fg); }
  .grupo-titulo { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--text-500); margin:18px 0 8px; }
  .grupo-titulo:first-child { margin-top:0; }
  .error { color:var(--danger-fg); font-size:13px; margin-top:6px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .articulo { display:flex; gap:8px; align-items:center; padding:6px; border-radius:8px; cursor:pointer; }
  .articulo:hover { background:var(--ink-800); }
  .articulo img { width:36px; height:36px; object-fit:cover; border-radius:4px; background:#000; }
  .linea-chip { display:flex; justify-content:space-between; background:var(--ink-800); border-radius:8px; padding:8px; margin-top:6px; font-size:13px; color:var(--text-300); }

  .brand-head { display:flex; align-items:center; gap:10px; padding:10px 16px 0; }
  .brand-badge { background:#fff; border-radius:10px; padding:6px 10px; display:flex; align-items:center; box-shadow:0 2px 8px -3px rgba(0,0,0,.4); }
  .brand-badge img { display:block; height:30px; width:auto; }
  .brand-x { color:var(--text-600); font-size:14px; font-weight:600; }
  .theme-toggle { margin-left:auto; }
  button.theme-btn { width:auto; background:var(--ink-800); color:var(--text-300); padding:7px 10px; font-size:12px; margin:0; border:1px solid var(--ink-700); border-radius:var(--radius-btn); cursor:pointer; font-weight:700; display:flex; align-items:center; gap:5px; }
  .theme-btn svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  .koverlay { position:fixed; inset:0; background:rgba(5,7,10,.6); display:flex; align-items:center; justify-content:center; padding:20px; z-index:1000; }
  .kmodal { background:var(--ink-900); border:1px solid var(--ink-800); border-radius:var(--radius-card); padding:18px; max-width:360px; width:100%; max-height:85vh; overflow-y:auto; box-shadow:var(--shadow-card); }
  .kmodal-ancho { max-width:min(960px, 95vw); }
  .paletes-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:14px; margin:10px 0; align-items:start; }
  .palet-card { min-width:0; }
  .kmodal p { margin:0 0 14px; font-size:14.5px; line-height:1.45; color:var(--text-100); }
  .kmodal input.entrada { margin-bottom:0; }
  .kmodal .fila-botones { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .kmodal .fila-botones .btn { width:auto; min-width:84px; margin-top:0; }
  .theme-panel { background:var(--ink-900); border:1px solid var(--ink-800); border-radius:var(--radius-card); padding:12px; margin:10px 16px 0; display:none; }
  .theme-panel.abierto { display:block; }
  .picker-row { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .picker-row:last-child { margin-bottom:0; }
  .picker-label { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-600); width:52px; flex:none; }
  .pick { display:flex; align-items:center; gap:7px; padding:7px 11px 7px 8px; border-radius:var(--radius-chip); background:var(--ink-800); border:1px solid var(--ink-700); color:var(--text-300); font-size:12.5px; font-weight:600; cursor:pointer; }
  .pick .dot { width:13px; height:13px; border-radius:50%; flex:none; }
  .pick[data-for="indigo"] .dot { background:#4c7dff; }
  .pick[data-for="lmgreen"] .dot { background:#3fb54a; }
  .pick[data-for="taisared"] .dot { background:#e2263a; }
  .pick[data-for="amber"] .dot { background:#f0a020; }
  .pick.active { background:var(--accent-dim); border-color:var(--accent-line); color:var(--accent-ink); }
  [data-kmode="light"] .pick.active { color:var(--accent); }
  .pick[data-hidden] { display:none; }
</style>

  // ——— Modal in-página (sustituye prompt/confirm nativos) ———
  function kModal_(opts) {
    return new Promise(function (resolve) {
      var overlay = document.createElement('div');
      overlay.className = 'koverlay';
      var inputHtml = opts.input
        ? '<input class="entrada" type="' + (opts.numerico ? 'number' : 'text') + '" id="kmodalInput" value="' + (opts.valorInicial || '') + '">'
        : '';
      var botonesHtml = opts.cancelar
        ? '<button class="btn btn-ghost" id="kmodalCancelar">Cancelar</button><button class="btn btn-primary" id="kmodalAceptar">' + (opts.textoAceptar || 'Aceptar') + '</button>'
        : '<button class="btn btn-primary" id="kmodalAceptar">' + (opts.textoAceptar || 'Aceptar') + '</button>';
      overlay.innerHTML = '<div class="kmodal"><p>' + opts.mensaje + '</p>' + inputHtml + '<div class="fila-botones">' + botonesHtml + '</div></div>';
      document.body.appendChild(overlay);
      var input = overlay.querySelector('#kmodalInput');
      if (input) { input.focus(); input.select(); }
      function cerrar(valor) { document.body.removeChild(overlay); resolve(valor); }
      overlay.querySelector('#kmodalAceptar').onclick = function () { cerrar(opts.input ? input.value : true); };
      var btnCancelar = overlay.querySelector('#kmodalCancelar');
      if (btnCancelar) btnCancelar.onclick = function () { cerrar(opts.input ? null : false); };
      if (input) input.onkeydown = function (e) { if (e.key === 'Enter') overlay.querySelector('#kmodalAceptar').click(); };
    });
  }
  function kAlerta(mensaje) { return kModal_({ mensaje: mensaje, cancelar: false }); }
  function kConfirmar(mensaje) { return kModal_({ mensaje: mensaje, cancelar: true }); }
  function kPedirTexto(mensaje, opts) {
    opts = opts || {};
    return kModal_({ mensaje: mensaje, input: true, numerico: opts.numerico, valorInicial: opts.valorInicial, cancelar: true });
  }

  /** Refill: cada palet se lleva ENTERO (con todo lo que contenga), no por
   *  unidades. Elegir uno o varios de los palets disponibles con ese código
   *  — obligatorio, sin límite de cuántos. Resuelve al array de palets
   *  elegidos {sscc, ubicacion, cantidad}[], o null si se cancela. */
  function elegirPaletsModal_(candidatos) {
    return new Promise(function (resolve) {
      var overlay = document.createElement('div');
      overlay.className = 'koverlay';
      var seleccion = [];
      function cerrar(valor) { document.body.removeChild(overlay); resolve(valor); }
      function pintar() {
        overlay.innerHTML = '<div class="kmodal kmodal-ancho">' +
          '<p>¿Qué palet(es) mover? Se llevan enteros.</p>' +
          '<div class="paletes-grid">' +
          candidatos.map(function (c) {
            var elegido = seleccion.indexOf(c.sscc) !== -1;
            var tabla = (c.contenido || []).map(function (x) {
              return '<div style="display:grid;grid-template-columns:60px 1fr 36px;gap:4px;font-size:11.5px;padding:2px 0;">' +
                '<span style="color:var(--text-500);">' + escHtml(x.codigo_lm) + '</span>' +
                '<span>' + escHtml(x.designacion || '—') + '</span>' +
                '<span style="text-align:right;">' + x.cantidad + '</span></div>';
            }).join('');
            return '<div class="palet-card">' +
              '<button class="btn ' + (elegido ? 'btn-primary' : 'btn-ghost') + '" style="width:100%;margin-bottom:2px;text-align:left;" data-sscc="' + escHtml(c.sscc) + '">' +
              (elegido ? '✓ ' : '') + 'SSCC ' + escHtml(c.sscc) + ' · ' + escHtml(c.ubicacion || '—') + ' · ' + c.cantidad + ' ud</button>' +
              '<div style="margin:0 0 4px 4px;">' + tabla + '</div></div>';
          }).join('') +
          '</div>' +
          '<div class="fila-botones">' +
          '<button class="btn btn-ghost" id="kpaletCancelar">Cancelar</button>' +
          '<button class="btn btn-primary" id="kpaletAceptar"' + (!seleccion.length ? ' disabled' : '') + '>Confirmar (' + seleccion.length + ')</button>' +
          '</div></div>';
        overlay.querySelectorAll('[data-sscc]').forEach(function (btn) {
          btn.onclick = function () {
            var sscc = btn.getAttribute('data-sscc');
            var idx = seleccion.indexOf(sscc);
            if (idx === -1) seleccion.push(sscc); else seleccion.splice(idx, 1);
            pintar();
          };
        });
        overlay.querySelector('#kpaletCancelar').onclick = function () { cerrar(null); };
        overlay.querySelector('#kpaletAceptar').onclick = function () {
          if (!seleccion.length) return;
          cerrar(candidatos.filter(function (c) { return seleccion.indexOf(c.sscc) !== -1; }));
        };
      }
      document.body.appendChild(overlay);
      pintar();
    });
  }

  /** Refill por SSCC: lista de LM que contiene ese palet, se elige uno con
   *  un click (resuelve a esa fila, o null si se cancela). */
  function elegirLmDePaletModal_(filas) {
    return new Promise(function (resolve) {
      var overlay = document.createElement('div');
      overlay.className = 'koverlay';
      overlay.innerHTML = '<div class="kmodal">' +
        '<p>SSCC ' + escHtml(filas[0].sscc) + ' · ' + escHtml(filas[0].ubicacion || '—') + ' — ¿qué LM pides?</p>' +
        filas.map(function (f, idx) {
          return '<button class="btn btn-ghost" style="width:100%;margin-bottom:6px;text-align:left;" data-idx="' + idx + '">' +
            escHtml(f.codigo_lm) + ' · ' + escHtml(f.designacion || '—') + ' · ' + f.cantidad + ' ud</button>';
        }).join('') +
        '<div class="fila-botones"><button class="btn btn-ghost" id="klmCancelar">Cancelar</button></div></div>';
      function cerrar(valor) { document.body.removeChild(overlay); resolve(valor); }
      overlay.querySelectorAll('[data-idx]').forEach(function (btn) {
        btn.onclick = function () { cerrar(filas[Number(btn.getAttribute('data-idx'))]); };
      });
      overlay.querySelector('#klmCancelar').onclick = function () { cerrar(null); };
      document.body.appendChild(overlay);
    });
  }

  function renderBrandHeaderHtml_() {
    return '<div>' +
      '<div class="brand-head">' +
      '<div class="brand-badge"><img src="' + LOGO_TAISA_B64 + '" alt="Taisa"></div>' +
      '<span class="brand-x">×</span>' +
      '<div class="brand-badge"><img src="data:image/png;base64,' + LOGO_LM_B64 + '" alt="Leroy Merlin"></div>' +
      '<div class="theme-toggle"><button class="theme-btn" onclick="toggleThemePanel()" type="button">' + ICONO_TEMA + 'Tema</button></div>' +
      '</div>' +
      '<div class="theme-panel" id="themePanel">' +
      '<div class="picker-row"><span class="picker-label">Modo</span>' +
      '<button class="pick" data-mode="dark" onclick="setKModo(\'dark\')" type="button">Oscuro</button>' +
      '<button class="pick" data-mode="light" onclick="setKModo(\'light\')" type="button">Claro</button>' +
      '</div>' +
      '<div class="picker-row" id="acentoPicker">' +
      '<span class="picker-label">Acento</span>' +
      '<button class="pick" data-for="indigo" onclick="setKTema(\'indigo\')" type="button"><span class="dot"></span>Índigo</button>' +
      '<button class="pick" data-for="lmgreen" onclick="setKTema(\'lmgreen\')" type="button"><span class="dot"></span>Verde LM</button>' +
      '<button class="pick" data-for="taisared" onclick="setKTema(\'taisared\')" type="button"><span class="dot"></span>Rojo Taisa</button>' +
      '<button class="pick" data-for="amber" onclick="setKTema(\'amber\')" type="button"><span class="dot"></span>Ámbar</button>' +
      '</div></div></div>';
  }

  var ICONO_PETICIONES = '<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>';
  var ICONO_TRAZA = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>';
  function renderTabsPortal_(activa) {
    return '<div class="tabs">' +
      '<a href="#" id="tabPeticiones" class="' + (activa === 'cola' ? 'activa' : '') + '">' + ICONO_PETICIONES + '<span>Peticiones</span></a>' +
      '<a href="#" id="tabTrazabilidad" class="' + (activa === 'traza' ? 'activa' : '') + '">' + ICONO_TRAZA + '<span>Trazabilidad</span></a>' +
      '</div>';
  }

  function pintarCabecera_() {
    app().appendChild(el(renderBrandHeaderHtml_()));
    sincronizarPickers_();
  }

  function toggleThemePanel() {
    var p = document.getElementById('themePanel');
    if (p) p.classList.toggle('abierto');
  }

  function setKModo(modo) {
    document.documentElement.setAttribute('data-kmode', modo);
    try { localStorage.setItem('kairos_mode_pick', modo); } catch (e) {}
    var actual = document.documentElement.getAttribute('data-ktheme');
    if (TEMAS_MODOS[actual].indexOf(modo) === -1) setKTema('taisared'); else sincronizarPickers_();
  }

  function setKTema(nombre) {
    document.documentElement.setAttribute('data-ktheme', nombre);
    try { localStorage.setItem('kairos_theme_pick', nombre); } catch (e) {}
    sincronizarPickers_();
  }

  function sincronizarPickers_() {
    var modo = document.documentElement.getAttribute('data-kmode');
    var tema = document.documentElement.getAttribute('data-ktheme');
    var picks = document.querySelectorAll('.pick[data-mode]');
    for (var i = 0; i < picks.length; i++) picks[i].classList.toggle('active', picks[i].getAttribute('data-mode') === modo);
    picks = document.querySelectorAll('.pick[data-for]');
    for (var j = 0; j < picks.length; j++) {
      var p = picks[j];
      var nombre = p.getAttribute('data-for');
      p.toggleAttribute('data-hidden', TEMAS_MODOS[nombre].indexOf(modo) === -1);
      p.classList.toggle('active', nombre === tema);
    }
  }

  var LDAP = localStorage.getItem('kairos_ldap') || '';
  var TIENDA = localStorage.getItem('kairos_tienda') || '';
  var TIENDA_NOMBRE = localStorage.getItem('kairos_tienda_nombre') || '';
  var ROL = localStorage.getItem('kairos_rol') || '';
  var ETIQUETA_ROL = { vendedor: 'Vendedor', logistico: 'Logístico', gestor: 'Gestor' };

  function salir() {
    localStorage.removeItem('kairos_ldap');
    localStorage.removeItem('kairos_tienda');
    localStorage.removeItem('kairos_tienda_nombre');
    localStorage.removeItem('kairos_rol');
    LDAP = ''; TIENDA = ''; TIENDA_NOMBRE = ''; ROL = '';
    render();
  }

  function app() { return document.getElementById('app'); }

  function render() {
    app().innerHTML = '';
    if (!LDAP) { renderEntrar(); return; }
    renderCola();
  }

  document.addEventListener('DOMContentLoaded', function () { render(); });
</script>
<script>
  function renderEntrar() {
    pintarCabecera_();
    const c = el(
      '<div class="wrap"><div class="card">' +
        '<h2>Kairos</h2>' +
        '<p style="color:var(--text-500)">Escribe tu número de empleado para entrar.</p>' +
        '<input class="entrada" id="inLdap" placeholder="Número de empleado" inputmode="numeric">' +
        '<div class="error" id="errEntrar" style="display:none;"></div>' +
        '<button class="btn btn-primary" id="btnEntrar">Entrar</button>' +
      '</div></div>'
    );
    app().appendChild(c);
    const input = c.querySelector('#inLdap');
    const err = c.querySelector('#errEntrar');
    const boton = c.querySelector('#btnEntrar');
    function intentar() {
      const ldap = input.value.trim();
      err.style.display = 'none';
      boton.disabled = true; boton.textContent = 'Comprobando…';
      gas('entrar', ldap).then(function (r) {
        if (r.estado === 'no_existe') { renderAlta(ldap); return; }
        if (r.estado === 'pendiente') { renderPendiente(); return; }
        LDAP = r.ldap; TIENDA = r.tienda; TIENDA_NOMBRE = r.tiendaNombre; ROL = r.rol;
        localStorage.setItem('kairos_ldap', LDAP);
        localStorage.setItem('kairos_tienda', TIENDA);
        localStorage.setItem('kairos_tienda_nombre', TIENDA_NOMBRE);
        localStorage.setItem('kairos_rol', ROL);
        renderCola();
      }).catch(function (e) {
        err.textContent = e.message; err.style.display = 'block';
        boton.disabled = false; boton.textContent = 'Entrar';
      });
    }
    boton.onclick = intentar;
    input.onkeydown = function (e) { if (e.key === 'Enter') intentar(); };
  }

  function renderAlta(ldap) {
    app().innerHTML = '';
    pintarCabecera_();
    const c = el(
      '<div class="wrap"><div class="card">' +
        '<h2>Primera vez</h2>' +
        '<p style="color:var(--text-500)">No encontramos el número ' + escHtml(ldap) + '. Regístrate:</p>' +
        '<select class="entrada" id="selTienda">' +
          '<option value="014">Marbella</option>' +
          '<option value="279">Mijas</option>' +
        '</select>' +
        '<select class="entrada" id="selRol">' +
          '<option value="vendedor">Vendedor (solo Refill)</option>' +
          '<option value="logistico">Logístico (todas las peticiones)</option>' +
          '<option value="gestor">Gestor (todas + anular)</option>' +
        '</select>' +
        '<div class="error" id="errAlta" style="display:none;"></div>' +
        '<button class="btn btn-primary" id="btnAlta">Solicitar acceso</button>' +
        '<button class="btn btn-ghost" id="btnVolver">‹ Volver</button>' +
      '</div></div>'
    );
    app().appendChild(c);
    c.querySelector('#btnVolver').onclick = renderEntrar;
    c.querySelector('#btnAlta').onclick = function () {
      const err = c.querySelector('#errAlta');
      const tienda = c.querySelector('#selTienda').value;
      const rol = c.querySelector('#selRol').value;
      gas('registrarUsuario', ldap, tienda, rol).then(function () {
        renderPendiente();
      }).catch(function (e) {
        err.textContent = e.message; err.style.display = 'block';
      });
    };
  }

  function renderPendiente() {
    app().innerHTML = '';
    pintarCabecera_();
    const c = el(
      '<div class="wrap"><div class="card">' +
        '<h2>Pendiente de aprobación</h2>' +
        '<p style="color:var(--text-500)">Ya está registrado. En cuanto se apruebe podrás entrar.</p>' +
        '<button class="btn btn-primary" id="btnComprobar">Comprobar de nuevo</button>' +
      '</div></div>'
    );
    app().appendChild(c);
    c.querySelector('#btnComprobar').onclick = renderEntrar;
  }
</script>
<script>
  const ETIQUETA_TIPO = { pedido_cliente: 'Pedido cliente', cesion: 'Cesión', refill: 'Refill' };
  const NOMBRE_TIENDA = { '014': 'Marbella', '279': 'Mijas', '036': 'Málaga' };

  /** Gestor puede entrar en la tienda que quiera (no está atado a una) —
   *  cambia su registro (usuarios_tienda.tienda) y recarga la vista. */
  function pintarSelectorTienda_(contenedorAcciones) {
    if (ROL !== 'gestor') return;
    const opciones = Object.keys(NOMBRE_TIENDA).map(function (cod) {
      return '<option value="' + cod + '"' + (cod === TIENDA ? ' selected' : '') + '>' + NOMBRE_TIENDA[cod] + '</option>';
    }).join('');
    const sel = el('<select class="entrada" style="width:auto;margin:0;padding:6px 8px;font-size:12px;">' + opciones + '</select>');
    contenedorAcciones.insertBefore(sel, contenedorAcciones.firstChild);
    sel.onchange = function () {
      gas('cambiarTiendaActiva', LDAP, sel.value).then(function (r) {
        TIENDA = r.tienda; TIENDA_NOMBRE = r.tiendaNombre;
        localStorage.setItem('kairos_tienda', TIENDA);
        localStorage.setItem('kairos_tienda_nombre', TIENDA_NOMBRE);
        render();
      }).catch(function (e) { kAlerta(e.message); });
    };
  }

  function renderCola() {
    app().innerHTML = '';
    pintarCabecera_();
    const top = el(
      '<div class="top">' +
        '<div><b>' + escHtml(TIENDA_NOMBRE) + '</b> <span style="color:var(--text-500)">· ' + escHtml(LDAP) + ' · ' + escHtml(ETIQUETA_ROL[ROL] || ROL) + '</span></div>' +
        '<div style="display:flex;gap:6px;align-items:center;" id="topAcciones">' +
          '<button class="btn-ghost" style="width:auto;padding:6px 10px;" id="btnSalir">Salir</button>' +
        '</div>' +
      '</div>'
    );
    app().appendChild(top);
    top.querySelector('#btnSalir').onclick = salir;
    pintarSelectorTienda_(top.querySelector('#topAcciones'));
    const tabs = el(renderTabsPortal_('cola'));
    app().appendChild(tabs);
    tabs.querySelector('#tabTrazabilidad').onclick = function (e) { e.preventDefault(); renderTrazabilidad(); };

    const wrap = el('<div class="wrap"></div>');
    app().appendChild(wrap);
    wrap.appendChild(el('<button class="btn btn-primary" id="btnNueva">+ Nueva petición</button>'));
    const lista = el('<div class="card" id="lista"><p style="color:var(--text-500)">Cargando…</p></div>');
    wrap.appendChild(lista);
    wrap.querySelector('#btnNueva').onclick = renderNueva;

    gas('listarMisPeticiones', LDAP).then(function (filas) {
      lista.innerHTML = '';
      if (!filas.length) { lista.appendChild(el('<p style="color:var(--text-500)">No hay peticiones todavía.</p>')); return; }
      filas.forEach(function (p) {
        const fila = el(
          '<div class="fila tipo-' + p.tipo + '">' +
            '<div><b>' + escHtml(ETIQUETA_TIPO[p.tipo] || p.tipo) + '</b>' +
              ((p.num_pedido || p.num_cesion) ? ' · ' + escHtml(p.num_pedido || p.num_cesion) : '') +
              '<div style="color:var(--text-500);font-size:12px;">' + escHtml(p.articulo || '') + '</div>' +
              '<div style="color:var(--text-500);font-size:12px;">' + escHtml(p.solicitante_ldap || '—') + ' · ' + new Date(p.creada_en).toLocaleString('es-ES') + '</div>' +
            '</div>' +
            '<span class="estado">' + escHtml(p.estadoTexto) + '</span>' +
          '</div>'
        );
        fila.onclick = function () { renderDetalle(p.id); };
        lista.appendChild(fila);
      });
    }).catch(function (e) {
      lista.innerHTML = '<p class="error">' + escHtml(e.message) + '</p>';
    });
  }

  function renderTrazabilidad() {
    app().innerHTML = '';
    pintarCabecera_();
    const top = el(
      '<div class="top">' +
        '<div><b>' + escHtml(TIENDA_NOMBRE) + '</b> <span style="color:var(--text-500)">· ' + escHtml(LDAP) + ' · ' + escHtml(ETIQUETA_ROL[ROL] || ROL) + '</span></div>' +
        '<div style="display:flex;gap:6px;align-items:center;" id="topAcciones">' +
          '<button class="btn-ghost" style="width:auto;padding:6px 10px;" id="btnSalir">Salir</button>' +
        '</div>' +
      '</div>'
    );
    app().appendChild(top);
    top.querySelector('#btnSalir').onclick = salir;
    pintarSelectorTienda_(top.querySelector('#topAcciones'));
    const tabs = el(renderTabsPortal_('traza'));
    app().appendChild(tabs);
    tabs.querySelector('#tabPeticiones').onclick = function (e) { e.preventDefault(); renderCola(); };

    const wrap = el('<div class="wrap"></div>');
    app().appendChild(wrap);
    wrap.appendChild(el('<input class="entrada" id="inBuscarTraza" placeholder="Buscar por nº pedido, SSCC, LM, quién pidió, motivo…">'));
    const lista = el('<div class="card" id="listaTraza"><p style="color:var(--text-500)">Cargando…</p></div>');
    wrap.appendChild(lista);

    var todasTraza = [];
    const GRUPOS_TRAZA = [
      { tipo: 'refill', label: 'Refill', clase: 'tipo-refill' },
      { tipo: 'pedido_cliente', label: 'Pedido cliente', clase: 'tipo-pedido_cliente' },
      { tipo: 'cesion', label: 'Cesión', clase: 'tipo-cesion' },
    ];
    function pintarTraza(filas) {
      lista.innerHTML = '';
      if (!filas.length) { lista.appendChild(el('<p style="color:var(--text-500)">No hay peticiones.</p>')); return; }
      var huboAlguna = false;
      GRUPOS_TRAZA.forEach(function (g) {
        const deEsteGrupo = filas.filter(function (p) { return p.tipo === g.tipo; })
          .sort(function (a, b) { return new Date(a.creada_en) - new Date(b.creada_en); });
        if (!deEsteGrupo.length) return;
        huboAlguna = true;
        lista.appendChild(el('<div class="grupo-titulo">' + g.label + ' (' + deEsteGrupo.length + ')</div>'));
        deEsteGrupo.forEach(function (p) {
          var detalle;
          if (p.estado === 'anulada') detalle = 'Anulada';
          else if (p.camino === 'a_ubicar') detalle = p.estadoTexto;
          else if (p.camino === 'hodos') detalle = 'HODOS: ' + p.hodosTexto;
          else detalle = 'Refill: ' + p.refillTexto;
          const fila = el(
            '<div class="fila ' + g.clase + '">' +
              '<div><b>' + escHtml(ETIQUETA_TIPO[p.tipo] || p.tipo) + '</b>' +
                ((p.num_pedido || p.num_cesion) ? ' · ' + escHtml(p.num_pedido || p.num_cesion) : '') +
                '<div style="color:var(--text-500);font-size:12px;">' + escHtml(p.articulo || '') + (p.motivo ? ' · ' + escHtml(p.motivo) : '') + '</div>' +
                (p.sscc && p.sscc.length ? '<div style="color:var(--text-500);font-size:12px;">SSCC ' + escHtml(p.sscc.join(' · ')) + '</div>' : '') +
                '<div style="color:var(--text-500);font-size:12px;">' + escHtml(p.solicitante_ldap || '—') + ' · ' + new Date(p.creada_en).toLocaleString('es-ES') + '</div>' +
              '</div>' +
              '<span class="estado">' + escHtml(detalle) + '</span>' +
            '</div>'
          );
          fila.onclick = function () { renderDetalle(p.id, renderTrazabilidad); };
          lista.appendChild(fila);
        });
      });
      if (!huboAlguna) lista.appendChild(el('<p style="color:var(--text-500)">No hay peticiones con esos filtros.</p>'));
    }

    gas('listarTrazabilidad', LDAP).then(function (filas) {
      todasTraza = filas;
      pintarTraza(todasTraza);
    }).catch(function (e) {
      lista.innerHTML = '<p class="error">' + escHtml(e.message) + '</p>';
    });

    wrap.querySelector('#inBuscarTraza').oninput = function (e) {
      const q = e.target.value.trim().toLowerCase();
      if (!q) { pintarTraza(todasTraza); return; }
      pintarTraza(todasTraza.filter(function (p) {
        return [
          p.num_pedido, p.num_cesion, p.solicitante_ldap, p.motivo, p.articulo,
          (p.sscc || []).join(' '), ETIQUETA_TIPO[p.tipo] || p.tipo,
        ].filter(Boolean).join(' ').toLowerCase().indexOf(q) !== -1;
      }));
    };
  }
</script>
<script>
  function renderNueva() {
    app().innerHTML = '';
    pintarCabecera_();
    const soloRefill = ROL === 'vendedor';
    const c = el(
      '<div class="wrap"><div class="card">' +
        '<button class="btn btn-ghost" id="btnVolver">‹ Volver</button>' +
        '<h2>Nueva petición</h2>' +
        '<button class="btn btn-primary" id="btnRefill">Refill</button>' +
        (soloRefill ? '' :
          '<button class="btn btn-primary" id="btnPC">Pedido cliente</button>' +
          '<button class="btn btn-primary" id="btnCesion">Cesión</button>') +
      '</div></div>'
    );
    app().appendChild(c);
    c.querySelector('#btnVolver').onclick = renderCola;
    c.querySelector('#btnRefill').onclick = function () { renderFormulario('refill'); };
    if (!soloRefill) {
      c.querySelector('#btnPC').onclick = function () { renderFormulario('pedido_cliente'); };
      c.querySelector('#btnCesion').onclick = function () { renderFormulario('cesion'); };
    }
  }

  function renderFormulario(tipo) {
    app().innerHTML = '';
    pintarCabecera_();
    var camposTipo = '';
    if (tipo === 'pedido_cliente') {
      camposTipo =
        '<input class="entrada" id="inNumPedido" placeholder="Nº de pedido">' +
        '<label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">' +
          '<input type="checkbox" id="inTransporte"> Con transporte (se consolida en plataforma)' +
        '</label>';
    } else if (tipo === 'cesion') {
      camposTipo =
        '<input class="entrada" id="inNumCesion" placeholder="Nº de cesión">' +
        '<select class="entrada" id="inDestino">' +
          '<option value="014">Marbella</option>' +
          '<option value="279">Mijas</option>' +
          '<option value="036">Málaga</option>' +
        '</select>';
    } else {
      camposTipo = '<input class="entrada" id="inMotivo" placeholder="Motivo del refill">';
    }

    const unidadLabel = tipo === 'refill' ? 'nº de palets' : 'unidades';
    const c = el(
      '<div class="wrap"><div class="card">' +
        '<button class="btn btn-ghost" id="btnVolver">‹ Volver</button>' +
        '<h2>' + escHtml(ETIQUETA_TIPO[tipo]) + '</h2>' +
        camposTipo +
        '<hr style="border-color:var(--ink-800);margin:12px 0;">' +
        '<b>Artículos</b>' +
        '<input class="entrada" id="inBuscar" placeholder="Código LM o nombre del artículo" autocomplete="off">' +
        (tipo === 'refill' ? '<button class="btn btn-ghost" id="btnBuscarSscc" style="width:auto;padding:6px 10px;margin:4px 0 8px;">📦 Buscar por SSCC en vez de LM</button>' : '') +
        '<div id="resultadosBusqueda"></div>' +
        '<div id="lineasAnadidas"></div>' +
        '<input class="entrada" id="inComentario" placeholder="Comentario (opcional)">' +
        '<div class="error" id="errForm" style="display:none;"></div>' +
        '<button class="btn btn-primary" id="btnEnviar">Enviar petición</button>' +
      '</div></div>'
    );
    app().appendChild(c);
    c.querySelector('#btnVolver').onclick = renderCola;

    var lineas = []; // { codigoLm, designacion, ean, seccion, cantidad }
    var articuloElegido = null;

    function pintarLineas() {
      const cont = c.querySelector('#lineasAnadidas');
      cont.innerHTML = '';
      lineas.forEach(function (l, idx) {
        const chip = el(
          '<div class="linea-chip"><span>' + escHtml(l.codigoLm) + ' · ' + escHtml(l.designacion || '—') +
            ' · ' + l.cantidad + ' ' + unidadLabel + '</span>' +
            '<button class="btn-ghost" style="width:auto;padding:2px 8px;" data-idx="' + idx + '">Quitar</button></div>'
        );
        chip.querySelector('button').onclick = function () { lineas.splice(idx, 1); pintarLineas(); };
        cont.appendChild(chip);
      });
    }

    const btnBuscarSscc = c.querySelector('#btnBuscarSscc');
    if (btnBuscarSscc) {
      btnBuscarSscc.onclick = function () {
        kPedirTexto('SSCC del palet:').then(function (ssccTexto) {
          const ssccBuscado = (ssccTexto || '').trim();
          if (!ssccBuscado) return;
          gas('buscarPaletPorSscc', LDAP, ssccBuscado).then(function (filas) {
            if (!filas.length) { kAlerta('No se ha encontrado ese SSCC con stock en almacén.'); return; }
            elegirLmDePaletModal_(filas).then(function (elegido) {
              if (!elegido) return;
              lineas.push({
                codigoLm: elegido.codigo_lm, designacion: elegido.designacion,
                ean: elegido.ean, seccion: elegido.seccion, cantidad: 1,
                sscc: elegido.sscc + ' (' + elegido.cantidad + 'ud)',
                ubicacion: elegido.ubicacion,
              });
              pintarLineas();
            });
          });
        });
      };
    }

    const inputBuscar = c.querySelector('#inBuscar');
    const resultados = c.querySelector('#resultadosBusqueda');
    var timerBuscar = null;
    inputBuscar.oninput = function () {
      articuloElegido = null;
      clearTimeout(timerBuscar);
      const texto = inputBuscar.value;
      timerBuscar = setTimeout(function () {
        if (texto.trim().length < 2) { resultados.innerHTML = ''; return; }
        gas('buscarArticulos', texto).then(function (filas) {
          resultados.innerHTML = '';
          filas.forEach(function (a) {
            const fila = el(
              '<div class="articulo">' +
                (a.foto_url ? '<img src="' + escHtml(a.foto_url) + '">' : '') +
                '<div><div><b>' + escHtml(a.codigo_lm) + '</b> · ' + escHtml(a.designacion || '') + '</div>' +
                '<div style="color:var(--text-500);font-size:12px;">' + escHtml(a.seccion || '') + '</div></div>' +
              '</div>'
            );
            fila.onclick = function () {
              articuloElegido = a;
              inputBuscar.value = a.codigo_lm + ' · ' + (a.designacion || '');
              resultados.innerHTML = '';
              if (tipo === 'refill') elegirPaletsRefill_(a); else pedirCantidad();
            };
            resultados.appendChild(fila);
          });
        });
      }, 300);
    };

    /** Refill: sin preguntar cantidad — se eligen palets enteros directamente. */
    function elegirPaletsRefill_(articulo) {
      gas('verificarAntesDeAnadir', LDAP, articulo.codigo_lm, 1).then(function (chk) {
        function continuar() {
          gas('listarSsccDisponibles', LDAP, articulo.codigo_lm).then(function (candidatos) {
            if (!candidatos.length) { kAlerta('No hay palets con stock de ' + articulo.codigo_lm + ' en almacén.'); return; }
            elegirPaletsModal_(candidatos).then(function (seleccionados) {
              if (!seleccionados || !seleccionados.length) return;
              lineas.push({
                codigoLm: articulo.codigo_lm, designacion: articulo.designacion,
                ean: articulo.ean, seccion: articulo.seccion, cantidad: seleccionados.length,
                sscc: seleccionados.map(function (s) { return s.sscc + ' (' + s.cantidad + 'ud)'; }).join(' + '),
                ubicacion: seleccionados.map(function (s) { return s.ubicacion; }).join(' + '),
              });
              inputBuscar.value = ''; articuloElegido = null;
              pintarLineas();
            });
          });
        }
        if (chk.duplicados.length) {
          kAlerta('Ya hay una petición abierta (' + (ETIQUETA_TIPO[chk.duplicados[0].tipo] || chk.duplicados[0].tipo) +
            ') con este artículo — se añadirá de todas formas.').then(continuar);
        } else {
          continuar();
        }
      });
    }

    function pedirCantidad() {
      const articulo = articuloElegido;
      // Se consulta el disponible ANTES de preguntar cantidad, para mostrarlo
      // en la propia pregunta (proactivo, no solo avisar si falla después).
      gas('verificarAntesDeAnadir', LDAP, articulo.codigo_lm, 1).then(function (chk) {
        kPedirTexto('¿Cuántas ' + unidadLabel + ' de ' + articulo.codigo_lm + '? (disponibles: ' + chk.disponible + ')', { numerico: true }).then(function (cantidadTexto) {
          const cantidad = Number(cantidadTexto);
          if (!cantidad || cantidad <= 0) return;
          // El palet lo asigna el almacén internamente al preparar (como la
          // app original) — aquí no se elige, solo unidades.
          function anadir() {
            lineas.push({
              codigoLm: articulo.codigo_lm, designacion: articulo.designacion,
              ean: articulo.ean, seccion: articulo.seccion, cantidad: cantidad,
            });
            inputBuscar.value = ''; articuloElegido = null;
            pintarLineas();
          }
          function avisarDuplicadoYSeguir() {
            if (chk.duplicados.length) {
              kAlerta('Ya hay una petición abierta (' + (ETIQUETA_TIPO[chk.duplicados[0].tipo] || chk.duplicados[0].tipo) +
                ') con este artículo — se añadirá de todas formas.').then(anadir);
            } else {
              anadir();
            }
          }
          // Sin stock suficiente NO bloquea — solo avisa (un compañero de la
          // misma tienda debe poder pedir igual aunque ya esté comprometido).
          if (cantidad > chk.disponible) {
            kAlerta('Solo hay ' + chk.disponible + ' ' + unidadLabel + ' disponibles de ' + articulo.codigo_lm + ' en almacén — se añadirá de todas formas.')
              .then(avisarDuplicadoYSeguir);
          } else {
            avisarDuplicadoYSeguir();
          }
        });
      });
    }

    c.querySelector('#btnEnviar').onclick = function () {
      const err = c.querySelector('#errForm');
      err.style.display = 'none';
      if (!lineas.length) { err.textContent = 'Añade al menos un artículo.'; err.style.display = 'block'; return; }
      var datos = { comentario: c.querySelector('#inComentario').value.trim() || null };
      if (tipo === 'pedido_cliente') {
        datos.numPedido = c.querySelector('#inNumPedido').value.trim();
        datos.transporte = c.querySelector('#inTransporte').checked;
        if (!datos.numPedido) { err.textContent = 'Falta el número de pedido.'; err.style.display = 'block'; return; }
      } else if (tipo === 'cesion') {
        datos.tiendaDestino = c.querySelector('#inDestino').value;
        datos.numCesion = c.querySelector('#inNumCesion').value.trim();
        if (!datos.numCesion) { err.textContent = 'Falta el número de cesión.'; err.style.display = 'block'; return; }
      } else {
        datos.motivo = c.querySelector('#inMotivo').value.trim();
        if (!datos.motivo) { err.textContent = 'Falta el motivo.'; err.style.display = 'block'; return; }
      }
      gas('crearPeticion', LDAP, tipo, datos, lineas).then(function () {
        renderCola();
      }).catch(function (e) {
        err.textContent = e.message; err.style.display = 'block';
      });
    };
  }
</script>
<script>
  function renderDetalle(id, origen) {
    origen = origen || renderCola;
    app().innerHTML = '';
    pintarCabecera_();
    const c = el(
      '<div class="wrap"><div class="card" id="detalle">' +
        '<button class="btn btn-ghost" id="btnVolver">‹ Volver</button>' +
        '<p style="color:var(--text-500)">Cargando…</p>' +
      '</div></div>'
    );
    app().appendChild(c);
    c.querySelector('#btnVolver').onclick = origen;

    gas('obtenerDetallePeticion', LDAP, id).then(function (r) {
      const p = r.peticion;
      var camposTipo = '';
      if (p.tipo === 'pedido_cliente') {
        camposTipo = '<div><b>Nº pedido</b> ' + escHtml(p.num_pedido) + '</div>' +
          '<div><b>Transporte</b> ' + (p.transporte ? 'Sí (consolida en plataforma)' : 'No') + '</div>';
      } else if (p.tipo === 'cesion') {
        camposTipo = '<div><b>Nº cesión</b> ' + escHtml(p.num_cesion) + '</div>' +
          '<div><b>Destino</b> ' + escHtml(NOMBRE_TIENDA[p.tienda_destino] || p.tienda_destino) + '</div>';
      }
      const filasLineas = r.lineas.map(function (l) {
        return '<div class="linea-chip"><span>' + escHtml(l.codigo_lm) + ' · ' + escHtml(l.designacion || '—') +
          ' · ' + l.cantidad + ' ' + escHtml(l.unidad_medida) +
          (l.sscc ? ' · SSCC ' + escHtml(l.sscc) : '') +
          '</span>' +
          '<span class="estado">' + escHtml(l.estado_preparacion) + '</span></div>';
      }).join('');
      const hodosLinea = r.hodosTexto ? '<div style="margin-top:8px;"><b>HODOS</b> ' + escHtml(r.hodosTexto) + '</div>' : '';
      const puedeAnular = ROL === 'gestor' && p.estado !== 'cerrada' && p.estado !== 'anulada';

      const cont = app().querySelector('#detalle');
      cont.innerHTML =
        '<button class="btn btn-ghost" id="btnVolver2">‹ Volver</button>' +
        '<h2>' + escHtml(ETIQUETA_TIPO[p.tipo]) + '</h2>' +
        '<span class="estado">' + escHtml(p.estadoTexto) + '</span>' +
        '<div style="margin-top:8px;color:var(--text-500);">Pedido por ' + escHtml(p.solicitante_ldap || '—') + ' · ' + new Date(p.creada_en).toLocaleString('es-ES') + '</div>' +
        '<div style="margin-top:8px;">' + camposTipo + '</div>' +
        (p.motivo ? '<div style="margin-top:8px;"><b>Motivo</b> ' + escHtml(p.motivo) + '</div>' : '') +
        hodosLinea +
        (p.comentario ? '<div style="margin-top:8px;"><b>Comentario</b> ' + escHtml(p.comentario) + '</div>' : '') +
        (puedeAnular ? '<button class="btn btn-danger" id="btnAnular" style="margin-top:10px;">Anular petición</button>' : '') +
        '<hr style="border-color:var(--ink-800);margin:12px 0;">' +
        filasLineas;
      cont.querySelector('#btnVolver2').onclick = origen;
      if (puedeAnular) {
        cont.querySelector('#btnAnular').onclick = function () {
          kConfirmar('¿Anular esta petición? No se puede deshacer.').then(function (ok) {
            if (!ok) return;
            gas('anularPeticion', LDAP, id).then(function () { renderDetalle(id, origen); })
              .catch(function (e) { kAlerta(e.message); });
          });
        };
      }
    }).catch(function (e) {
      app().querySelector('#detalle').innerHTML = '<p class="error">' + escHtml(e.message) + '</p>';
    });
  }
</script>
<script>
  if (String(<?= esAdmin ?>) === 'true') {
    render = renderAdminLogin; // sustituye el router normal en esta pestaña
  }

  function renderAdminLogin() {
    app().innerHTML = '';
    pintarCabecera_();
    const c = el(
      '<div class="wrap"><div class="card">' +
        '<h2>Kairos · Admin</h2>' +
        '<input class="entrada" id="inPass" type="password" placeholder="Contraseña de administrador">' +
        '<div class="error" id="errAdmin" style="display:none;"></div>' +
        '<button class="btn btn-primary" id="btnAdminEntrar">Entrar</button>' +
      '</div></div>'
    );
    app().appendChild(c);
    c.querySelector('#btnAdminEntrar').onclick = function () {
      const pass = c.querySelector('#inPass').value;
      renderAdmin(pass);
    };
  }

  function renderAdmin(passwordAdmin) {
    app().innerHTML = '';
    pintarCabecera_();
    const c = el(
      '<div class="wrap"><div class="card">' +
        '<h2>Pendientes de aprobar</h2>' +
        '<div id="listaAdmin"><p style="color:var(--text-500)">Cargando…</p></div>' +
      '</div></div>'
    );
    app().appendChild(c);
    const lista = c.querySelector('#listaAdmin');

    function cargar() {
      gas('listarPendientesAprobacion', passwordAdmin).then(function (filas) {
        lista.innerHTML = '';
        if (!filas.length) { lista.appendChild(el('<p style="color:var(--text-500)">No hay nadie pendiente.</p>')); return; }
        filas.forEach(function (u) {
          const fila = el(
            '<div class="fila" style="cursor:default;">' +
              '<div><b>' + escHtml(u.ldap) + '</b> · ' + escHtml(u.tiendaNombre) + ' · ' + escHtml(ETIQUETA_ROL[u.rol] || u.rol) + '</div>' +
              '<div>' +
                '<button class="btn-ghost" style="width:auto;padding:6px 10px;" data-a="ap">Aprobar</button> ' +
                '<button class="btn-ghost" style="width:auto;padding:6px 10px;color:var(--danger-fg);" data-a="re">Rechazar</button>' +
              '</div>' +
            '</div>'
          );
          fila.querySelector('[data-a="ap"]').onclick = function () {
            gas('aprobarUsuario', passwordAdmin, u.id).then(cargar);
          };
          fila.querySelector('[data-a="re"]').onclick = function () {
            kConfirmar('¿Rechazar a ' + u.ldap + '?').then(function (ok) {
              if (!ok) return;
              gas('rechazarUsuario', passwordAdmin, u.id).then(cargar);
            });
          };
          lista.appendChild(fila);
        });
      }).catch(function (e) {
        lista.innerHTML = '<p class="error">' + escHtml(e.message) + '</p>';
      });
    }
    cargar();
  }
</script>
