<script>
  function renderEntrar() {
    pintarCabecera_();
    const c = el(
      '<div class="wrap"><div class="card">' +
        '<h2>Kairos</h2>' +
        '<p style="color:var(--text-500)">Escribe tu número de empleado para entrar.</p>' +
        '<input class="entrada" id="inLdap" placeholder="Número de empleado" inputmode="numeric">' +
        '<div class="error" id="errEntrar" style="display:none;"></div>' +
        '<button class="btn btn-primary" id="btnEntrar">Entrar</button>' +
      '</div></div>'
    );
    app().appendChild(c);
    const input = c.querySelector('#inLdap');
    const err = c.querySelector('#errEntrar');
    const boton = c.querySelector('#btnEntrar');
    function intentar() {
      const ldap = input.value.trim();
      err.style.display = 'none';
      boton.disabled = true; boton.textContent = 'Comprobando…';
      gas('entrar', ldap).then(function (r) {
        if (r.estado === 'no_existe') { renderAlta(ldap); return; }
        if (r.estado === 'pendiente') { renderPendiente(); return; }
        LDAP = r.ldap; TIENDA = r.tienda; TIENDA_NOMBRE = r.tiendaNombre; ROL = r.rol;
        localStorage.setItem('kairos_ldap', LDAP);
        localStorage.setItem('kairos_tienda', TIENDA);
        localStorage.setItem('kairos_tienda_nombre', TIENDA_NOMBRE);
        localStorage.setItem('kairos_rol', ROL);
        renderCola();
      }).catch(function (e) {
        err.textContent = e.message; err.style.display = 'block';
        boton.disabled = false; boton.textContent = 'Entrar';
      });
    }
    boton.onclick = intentar;
    input.onkeydown = function (e) { if (e.key === 'Enter') intentar(); };
  }

  function renderAlta(ldap) {
    app().innerHTML = '';
    pintarCabecera_();
    const c = el(
      '<div class="wrap"><div class="card">' +
        '<h2>Primera vez</h2>' +
        '<p style="color:var(--text-500)">No encontramos el número ' + escHtml(ldap) + '. Regístrate:</p>' +
        '<input class="entrada" id="inNombre" placeholder="Nombre">' +
        '<input class="entrada" id="inApellido" placeholder="Apellido">' +
        '<input class="entrada" id="inSeccion" placeholder="Sección">' +
        '<select class="entrada" id="selTienda">' +
          '<option value="" selected disabled>Elige tu tienda…</option>' +
          '<option value="014">Marbella</option>' +
          '<option value="279">Mijas</option>' +
        '</select>' +
        '<select class="entrada" id="selRol">' +
          '<option value="" selected disabled>Elige tu rol…</option>' +
          '<option value="vendedor">Reposición</option>' +
          '<option value="logistico">Logística</option>' +
          '<option value="gestor">Coordinación</option>' +
        '</select>' +
        '<div class="error" id="errAlta" style="display:none;"></div>' +
        '<button class="btn btn-primary" id="btnAlta">Solicitar acceso</button>' +
        '<button class="btn btn-ghost" id="btnVolver">‹ Volver</button>' +
      '</div></div>'
    );
    app().appendChild(c);
    c.querySelector('#btnVolver').onclick = renderEntrar;
    c.querySelector('#btnAlta').onclick = function () {
      const err = c.querySelector('#errAlta');
      const nombre = c.querySelector('#inNombre').value.trim();
      const apellido = c.querySelector('#inApellido').value.trim();
      const seccion = c.querySelector('#inSeccion').value.trim();
      const tienda = c.querySelector('#selTienda').value;
      const rol = c.querySelector('#selRol').value;
      if (!nombre) { err.textContent = 'Escribe tu nombre.'; err.style.display = 'block'; return; }
      if (!apellido) { err.textContent = 'Escribe tu apellido.'; err.style.display = 'block'; return; }
      if (!seccion) { err.textContent = 'Escribe tu sección.'; err.style.display = 'block'; return; }
      if (!tienda) { err.textContent = 'Elige tu tienda.'; err.style.display = 'block'; return; }
      if (!rol) { err.textContent = 'Elige tu rol.'; err.style.display = 'block'; return; }
      gas('registrarUsuario', ldap, tienda, rol, nombre, apellido, seccion).then(function () {
        renderPendiente();
      }).catch(function (e) {
        err.textContent = e.message; err.style.display = 'block';
      });
    };
    ['#inNombre', '#inApellido', '#inSeccion'].forEach(function (sel) {
      c.querySelector(sel).onkeydown = function (e) { if (e.key === 'Enter') c.querySelector('#btnAlta').click(); };
    });
  }

  function renderPendiente() {
    app().innerHTML = '';
    pintarCabecera_();
    const c = el(
      '<div class="wrap"><div class="card">' +
        '<h2>Pendiente de aprobación</h2>' +
        '<p style="color:var(--text-500)">Ya está registrado. En cuanto se apruebe podrás entrar.</p>' +
        '<button class="btn btn-primary" id="btnComprobar">Comprobar de nuevo</button>' +
      '</div></div>'
    );
    app().appendChild(c);
    c.querySelector('#btnComprobar').onclick = renderEntrar;
  }
</script>
<script>
  const ETIQUETA_TIPO = { pedido_cliente: 'Pedido cliente', cesion: 'Cesión', refill: 'Refill' };
  const NOMBRE_TIENDA = { '014': 'Marbella', '279': 'Mijas' };
  // Destinos válidos de cesión — Málaga (036) nunca opera Kairos (no tiene
  // reserva propia, nunca pide), pero SÍ puede recibir una cesión de
  // Marbella o Mijas. Mapa aparte de NOMBRE_TIENDA a propósito: ese otro
  // alimenta el selector de "tienda en la que opera Master" y Málaga no
  // debe aparecer ahí.
  const NOMBRE_TIENDA_DESTINO_ = Object.assign({}, NOMBRE_TIENDA, { '036': 'Málaga' });

  function fechaCorta_(iso) {
    const m = String(iso || '').match(/^\d{4}-(\d{2})-(\d{2})$/);
    return m ? m[2] + '/' + m[1] : '';
  }
  function hoyIso_() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function ultimoLaborableAnteriorIso_(iso) {
    const p = String(iso).split('-').map(Number);
    const d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    do { d.setUTCDate(d.getUTCDate() - 1); } while (d.getUTCDay() === 0 || d.getUTCDay() === 6);
    return d.toISOString().slice(0, 10);
  }
  function textoEntrega_(p) {
    if (!p.fecha_entrega) return '';
    return 'Entrega ' + fechaCorta_(p.fecha_entrega) + (p.reservaFutura ? ' · sale a preparación ' + fechaCorta_(p.visible_desde) : '');
  }
  const ROLES_ASIGNABLES_ = ['vendedor', 'logistico', 'gestor']; // 'master' nunca asignable desde aquí

  /** Gestor puede entrar en la tienda que quiera (no está atado a una) —
   *  cambia su registro (usuarios_tienda.tienda) y recarga la vista. */
  function pintarSelectorTienda_(contenedorAcciones) {
    if (ROL !== 'master') return;
    const opciones = Object.keys(NOMBRE_TIENDA).map(function (cod) {
      return '<option value="' + cod + '"' + (cod === TIENDA ? ' selected' : '') + '>' + NOMBRE_TIENDA[cod] + '</option>';
    }).join('');
    const sel = el('<select class="entrada" style="width:auto;margin:0;padding:6px 8px;font-size:12px;">' + opciones + '</select>');
    contenedorAcciones.insertBefore(sel, contenedorAcciones.firstChild);
    sel.onchange = function () {
      gas('cambiarTiendaActiva', LDAP, sel.value).then(function (r) {
        TIENDA = r.tienda; TIENDA_NOMBRE = r.tiendaNombre;
        localStorage.setItem('kairos_tienda', TIENDA);
        localStorage.setItem('kairos_tienda_nombre', TIENDA_NOMBRE);
        render();
      }).catch(function (e) { kAlerta(e.message); });
    };
  }

  /** Gestor/master gestionan (aprobar/rechazar altas, revocar, cambiar rol)
   *  la gente de su propia tienda directamente desde el portal — sin la
   *  contraseña de admin aparte. */
  function pintarBotonUsuarios_(contenedorAcciones) {
    if (ROL !== 'gestor' && ROL !== 'master') return;
    const btn = el('<button class="btn-ghost" style="width:auto;padding:6px 10px;">Usuarios</button>');
    contenedorAcciones.insertBefore(btn, contenedorAcciones.firstChild);
    btn.onclick = renderGestionUsuarios;
  }

  /** Solo Master: apagar/encender Refill (Ajustes.js). */
  function pintarBotonAjustes_(contenedorAcciones) {
    if (ROL !== 'master') return;
    const btn = el('<button class="btn-ghost" style="width:auto;padding:6px 10px;">⚙ Ajustes</button>');
    contenedorAcciones.insertBefore(btn, contenedorAcciones.firstChild);
    btn.onclick = renderAjustes;
  }

  function renderAjustes() {
    app().innerHTML = '';
    pintarCabecera_();
    const top = el(
      '<div class="top">' +
        '<div><b>Ajustes</b></div>' +
        '<button class="btn-ghost" style="width:auto;padding:6px 10px;" id="btnVolverAjustes">‹ Volver</button>' +
      '</div>'
    );
    app().appendChild(top);
    top.querySelector('#btnVolverAjustes').onclick = renderCola;

    const c = el(
      '<div class="wrap"><div class="card">' +
        '<b>Refill</b>' +
        '<p style="color:var(--text-500);font-size:13px;margin:4px 0 10px;">Apaga Refill para todas las tiendas — nadie podrá crear peticiones nuevas de Refill hasta que lo vuelvas a encender. Lo que ya esté en curso sigue igual.</p>' +
        '<p class="meta" id="estadoRefillAjuste">Cargando…</p>' +
        '<button class="btn btn-primary" id="btnToggleRefill" disabled>Cargando…</button>' +
      '</div></div>'
    );
    app().appendChild(c);
    const estado = c.querySelector('#estadoRefillAjuste');
    const btn = c.querySelector('#btnToggleRefill');
    var habilitadoActual = true;

    function pintarEstado() {
      estado.textContent = habilitadoActual ? 'Refill: ACTIVADO' : 'Refill: DESACTIVADO';
      estado.style.color = habilitadoActual ? 'var(--ok)' : 'var(--danger-fg)';
      btn.textContent = habilitadoActual ? 'Desactivar Refill' : 'Activar Refill';
      btn.disabled = false;
    }

    gas('refillHabilitado').then(function (r) {
      habilitadoActual = !!r.habilitado;
      pintarEstado();
    }).catch(function (e) { estado.textContent = e.message; });

    btn.onclick = function () {
      btn.disabled = true;
      gas('establecerRefillHabilitado', LDAP, !habilitadoActual).then(function () {
        habilitadoActual = !habilitadoActual;
        pintarEstado();
      }).catch(function (e) { kAlerta(e.message); btn.disabled = false; });
    };
  }

  function renderGestionUsuarios() {
    app().innerHTML = '';
    pintarCabecera_();
    const top = el(
      '<div class="top">' +
        '<div><b>Usuarios</b> <span style="color:var(--text-500)">· ' + escHtml(TIENDA_NOMBRE) + '</span></div>' +
        '<button class="btn-ghost" style="width:auto;padding:6px 10px;" id="btnVolverUsuarios">‹ Volver</button>' +
      '</div>'
    );
    app().appendChild(top);
    top.querySelector('#btnVolverUsuarios').onclick = renderCola;

    const wrap = el('<div class="wrap"></div>');
    app().appendChild(wrap);
    const lista = el('<div class="card" id="listaUsuarios"><p style="color:var(--text-500)">Cargando…</p></div>');
    wrap.appendChild(lista);

    function cargar() {
      gas('listarUsuariosGestion', LDAP).then(pintar).catch(function (e) {
        lista.innerHTML = '<p class="error">' + escHtml(e.message) + '</p>';
      });
    }

    function pintar(usuarios) {
      const pendientes = usuarios.filter(function (u) { return !u.aprobado; });
      const activos = usuarios.filter(function (u) { return u.aprobado; });
      lista.innerHTML = '';

      lista.appendChild(el('<div class="grupo-titulo">Pendientes de aprobar (' + pendientes.length + ')</div>'));
      if (!pendientes.length) lista.appendChild(el('<p style="color:var(--text-500)">Ninguno.</p>'));
      pendientes.forEach(function (u) {
        const fila = el(
          '<div class="fila" style="cursor:default;flex-wrap:wrap;">' +
            '<div><b>' + escHtml(u.ldap) + '</b> · rol solicitado: ' + escHtml(ETIQUETA_ROL[u.rol] || u.rol) +
              '<div style="color:var(--text-500);font-size:12px;">' + escHtml([u.nombre, u.apellido].filter(Boolean).join(' ') || '(sin nombre)') + (u.seccion ? ' · ' + escHtml(u.seccion) : '') + '</div>' +
            '</div>' +
            '<div style="display:flex;gap:6px;">' +
              '<button class="btn-ghost" style="width:auto;padding:6px 10px;" data-a="ap">Aprobar</button>' +
              '<button class="btn-ghost" style="width:auto;padding:6px 10px;color:var(--danger-fg);" data-a="re">Rechazar</button>' +
            '</div>' +
          '</div>'
        );
        fila.querySelector('[data-a="ap"]').onclick = function () {
          gas('aprobarUsuarioPortal', LDAP, u.id).then(cargar).catch(function (e) { kAlerta(e.message); });
        };
        fila.querySelector('[data-a="re"]').onclick = function () {
          kConfirmar('¿Rechazar a ' + u.ldap + '? Se borra la solicitud.').then(function (ok) {
            if (!ok) return;
            gas('rechazarUsuarioPortal', LDAP, u.id).then(cargar).catch(function (e) { kAlerta(e.message); });
          });
        };
        lista.appendChild(fila);
      });

      lista.appendChild(el('<div class="grupo-titulo">Usuarios activos (' + activos.length + ')</div>'));
      if (!activos.length) lista.appendChild(el('<p style="color:var(--text-500)">Ninguno.</p>'));
      activos.forEach(function (u) {
        const fila = el(
          '<div class="fila" style="cursor:default;flex-wrap:wrap;">' +
            '<div><b>' + escHtml([u.nombre, u.apellido].filter(Boolean).join(' ') || '(sin nombre)') + '</b>' +
              '<div style="color:var(--text-500);font-size:12px;">' + escHtml(u.ldap) + (u.seccion ? ' · ' + escHtml(u.seccion) : '') + '</div>' +
            '</div>' +
            '<div style="display:flex;gap:6px;align-items:center;">' +
              '<select class="entrada" style="width:auto;margin:0;padding:6px 8px;font-size:12px;" data-a="rol">' +
                ROLES_ASIGNABLES_.map(function (r) { return '<option value="' + r + '"' + (r === u.rol ? ' selected' : '') + '>' + ETIQUETA_ROL[r] + '</option>'; }).join('') +
              '</select>' +
              '<button class="btn-ghost" style="width:auto;padding:6px 10px;color:var(--danger-fg);" data-a="rev">Revocar</button>' +
            '</div>' +
          '</div>'
        );
        fila.querySelector('[data-a="rol"]').onchange = function (e) {
          gas('cambiarRolUsuarioPortal', LDAP, u.id, e.target.value).then(cargar).catch(function (err) { kAlerta(err.message); });
        };
        fila.querySelector('[data-a="rev"]').onclick = function () {
          kConfirmar('¿Revocar acceso a ' + ([u.nombre, u.apellido].filter(Boolean).join(' ') || u.ldap) + '?').then(function (ok) {
            if (!ok) return;
            gas('revocarUsuarioPortal', LDAP, u.id).then(cargar).catch(function (e) { kAlerta(e.message); });
          });
        };
        lista.appendChild(fila);
      });
    }

    cargar();
  }

  function renderCola() {
    app().innerHTML = '';
    pintarCabecera_();
    const top = el(
      '<div class="top">' +
        '<div><b>' + escHtml(TIENDA_NOMBRE) + '</b> <span style="color:var(--text-500)">· ' + escHtml(LDAP) + ' · ' + escHtml(ETIQUETA_ROL[ROL] || ROL) + '</span></div>' +
        '<div style="display:flex;gap:6px;align-items:center;" id="topAcciones">' +
          '<button class="btn-ghost" style="width:auto;padding:6px 10px;" id="btnSalir">Salir</button>' +
        '</div>' +
      '</div>'
    );
    app().appendChild(top);
    top.querySelector('#btnSalir').onclick = salir;
    pintarSelectorTienda_(top.querySelector('#topAcciones'));
    pintarBotonUsuarios_(top.querySelector('#topAcciones'));
    pintarBotonAjustes_(top.querySelector('#topAcciones'));
    const tabs = el(renderTabsPortal_('cola'));
    app().appendChild(tabs);

    const wrap = el('<div class="wrap"></div>');
    app().appendChild(wrap);
    wrap.appendChild(el('<div id="avisoIncidencias"></div>'));
    wrap.appendChild(el('<button class="btn btn-primary" id="btnNueva">+ Nueva petición</button>'));
    cablearTabsPortal_(tabs);
    const lista = el('<div class="card" id="lista"><p style="color:var(--text-500)">Cargando…</p></div>');
    wrap.appendChild(lista);
    wrap.querySelector('#btnNueva').onclick = renderNueva;

    gas('listarMisPeticiones', LDAP).then(function (filas) {
      lista.innerHTML = '';
      if (!filas.length) { lista.appendChild(el('<p style="color:var(--text-500)">No hay peticiones todavía.</p>')); return; }
      filas.forEach(function (p) {
        const fila = el(
          '<div class="fila tipo-' + p.tipo + '">' +
            '<div><b>' + escHtml(ETIQUETA_TIPO[p.tipo] || p.tipo) + '</b>' +
              ((p.num_pedido || p.num_cesion) ? ' · ' + escHtml(p.num_pedido || p.num_cesion) : '') +
              '<div style="color:var(--text-500);font-size:12px;">' + escHtml(p.articulo || '') + '</div>' +
              (p.fecha_entrega ? '<div style="color:var(--text-500);font-size:12px;">' + escHtml(textoEntrega_(p)) + '</div>' : '') +
              '<div style="color:var(--text-500);font-size:12px;">' + escHtml(p.solicitante_ldap || '—') + ' · ' + new Date(p.creada_en).toLocaleString('es-ES') + '</div>' +
            '</div>' +
            '<span class="estado">' + escHtml(p.estadoTexto) + '</span>' +
          '</div>'
        );
        fila.onclick = function () { renderDetalle(p.id); };
        lista.appendChild(fila);
      });
    }).catch(function (e) {
      lista.innerHTML = '<p class="error">' + escHtml(e.message) + '</p>';
    });

  }

  /** Revisiones de palet, aparte de "Mis peticiones" — pestaña propia para
   *  que la tienda pueda ir siguiendo cada una hasta que plataforma la
   *  resuelve, sin que se mezclen con pedido cliente/cesión/refill. */
  function renderRevisiones() {
    app().innerHTML = '';
    pintarCabecera_();
    const top = el(
      '<div class="top">' +
        '<div><b>' + escHtml(TIENDA_NOMBRE) + '</b> <span style="color:var(--text-500)">· ' + escHtml(LDAP) + ' · ' + escHtml(ETIQUETA_ROL[ROL] || ROL) + '</span></div>' +
        '<div style="display:flex;gap:6px;align-items:center;" id="topAcciones">' +
          '<button class="btn-ghost" style="width:auto;padding:6px 10px;" id="btnSalir">Salir</button>' +
        '</div>' +
      '</div>'
    );
    app().appendChild(top);
    top.querySelector('#btnSalir').onclick = salir;
    pintarSelectorTienda_(top.querySelector('#topAcciones'));
    pintarBotonUsuarios_(top.querySelector('#topAcciones'));
    pintarBotonAjustes_(top.querySelector('#topAcciones'));
    const tabs = el(renderTabsPortal_('revisiones'));
    app().appendChild(tabs);
    cablearTabsPortal_(tabs);

    const wrap = el('<div class="wrap"></div>');
    app().appendChild(wrap);

    const ESTADOS_FILTRO_REV_ = [
      { valor: 'todas', label: 'Todas' },
      { valor: 'pendiente', label: 'Solicitadas' },
      { valor: 'en_revision', label: 'En revisión' },
      { valor: 'revisada', label: 'Resueltas' },
    ];
    var filtroEstadoRev = 'todas';
    const chips = el('<div class="filtros-tipo">' + ESTADOS_FILTRO_REV_.map(function (e) {
      return '<button type="button" class="chip-tipo' + (e.valor === 'todas' ? ' activo' : '') + '" data-estado="' + e.valor + '">' + e.label + '</button>';
    }).join('') + '</div>');
    wrap.appendChild(chips);
    const lista = el('<div class="card" id="listaRevisiones"><p style="color:var(--text-500)">Cargando…</p></div>');
    wrap.appendChild(lista);

    var todasRev = [];
    function pintarRevisiones_(filas) {
      lista.innerHTML = '';
      if (!filas.length) { lista.appendChild(el('<p style="color:var(--text-500)">No hay revisiones con ese filtro.</p>')); return; }
      filas.forEach(function (r) {
        const fila = el(
          '<div class="fila tipo-revision_palet">' +
            '<div><b>' + escHtml(etiquetaRevision_(r)) + '</b>' +
              '<div style="color:var(--text-500);font-size:12px;">' + escHtml(r.ubicacion_esperada || 'sin ubicación conocida') + ' · revisar: ' + escHtml(r.revisar.map(function (x) { return x === 'ubicacion' ? 'ubicación' : x; }).join(', ')) + '</div>' +
              '<div style="color:var(--text-500);font-size:12px;">' + escHtml(r.solicitante_ldap || '—') + ' · ' + new Date(r.creada_en).toLocaleString('es-ES') + '</div>' +
            '</div>' +
            '<span class="estado">' + escHtml(r.estadoTexto) + '</span>' +
          '</div>'
        );
        fila.onclick = function () { kAlerta(detalleRevisionHtml_(r)); };
        lista.appendChild(fila);
      });
    }
    function aplicarFiltroRev_() {
      const filas = filtroEstadoRev === 'todas' ? todasRev : todasRev.filter(function (r) { return r.estado === filtroEstadoRev; });
      pintarRevisiones_(filas);
    }
    chips.querySelectorAll('.chip-tipo').forEach(function (btn) {
      btn.onclick = function () {
        filtroEstadoRev = btn.getAttribute('data-estado');
        chips.querySelectorAll('.chip-tipo').forEach(function (b) { b.classList.toggle('activo', b === btn); });
        aplicarFiltroRev_();
      };
    });

    gas('listarMisRevisiones', LDAP).then(function (revs) {
      todasRev = revs;
      aplicarFiltroRev_();
    }).catch(function (e) {
      lista.innerHTML = '<p class="error">' + escHtml(e.message) + '</p>';
    });
  }

  /** Incidencias de preparación de la tienda (faltantes totales y parciales)
   *  con el estado y el mensaje que les da plataforma. Solo lectura. */
  function renderIncidenciasPortal() {
    app().innerHTML = '';
    pintarCabecera_();
    const top = el(
      '<div class="top">' +
        '<div><b>' + escHtml(TIENDA_NOMBRE) + '</b> <span style="color:var(--text-500)">· ' + escHtml(LDAP) + ' · ' + escHtml(ETIQUETA_ROL[ROL] || ROL) + '</span></div>' +
        '<div style="display:flex;gap:6px;align-items:center;" id="topAcciones">' +
          '<button class="btn-ghost" style="width:auto;padding:6px 10px;" id="btnSalir">Salir</button>' +
        '</div>' +
      '</div>'
    );
    app().appendChild(top);
    top.querySelector('#btnSalir').onclick = salir;
    pintarSelectorTienda_(top.querySelector('#topAcciones'));
    pintarBotonUsuarios_(top.querySelector('#topAcciones'));
    pintarBotonAjustes_(top.querySelector('#topAcciones'));
    const tabs = el(renderTabsPortal_('incidencias'));
    app().appendChild(tabs);
    cablearTabsPortal_(tabs);

    const wrap = el('<div class="wrap"></div>');
    app().appendChild(wrap);
    wrap.appendChild(el('<p style="color:var(--text-500);font-size:13px;margin:0 0 10px;">Mercancía que plataforma no ha podido preparar (sin stock, sin palet o parcial). Aquí ves en qué punto está y qué te dice plataforma.</p>'));

    const FILTROS_INC_ = [
      { valor: 'todas', label: 'Todas' },
      { valor: 'abierta', label: 'Abiertas' },
      { valor: 'en_gestion', label: 'En gestión' },
      { valor: 'resuelta', label: 'Resueltas' },
    ];
    var filtroInc = 'todas';
    const chips = el('<div class="filtros-tipo">' + FILTROS_INC_.map(function (f) {
      return '<button type="button" class="chip-tipo' + (f.valor === 'todas' ? ' activo' : '') + '" data-estado="' + f.valor + '">' + f.label + '</button>';
    }).join('') + '</div>');
    wrap.appendChild(chips);
    const lista = el('<div class="card" id="listaIncidenciasPortal"><p style="color:var(--text-500)">Cargando…</p></div>');
    wrap.appendChild(lista);

    const TEXTO_ESTADO_INC_ = { abierta: 'Abierta', en_gestion: 'En gestión', resuelta: 'Resuelta' };
    function textoTipoInc_(l) {
      if (l.estado_negocio === 'Parcial') return 'Parcial: preparado ' + l.cantidad_preparada + ' de ' + l.cantidad + ' ' + l.unidad_medida;
      if (l.estado_negocio === 'Sin Mercancía') return 'Sin mercancía — nada preparado de ' + l.cantidad + ' ' + l.unidad_medida;
      if (l.estado_negocio === 'Sin Palet') return 'Sin palet — nada preparado de ' + l.cantidad + ' ' + l.unidad_medida;
      return 'Otra incidencia — nada preparado de ' + l.cantidad + ' ' + l.unidad_medida;
    }
    var todas = [];
    function pintarInc_(filas) {
      lista.innerHTML = '';
      if (!filas.length) { lista.appendChild(el('<p style="color:var(--text-500)">No hay incidencias con ese filtro.</p>')); return; }
      filas.forEach(function (l) {
        const etiquetaTipo = l.tipo === 'pedido_cliente' ? ('Pedido cliente ' + (l.num_pedido || ''))
          : (l.tipo === 'cesion' ? 'Cesión ' + (l.num_cesion || '') : 'Refill');
        const fila = el(
          '<div class="fila tipo-' + l.tipo + '">' +
            '<div><b>' + escHtml(etiquetaTipo) + '</b>' +
              '<div style="font-size:13px;margin-top:3px;">' + escHtml(l.codigo_lm) + ' · ' + escHtml(l.designacion || '—') + '</div>' +
              '<div style="font-size:13px;font-weight:700;margin-top:3px;">' + escHtml(textoTipoInc_(l)) + '</div>' +
              (l.incidencia_motivo ? '<div style="color:var(--text-500);font-size:12px;margin-top:3px;">Motivo: ' + escHtml(l.incidencia_motivo) + '</div>' : '') +
              (l.incidencia_nota_tienda ? '<div style="font-size:13px;margin-top:5px;padding:6px 9px;border-radius:10px;background:var(--accent-dim);"><b>Plataforma:</b> ' + escHtml(l.incidencia_nota_tienda) + '</div>' : '') +
              '<div style="color:var(--text-500);font-size:12px;margin-top:4px;">' + (l.preparada_en ? new Date(l.preparada_en).toLocaleString('es-ES') : '') + '</div>' +
              ((l.puedeAnular && (ROL === 'gestor' || ROL === 'master'))
                ? '<button type="button" class="btn-ghost" data-anular style="width:auto;padding:6px 12px;margin-top:8px;color:var(--danger-fg);">Anular pedido</button>' : '') +
            '</div>' +
            '<span class="estado' + ((l.estadoIncidencia === 'abierta' && !l.pedidoAnulado) ? ' estado-anulada' : '') + '">' + (l.pedidoAnulado ? 'Pedido anulado' : TEXTO_ESTADO_INC_[l.estadoIncidencia]) + '</span>' +
          '</div>'
        );
        const btnAnular = fila.querySelector('[data-anular]');
        if (btnAnular) {
          btnAnular.onclick = function (ev) {
            ev.stopPropagation();
            kPedirTexto('Motivo de la anulación:').then(function (motivo) {
              if (motivo === null) return;
              if (!motivo.trim()) { kAlerta('Escribe el motivo.'); return; }
              kConfirmar('¿Anular este pedido? No se puede deshacer.').then(function (ok) {
                if (!ok) return;
                gas('anularPedidoPorIncidencia', LDAP, l.peticion_id, motivo.trim()).then(function () {
                  INCIDENCIAS_CACHE_ = null;
                  renderIncidenciasPortal();
                }).catch(function (e) { kAlerta(e.message); });
              });
            });
          };
        }
        fila.onclick = function () { renderDetalle(l.peticion_id, renderIncidenciasPortal); };
        lista.appendChild(fila);
      });
    }
    function aplicarFiltroInc_() {
      pintarInc_(filtroInc === 'todas' ? todas : todas.filter(function (l) { return l.estadoIncidencia === filtroInc; }));
    }
    chips.querySelectorAll('.chip-tipo').forEach(function (btn) {
      btn.onclick = function () {
        filtroInc = btn.getAttribute('data-estado');
        chips.querySelectorAll('.chip-tipo').forEach(function (b) { b.classList.toggle('activo', b === btn); });
        aplicarFiltroInc_();
      };
    });

    gas('listarMisIncidencias', LDAP).then(function (filas) {
      todas = filas;
      INCIDENCIAS_CACHE_ = filas;
      aplicarFiltroInc_();
    }).catch(function (e) {
      lista.innerHTML = '<p class="error">' + escHtml(e.message) + '</p>';
    });
  }

  function etiquetaRevision_(r) {
    if (r.sscc) return 'SSCC ' + r.sscc;
    const c = (r.contenido_esperado || [])[0] || {};
    return 'Búsqueda de palet · ' + (c.codigo_lm || '');
  }

  function detalleRevisionHtml_(r) {
    var h = '<b>' + escHtml(etiquetaRevision_(r)) + '</b><br>Ubicación esperada: ' + escHtml(r.ubicacion_esperada || 'no consta') +
      '<br>Pedida por ' + escHtml(r.solicitante_ldap) + ' · ' + new Date(r.creada_en).toLocaleString('es-ES') +
      '<br>Revisar: ' + escHtml(r.revisar.map(function (x) { return x === 'ubicacion' ? 'ubicación' : x; }).join(', ')) +
      (r.comentario ? '<br>Comentario: ' + escHtml(r.comentario) : '');
    if (!r.sscc) {
      const c = (r.contenido_esperado || [])[0] || {};
      h += '<br>Se busca: ' + escHtml(c.codigo_lm || '') + ' · ' + escHtml(c.designacion || '') + (c.cantidad ? ' (aprox. ' + c.cantidad + ' ud)' : '');
    }
    if (r.estado !== 'revisada') return h + '<br><br><b>' + escHtml(r.estadoTexto) + '</b>';
    const res = r.resultado || {};
    h += '<br><br><b>' + escHtml(r.estadoTexto) + '</b> · ' + escHtml(r.revisada_por || '') + ' · ' + new Date(r.revisada_en).toLocaleString('es-ES');
    if (res.localizado === false) return h + '<br>No se ha localizado el palet.' + (res.nota ? '<br>Nota: ' + escHtml(res.nota) : '');
    if (res.ssccEncontrado) h += '<br>SSCC encontrado: ' + escHtml(res.ssccEncontrado);
    h += '<br>Ubicación: ' + (res.ubicacionOk === false ? (r.ubicacion_esperada ? 'no estaba en su sitio — real: ' : 'localizado en: ') + escHtml(res.ubicacionReal || '—') : 'correcta');
    (res.lineas || []).forEach(function (l) {
      if (l.esperada == null) {
        h += '<br>' + escHtml(l.codigo_lm) + ' · ' + escHtml(l.designacion || '') + ': contadas ' + l.contada;
        return;
      }
      const dif = l.contada - l.esperada;
      h += '<br>' + escHtml(l.codigo_lm) + ' · ' + escHtml(l.designacion || '') + ': esperadas ' + l.esperada + ', contadas ' + l.contada +
        (dif ? ' (' + (dif > 0 ? '+' : '') + dif + ')' : '');
    });
    (res.extras || []).forEach(function (x) { h += '<br>Encontrada sin figurar: ' + escHtml(x.codigo_lm) + ' × ' + escHtml(String(x.cantidad)); });
    if (res.nota) h += '<br>Nota: ' + escHtml(res.nota);
    return h;
  }

  /** Trazabilidad = activas (algo por preparar todavía). Histórico = ya
   *  preparadas del todo, sigue actualizándose ahí (Cargado/Consolidado/
   *  Cerrada) — no vuelve a Trazabilidad, se queda como archivo permanente. */
  function renderTrazabilidad() { renderVistaTraza_(false); }
  function renderHistorico() { renderVistaTraza_(true); }

  function renderVistaTraza_(historico) {
    app().innerHTML = '';
    pintarCabecera_();
    const top = el(
      '<div class="top">' +
        '<div><b>' + escHtml(TIENDA_NOMBRE) + '</b> <span style="color:var(--text-500)">· ' + escHtml(LDAP) + ' · ' + escHtml(ETIQUETA_ROL[ROL] || ROL) + '</span></div>' +
        '<div style="display:flex;gap:6px;align-items:center;" id="topAcciones">' +
          '<button class="btn-ghost" style="width:auto;padding:6px 10px;" id="btnSalir">Salir</button>' +
        '</div>' +
      '</div>'
    );
    app().appendChild(top);
    top.querySelector('#btnSalir').onclick = salir;
    pintarSelectorTienda_(top.querySelector('#topAcciones'));
    pintarBotonUsuarios_(top.querySelector('#topAcciones'));
    pintarBotonAjustes_(top.querySelector('#topAcciones'));
    const tabs = el(renderTabsPortal_(historico ? 'historico' : 'traza'));
    app().appendChild(tabs);
    cablearTabsPortal_(tabs);

    const wrap = el('<div class="wrap' + (historico ? ' wrap-ancho' : '') + '"></div>');
    app().appendChild(wrap);
    const TIPOS_FILTRO_TRAZA = [
      { tipo: 'todas', label: 'Todas' },
      { tipo: 'pedido_cliente', label: 'Pedido cliente' },
      { tipo: 'refill', label: 'Refill' },
      { tipo: 'cesion', label: 'Cesión' },
    ];
    var filtroTipoTraza = 'todas';
    const chips = el('<div class="filtros-tipo">' + TIPOS_FILTRO_TRAZA.map(function (t) {
      return '<button type="button" class="chip-tipo' + (t.tipo === 'todas' ? ' activo' : '') + '" data-tipo="' + t.tipo + '">' + t.label + '</button>';
    }).join('') + '</div>');
    wrap.appendChild(chips);
    wrap.appendChild(el('<input class="entrada" id="inBuscarTraza" placeholder="Buscar por nº pedido, SSCC, LM, quién pidió, motivo…">'));
    const lista = el('<div class="card" id="listaTraza"><p style="color:var(--text-500)">Cargando…</p></div>');
    wrap.appendChild(lista);

    var todasTraza = [];
    const GRUPOS_TRAZA = [
      { tipo: 'refill', label: 'Refill', clase: 'tipo-refill' },
      { tipo: 'pedido_cliente', label: 'Pedido cliente', clase: 'tipo-pedido_cliente' },
      { tipo: 'cesion', label: 'Cesión', clase: 'tipo-cesion' },
    ];
    function pintarTraza(filas) {
      lista.innerHTML = '';
      if (!filas.length) { lista.appendChild(el('<p style="color:var(--text-500)">No hay peticiones.</p>')); return; }
      var huboAlguna = false;
      GRUPOS_TRAZA.forEach(function (g) {
        const deEsteGrupo = filas.filter(function (p) { return p.tipo === g.tipo; })
          .sort(function (a, b) { return new Date(a.creada_en) - new Date(b.creada_en); });
        if (!deEsteGrupo.length) return;
        huboAlguna = true;
        lista.appendChild(el('<div class="grupo-titulo">' + g.label + ' (' + deEsteGrupo.length + ')</div>'));
        deEsteGrupo.forEach(function (p) {
          var detalle;
          if (p.estado === 'anulada') detalle = 'Anulada';
          else if (p.camino === 'a_ubicar') detalle = p.aUbicarTexto || p.estadoTexto;
          else if (p.camino === 'hodos') detalle = 'HODOS: ' + p.hodosTexto;
          else detalle = 'Refill: ' + p.refillTexto;
          if (p.todoIncidencia) detalle = 'Con incidencia';
          else if (p.conIncidencia) detalle += ' · con incidencia';
          const fila = el(
            '<div class="fila ' + g.clase + '">' +
              '<div><b>' + escHtml(ETIQUETA_TIPO[p.tipo] || p.tipo) + '</b>' +
                ((p.num_pedido || p.num_cesion) ? ' · ' + escHtml(p.num_pedido || p.num_cesion) : '') +
                '<div style="color:var(--text-500);font-size:12px;">' + escHtml(p.articulo || '') + (p.motivo ? ' · ' + escHtml(p.motivo) : '') + '</div>' +
                (p.fecha_entrega ? '<div style="color:var(--text-500);font-size:12px;">' + escHtml(textoEntrega_(p)) + '</div>' : '') +
                (p.sscc && p.sscc.length ? '<div style="color:var(--text-500);font-size:12px;">SSCC ' + escHtml(p.sscc.join(' · ')) + '</div>' : '') +
                '<div style="color:var(--text-500);font-size:12px;">' + escHtml(p.solicitante_ldap || '—') + ' · ' + new Date(p.creada_en).toLocaleString('es-ES') + '</div>' +
              '</div>' +
              '<span class="estado">' + escHtml(detalle) + '</span>' +
            '</div>'
          );
          fila.onclick = function () { renderDetalle(p.id, historico ? renderHistorico : renderTrazabilidad); };
          lista.appendChild(fila);
        });
      });
      if (!huboAlguna) lista.appendChild(el('<p style="color:var(--text-500)">No hay peticiones con esos filtros.</p>'));
    }

    // Histórico: tabla (para análisis - LDAP, tipo, sección...) en vez de
    // tarjetas agrupadas. Construida entera como un solo string (nunca <tr>
    // sueltos vía innerHTML: pierden su estructura de celda).
    const COLUMNAS_HISTORICO_ = [
      { titulo: 'Fecha', ancho: 'white-space:nowrap;' },
      { titulo: 'Tipo' },
      { titulo: 'Nº' },
      { titulo: 'Destino' },
      { titulo: 'LDAP' },
      { titulo: 'Sección' },
      { titulo: 'Artículo' },
      { titulo: 'Uds', num: true },
      { titulo: 'Estado' },
      { titulo: 'Motivo' },
    ];
    function pintarHistoricoTabla_(filas) {
      lista.innerHTML = '';
      if (!filas.length) { lista.appendChild(el('<p style="color:var(--text-500)">No hay peticiones.</p>')); return; }
      const ordenadas = filas.slice().sort(function (a, b) { return new Date(b.creada_en) - new Date(a.creada_en); });
      const filasHtml = ordenadas.map(function (p, i) {
        var detalle;
        if (p.estado === 'anulada') detalle = 'Anulada';
        else if (p.camino === 'a_ubicar') detalle = p.aUbicarTexto || p.estadoTexto;
        else if (p.camino === 'hodos') detalle = p.hodosTexto;
        else detalle = p.refillTexto;
        if (p.todoIncidencia) detalle = 'Con incidencia';
        else if (p.conIncidencia) detalle += ' · con incidencia';
        const destino = p.tipo === 'cesion' ? (NOMBRE_TIENDA_DESTINO_[p.tienda_destino] || p.tienda_destino || '—') : '—';
        const motivo = p.estado === 'anulada' ? (p.motivo_anulacion || '—') : (p.motivo || '—');
        const celdas = [
          new Date(p.creada_en).toLocaleString('es-ES'),
          escHtml(ETIQUETA_TIPO[p.tipo] || p.tipo),
          escHtml(p.num_pedido || p.num_cesion || '—'),
          escHtml(destino),
          escHtml(p.solicitante_ldap || '—'),
          escHtml((p.secciones || []).join(', ') || '—'),
          escHtml(p.articulo || ''),
          String(p.totalUnidades || 0),
          '<span class="estado' + (p.estado === 'anulada' ? ' estado-anulada' : '') + '">' + escHtml(detalle || '') + '</span>',
          escHtml(motivo),
        ];
        return '<tr class="fila-historico" data-idx="' + i + '">' +
          celdas.map(function (v, c) {
            return '<td' + (COLUMNAS_HISTORICO_[c].num ? ' class="num"' : '') + ' data-label="' + COLUMNAS_HISTORICO_[c].titulo + '"' +
              ((v === '—' || v === '') ? ' data-vacio' : '') + '>' + v + '</td>';
          }).join('') +
          '</tr>';
      }).join('');
      const tablaHtml =
        '<div class="tabla-historico-envoltorio"><table class="tabla-historico">' +
        '<thead><tr>' + COLUMNAS_HISTORICO_.map(function (c) { return '<th' + (c.num ? ' class="num"' : '') + '>' + c.titulo + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + filasHtml + '</tbody></table></div>';
      const envoltorio = el(tablaHtml);
      envoltorio.querySelectorAll('.fila-historico').forEach(function (tr) {
        tr.onclick = function () { renderDetalle(ordenadas[Number(tr.getAttribute('data-idx'))].id, renderHistorico); };
      });
      lista.appendChild(envoltorio);
    }

    const pintar = historico ? pintarHistoricoTabla_ : pintarTraza;

    function aplicarFiltrosTraza_() {
      const q = wrap.querySelector('#inBuscarTraza').value.trim().toLowerCase();
      var filas = filtroTipoTraza === 'todas' ? todasTraza : todasTraza.filter(function (p) { return p.tipo === filtroTipoTraza; });
      if (q) {
        filas = filas.filter(function (p) {
          return [
            p.num_pedido, p.num_cesion, p.solicitante_ldap, p.motivo, p.articulo,
            (p.sscc || []).join(' '), ETIQUETA_TIPO[p.tipo] || p.tipo,
          ].filter(Boolean).join(' ').toLowerCase().indexOf(q) !== -1;
        });
      }
      pintar(filas);
    }

    gas('listarTrazabilidad', LDAP, historico).then(function (filas) {
      todasTraza = filas;
      aplicarFiltrosTraza_();
    }).catch(function (e) {
      lista.innerHTML = '<p class="error">' + escHtml(e.message) + '</p>';
    });

    wrap.querySelector('#inBuscarTraza').oninput = aplicarFiltrosTraza_;
    chips.querySelectorAll('.chip-tipo').forEach(function (btn) {
      btn.onclick = function () {
        filtroTipoTraza = btn.getAttribute('data-tipo');
        chips.querySelectorAll('.chip-tipo').forEach(function (b) { b.classList.toggle('activo', b === btn); });
        aplicarFiltrosTraza_();
      };
    });
  }
</script>
<script>
  function renderNueva() {
    app().innerHTML = '';
    pintarCabecera_();
    const soloRefill = ROL === 'vendedor';
    const c = el(
      '<div class="wrap"><div class="card">' +
        '<button class="btn btn-ghost" id="btnVolver">‹ Volver</button>' +
        '<h2>Nueva petición</h2>' +
        '<div id="bloqueRefill"></div>' +
        (soloRefill ? '' :
          '<button class="btn btn-primary" id="btnPC">Pedido cliente</button>' +
          '<button class="btn btn-primary" id="btnCesion">Cesión</button>' +
          '<button class="btn btn-primary" id="btnRevision">Revisión de palet</button>') +
      '</div></div>'
    );
    app().appendChild(c);
    c.querySelector('#btnVolver').onclick = renderCola;
    if (!soloRefill) {
      c.querySelector('#btnPC').onclick = function () { renderFormulario('pedido_cliente'); };
      c.querySelector('#btnCesion').onclick = function () { renderFormulario('cesion'); };
      c.querySelector('#btnRevision').onclick = renderFormularioRevision;
    }

    // Botón Refill oculto hasta confirmar que está activado — nunca se
    // pinta y luego se quita (evita parpadeo). Bloqueo real en crearPeticion.
    const bloque = c.querySelector('#bloqueRefill');
    gas('refillHabilitado').then(function (r) {
      if (!r.habilitado) {
        if (soloRefill) bloque.innerHTML = '<p class="meta" style="color:var(--warn-fg);">Refill no está disponible ahora mismo — inténtalo más tarde.</p>';
        return;
      }
      bloque.innerHTML = '<button class="btn btn-primary" id="btnRefill">Refill</button>';
      bloque.querySelector('#btnRefill').onclick = function () { renderFormulario('refill'); };
    }).catch(function () {
      // si falla la comprobación se muestra el botón — el servidor decide al enviar
      bloque.innerHTML = '<button class="btn btn-primary" id="btnRefill">Refill</button>';
      bloque.querySelector('#btnRefill').onclick = function () { renderFormulario('refill'); };
    });
  }

  /** Revisión de palet: hasta 3 palets al día por tienda, para que plataforma
   *  revise cantidad, referencias y ubicación. Se eligen igual que en Refill
   *  (por artículo o por SSCC), viendo antes qué lleva cada palet. */
  function renderFormularioRevision() {
    app().innerHTML = '';
    pintarCabecera_();
    const c = el(
      '<div class="wrap"><div class="card">' +
        '<button class="btn btn-ghost" id="btnVolver">‹ Volver</button>' +
        '<h2>Revisión de palet</h2>' +
        '<p style="color:var(--text-500);font-size:13px;" id="cupoRevision">Comprobando cuántas revisiones quedan hoy…</p>' +
        '<b>Palet a revisar o buscar</b>' +
        '<p style="color:var(--text-500);font-size:12px;margin:2px 0 6px;">No depende del stock: si el sistema no tiene el palet o el stock está a 0, puedes pedir que lo busquen.</p>' +
        '<input class="entrada" id="inBuscar" placeholder="Código LM o nombre del artículo" autocomplete="off">' +
        '<button type="button" class="btn btn-ghost" id="btnEscanear" style="width:auto;padding:6px 10px;margin:4px 6px 8px 0;">📷 Escanear código de barras</button>' +
        '<button class="btn btn-ghost" id="btnBuscarSscc" style="width:auto;padding:6px 10px;margin:4px 0 8px;">📦 Buscar por SSCC en vez de LM</button>' +
        '<div id="resultadosBusqueda"></div>' +
        '<div id="paletsElegidos"></div>' +
        '<hr style="border-color:var(--ink-800);margin:12px 0;">' +
        '<b>¿Qué quieres que revisemos?</b>' +
        '<label style="display:flex;align-items:center;gap:8px;margin:6px 0;"><input type="checkbox" id="revCantidad" checked> Cantidad</label>' +
        '<label style="display:flex;align-items:center;gap:8px;margin:6px 0;"><input type="checkbox" id="revReferencias" checked> Referencias</label>' +
        '<label style="display:flex;align-items:center;gap:8px;margin:6px 0;"><input type="checkbox" id="revUbicacion" checked> Ubicación</label>' +
        '<input class="entrada" id="inComentario" placeholder="Comentario (opcional): qué te hace dudar">' +
        '<div class="error" id="errForm" style="display:none;"></div>' +
        '<button class="btn btn-primary" id="btnEnviar">Enviar revisión</button>' +
      '</div></div>'
    );
    app().appendChild(c);
    c.querySelector('#btnVolver').onclick = renderRevisiones;

    var cupo = { usadas: 0, maximo: 3 };
    var palets = []; // { sscc, ubicacion, cantidad, contenido }

    function restantes() { return Math.max(0, cupo.maximo - cupo.usadas - palets.length); }
    function pintarCupo() {
      c.querySelector('#cupoRevision').textContent =
        'Hoy tu tienda ha pedido ' + cupo.usadas + ' de ' + cupo.maximo + ' revisiones de palet — puedes añadir ' + restantes() + ' más.';
    }
    gas('cupoRevisionesHoy', LDAP).then(function (r) { cupo = r; pintarCupo(); }).catch(function (e) {
      c.querySelector('#cupoRevision').textContent = e.message;
    });

    function textoPaletRev(p) {
      if (p.busqueda) {
        return 'Buscar palet de ' + escHtml(p.codigo_lm) + ' · ' + escHtml(p.designacion || '—') + (p.cantidad ? ' · aprox. ' + p.cantidad + ' ud' : '');
      }
      if (p.noSistema) return 'SSCC ' + escHtml(p.sscc) + ' · no figura en el sistema';
      return 'SSCC ' + escHtml(p.sscc) + ' · ' + escHtml(p.ubicacion || '—') + ' · ' + p.cantidad + ' ud';
    }

    function pintarPalets() {
      const cont = c.querySelector('#paletsElegidos');
      cont.innerHTML = '';
      palets.forEach(function (p, idx) {
        const chip = el(
          '<div class="linea-chip"><span>' + textoPaletRev(p) + '</span>' +
            '<button class="btn-ghost" style="width:auto;padding:2px 8px;" data-idx="' + idx + '">Quitar</button></div>'
        );
        chip.querySelector('button').onclick = function () { palets.splice(idx, 1); pintarPalets(); pintarCupo(); };
        cont.appendChild(chip);
      });
      pintarCupo();
    }

    function sinCupo() {
      if (restantes() > 0) return false;
      kAlerta('Hoy no quedan más revisiones de palet para tu tienda (máximo ' + cupo.maximo + ' al día).');
      return true;
    }

    /** Sin palet concreto: se pide que plataforma busque uno de ese artículo
     *  (stock 0 en el sistema, o el palet no aparece). Cantidad aproximada opcional. */
    function pedirBusqueda(articulo) {
      if (sinCupo()) return;
      kPedirTexto('¿Cuántas unidades calculas que hay de ' + escHtml(articulo.codigo_lm) + '? (opcional, déjalo vacío si no lo sabes)', { numerico: true }).then(function (texto) {
        if (texto === null) return;
        const n = Number(texto);
        palets.push({ busqueda: true, codigo_lm: articulo.codigo_lm, designacion: articulo.designacion, cantidad: n > 0 ? n : null });
        pintarPalets();
      });
    }

    /** candidatos con stock (del sistema); articulo = el buscado, para ofrecer
     *  "que busquen uno" cuando ninguno sirve. */
    function anadirPalets(candidatos, articulo) {
      const nuevos = candidatos.filter(function (n) { return !palets.some(function (p) { return p.sscc === n.sscc; }); });
      if (!nuevos.length && !articulo) { kAlerta('Ese palet ya está en la lista.'); return; }
      if (sinCupo()) return;
      elegirPaletsModal_(nuevos, {
        titulo: '¿Qué palet quieres que revisemos? (puedes marcar hasta ' + restantes() + ')',
        max: restantes(),
        botonBuscar: articulo ? 'Ninguno — que busquen un palet de ' + articulo.codigo_lm : null,
      }).then(function (sel) {
        if (sel === 'BUSCAR') { pedirBusqueda(articulo); return; }
        if (!sel || !sel.length) return;
        sel.forEach(function (s) {
          const contenido = s.contenido || [];
          const total = contenido.reduce(function (t, x) { return t + Number(x.cantidad); }, 0);
          palets.push({ sscc: s.sscc, ubicacion: s.ubicacion, cantidad: total || s.cantidad, contenido: contenido });
        });
        pintarPalets();
      });
    }

    c.querySelector('#btnBuscarSscc').onclick = function () {
      kPedirTexto('SSCC del palet:').then(function (ssccTexto) {
        const sscc = (ssccTexto || '').trim();
        if (!sscc) return;
        if (palets.some(function (p) { return p.sscc === sscc; })) { kAlerta('Ese palet ya está en la lista.'); return; }
        gas('buscarPaletParaRevision', LDAP, sscc).then(function (r) {
          if (r.encontrado) {
            anadirPalets([{
              sscc: sscc, ubicacion: r.ubicacion,
              cantidad: r.contenido.reduce(function (s, f) { return s + Number(f.cantidad); }, 0),
              contenido: r.contenido,
            }]);
            return;
          }
          if (sinCupo()) return;
          kConfirmar('El SSCC ' + escHtml(sscc) + ' no figura en el sistema. ¿Pedir igualmente que lo busquen?').then(function (ok) {
            if (!ok) return;
            palets.push({ sscc: sscc, noSistema: true, ubicacion: null, cantidad: 0, contenido: [] });
            pintarPalets();
          });
        });
      });
    };

    const inputBuscar = c.querySelector('#inBuscar');
    const resultados = c.querySelector('#resultadosBusqueda');
    var timerBuscar = null;

    function seleccionarArticuloRev(a) {
      inputBuscar.value = ''; resultados.innerHTML = '';
      gas('listarSsccDisponibles', LDAP, a.codigo_lm).then(function (candidatos) {
        if (!candidatos.length) {
          if (sinCupo()) return;
          kConfirmar('El sistema no tiene palets con stock de ' + escHtml(a.codigo_lm) + '. ¿Pedir que busquen uno?').then(function (ok) { if (ok) pedirBusqueda(a); });
          return;
        }
        anadirPalets(candidatos, a);
      });
    }

    function pintarResultadosRev(filas) {
      resultados.innerHTML = '';
      filas.forEach(function (a) {
        const fila = el(
          '<div class="articulo">' +
            (a.foto_url ? '<img src="' + escHtml(a.foto_url) + '">' : '') +
            '<div><div><b>' + escHtml(a.codigo_lm) + '</b> · ' + escHtml(a.designacion || '') + '</div>' +
            '<div style="color:var(--text-500);font-size:12px;">' + escHtml(a.seccion || '') + '</div></div>' +
          '</div>'
        );
        fila.onclick = function () { seleccionarArticuloRev(a); };
        resultados.appendChild(fila);
      });
    }

    inputBuscar.oninput = function () {
      clearTimeout(timerBuscar);
      const texto = inputBuscar.value;
      timerBuscar = setTimeout(function () {
        if (texto.trim().length < 2) { resultados.innerHTML = ''; return; }
        gas('buscarArticulos', texto).then(pintarResultadosRev);
      }, 300);
    };
    c.querySelector('#btnEscanear').onclick = function () { escanearArticulo_(this, seleccionarArticuloRev, pintarResultadosRev); };

    c.querySelector('#btnEnviar').onclick = function () {
      const err = c.querySelector('#errForm');
      err.style.display = 'none'; err.style.whiteSpace = 'pre-line';
      if (!palets.length) { err.textContent = 'Elige al menos un palet.'; err.style.display = 'block'; return; }
      const revisar = [];
      if (c.querySelector('#revCantidad').checked) revisar.push('cantidad');
      if (c.querySelector('#revReferencias').checked) revisar.push('referencias');
      if (c.querySelector('#revUbicacion').checked) revisar.push('ubicacion');
      if (!revisar.length) { err.textContent = 'Marca al menos una cosa a revisar.'; err.style.display = 'block'; return; }
      gas('crearRevisionesPalet', LDAP, palets.map(function (p) {
        return p.busqueda ? { busqueda: true, codigo_lm: p.codigo_lm, cantidad: p.cantidad } : { sscc: p.sscc };
      }), revisar, c.querySelector('#inComentario').value.trim())
        .then(function () { renderRevisiones(); })
        .catch(function (e) { err.textContent = e.message; err.style.display = 'block'; });
    };
    c.querySelector('#inComentario').onkeydown = function (e) { if (e.key === 'Enter') c.querySelector('#btnEnviar').click(); };
  }

  function renderFormulario(tipo) {
    app().innerHTML = '';
    pintarCabecera_();
    var camposTipo = '';
    const btnBuscarPedidoPyxisHtml =
      '<button type="button" class="btn btn-ghost" id="btnBuscarPedidoPyxis" style="width:100%;margin-bottom:10px;">🔎 Buscar artículos de este pedido</button>' +
      '<div id="panelPedidoPyxis" style="display:none;"></div>';
    if (tipo === 'pedido_cliente') {
      camposTipo =
        '<input class="entrada" id="inNumPedido" placeholder="Nº de pedido">' +
        btnBuscarPedidoPyxisHtml +
        '<label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">' +
          '<input type="checkbox" id="inTransporte"> Con transporte (se consolida en plataforma)' +
        '</label>';
    } else if (tipo === 'cesion') {
      // Sin buscador por pedido aquí: la cesión mueve palets completos, no
      // va ligada a un pedido cliente de Pyxis.
      camposTipo =
        '<input class="entrada" id="inNumCesion" placeholder="Nº de cesión">' +
        '<select class="entrada" id="inDestino">' +
          Object.keys(NOMBRE_TIENDA_DESTINO_).filter(function (cod) { return cod !== TIENDA; })
            .map(function (cod) { return '<option value="' + cod + '">' + NOMBRE_TIENDA_DESTINO_[cod] + '</option>'; }).join('') +
        '</select>';
    } else {
      camposTipo =
        '<input class="entrada" id="inMotivo" placeholder="Motivo del refill">' +
        '<label style="display:block;margin:8px 0 2px;color:var(--text-500);font-size:13px;" for="inFechaEntrega">Fecha de entrega (reserva, opcional)</label>' +
        '<input class="entrada" id="inFechaEntrega" type="date">' +
        '<div id="ayudaFechaEntrega" style="color:var(--text-500);font-size:12px;margin-bottom:8px;">Vacío = refill normal, se prepara hoy.</div>';
    }

    const unidadLabel = tipo === 'refill' ? 'nº de palets' : 'unidades';
    const c = el(
      '<div class="wrap"><div class="card">' +
        '<button class="btn btn-ghost" id="btnVolver">‹ Volver</button>' +
        '<h2>' + escHtml(ETIQUETA_TIPO[tipo]) + '</h2>' +
        camposTipo +
        '<hr style="border-color:var(--ink-800);margin:12px 0;">' +
        '<b>Artículos</b>' +
        '<input class="entrada" id="inBuscar" placeholder="Código LM o nombre del artículo" autocomplete="off">' +
        '<button type="button" class="btn btn-ghost" id="btnEscanear" style="width:auto;padding:6px 10px;margin:4px 6px 8px 0;">📷 Escanear código de barras</button>' +
        (tipo === 'refill' ? '<button class="btn btn-ghost" id="btnBuscarSscc" style="width:auto;padding:6px 10px;margin:4px 0 8px;">📦 Buscar por SSCC en vez de LM</button>' : '') +
        '<div id="resultadosBusqueda"></div>' +
        '<div id="lineasAnadidas"></div>' +
        '<input class="entrada" id="inComentario" placeholder="Comentario (opcional)">' +
        '<div class="error" id="errForm" style="display:none;"></div>' +
        '<button class="btn btn-primary" id="btnEnviar">Enviar petición</button>' +
      '</div></div>'
    );
    app().appendChild(c);
    c.querySelector('#btnVolver').onclick = renderCola;

    const inFechaEntrega = c.querySelector('#inFechaEntrega');
    if (inFechaEntrega) {
      inFechaEntrega.min = (function () {
        const m = new Date(); m.setDate(m.getDate() + 1);
        return m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0') + '-' + String(m.getDate()).padStart(2, '0');
      })();
      inFechaEntrega.onchange = function () {
        const ayuda = c.querySelector('#ayudaFechaEntrega');
        const f = inFechaEntrega.value;
        if (!f) { ayuda.textContent = 'Vacío = refill normal, se prepara hoy.'; return; }
        if (f <= hoyIso_()) { ayuda.textContent = 'La fecha de entrega debe ser posterior a hoy.'; return; }
        const sale = ultimoLaborableAnteriorIso_(f);
        ayuda.textContent = sale <= hoyIso_()
          ? 'Saldrá a preparación hoy.'
          : 'No la verán en almacén hasta el ' + fechaCorta_(sale) + ' (último día laborable antes de la entrega).';
      };
    }

    var lineas = []; // { codigoLm, designacion, ean, seccion, cantidad }
    var articuloElegido = null;

    function pintarLineas() {
      const cont = c.querySelector('#lineasAnadidas');
      cont.innerHTML = '';
      lineas.forEach(function (l, idx) {
        const chip = el(
          '<div class="linea-chip"><span>' + escHtml(l.codigoLm) + ' · ' + escHtml(l.designacion || '—') +
            ' · ' + l.cantidad + ' ' + unidadLabel + '</span>' +
            '<button class="btn-ghost" style="width:auto;padding:2px 8px;" data-idx="' + idx + '">Quitar</button></div>'
        );
        chip.querySelector('button').onclick = function () { lineas.splice(idx, 1); pintarLineas(); };
        cont.appendChild(chip);
      });
    }

    const btnBuscarPedidoPyxis = c.querySelector('#btnBuscarPedidoPyxis');
    if (btnBuscarPedidoPyxis) {
      btnBuscarPedidoPyxis.onclick = function () {
        const campoNum = c.querySelector('#inNumPedido'); // solo pedido_cliente tiene este botón
        const num = campoNum.value.trim();
        if (!num) { kAlerta('Escribe primero el número de pedido.'); return; }
        btnBuscarPedidoPyxis.disabled = true; btnBuscarPedidoPyxis.textContent = 'Buscando…';
        gas('buscarPedidoPyxis', LDAP, num).then(function (r) {
          btnBuscarPedidoPyxis.disabled = false; btnBuscarPedidoPyxis.textContent = '🔎 Buscar artículos de este pedido';
          pintarResultadosPedidoPyxis_(r.lineas, num);
        }).catch(function (e) {
          btnBuscarPedidoPyxis.disabled = false; btnBuscarPedidoPyxis.textContent = '🔎 Buscar artículos de este pedido';
          kAlerta(e.message);
        });
      };
      c.querySelector('#inNumPedido').onkeydown = function (e) { if (e.key === 'Enter') btnBuscarPedidoPyxis.click(); };
    }

    /** Pedido cliente bloquea añadir una línea sin stock (mismo criterio que
     *  el aviso de la búsqueda manual, más abajo); cesión solo avisa. */
    function pintarResultadosPedidoPyxis_(lineasPyxis, numBuscado) {
      const panel = c.querySelector('#panelPedidoPyxis');
      if (!lineasPyxis.length) {
        panel.style.display = 'block';
        panel.innerHTML = '<p style="color:var(--text-500);font-size:13px;">No se encontró el pedido ' + escHtml(numBuscado) + ' en Pyxis para esta tienda.</p>';
        return;
      }

      const bloquea = tipo === 'pedido_cliente';
      panel.style.display = 'block';
      panel.innerHTML = '<div class="panel-pyxis">' +
        lineasPyxis.map(function (l, i) {
          const chipClase = l.stock === 'ok' ? 'ok' : (l.stock === 'parcial' ? 'parcial' : 'sin');
          const chipTexto = l.stock === 'sin' ? '✕ Sin stock en plataforma' :
            (l.stock === 'parcial' ? '◐ ' + l.disponibleEnPlataforma + ' de ' + l.cantidad + ' uds' : '✓ ' + l.disponibleEnPlataforma + ' uds en plataforma');
          const deshabilitado = bloquea && l.stock === 'sin';
          return '<label class="linea-pyxis' + (deshabilitado ? ' deshabilitada' : '') + '">' +
            '<input type="checkbox" data-idx="' + i + '"' + (l.stock !== 'sin' ? ' checked' : '') + (deshabilitado ? ' disabled' : '') + '>' +
            '<span>' + escHtml(l.designacion) + '<br><span class="meta">Ref. ' + escHtml(l.refLm) + (l.ean ? ' · EAN ' + escHtml(l.ean) : '') + ' · ' + l.cantidad + ' uds</span>' +
            '<span class="chip-stock ' + chipClase + '">' + chipTexto + '</span></span></label>';
        }).join('') +
        '<button type="button" class="btn btn-primary" id="btnAnadirPyxis">➕ Añadir seleccionados</button>' +
        '</div>';

      panel.querySelector('#btnAnadirPyxis').onclick = function () {
        const checks = panel.querySelectorAll('input[type=checkbox]:checked');
        checks.forEach(function (chk) {
          const l = lineasPyxis[Number(chk.dataset.idx)];
          lineas.push({ codigoLm: l.refLm, designacion: l.designacion, ean: l.ean, seccion: l.seccion, cantidad: l.cantidad });
        });
        if (tipo === 'pedido_cliente') {
          const campoNum = c.querySelector('#inNumPedido');
          if (!campoNum.value.trim()) campoNum.value = numBuscado;
        }
        panel.style.display = 'none';
        panel.innerHTML = '';
        pintarLineas();
      };
    }

    const btnBuscarSscc = c.querySelector('#btnBuscarSscc');
    if (btnBuscarSscc) {
      btnBuscarSscc.onclick = function () {
        kPedirTexto('SSCC del palet:').then(function (ssccTexto) {
          const ssccBuscado = (ssccTexto || '').trim();
          if (!ssccBuscado) return;
          gas('buscarPaletPorSscc', LDAP, ssccBuscado).then(function (filas) {
            if (!filas.length) { kAlerta('No se ha encontrado ese SSCC con stock en almacén.'); return; }
            elegirLmDePaletModal_(filas).then(function (elegido) {
              if (!elegido) return;
              lineas.push({
                codigoLm: elegido.codigo_lm, designacion: elegido.designacion,
                ean: elegido.ean, seccion: elegido.seccion, cantidad: 1,
                sscc: elegido.sscc + ' (' + elegido.cantidad + 'ud)',
                ubicacion: elegido.ubicacion,
              });
              pintarLineas();
            });
          });
        });
      };
    }

    const inputBuscar = c.querySelector('#inBuscar');
    const resultados = c.querySelector('#resultadosBusqueda');
    var timerBuscar = null;

    function seleccionarArticulo(a) {
      articuloElegido = a;
      inputBuscar.value = a.codigo_lm + ' · ' + (a.designacion || '');
      resultados.innerHTML = '';
      if (tipo === 'refill') elegirPaletsRefill_(a); else pedirCantidad();
    }

    function pintarResultados(filas) {
      resultados.innerHTML = '';
      filas.forEach(function (a) {
        const fila = el(
          '<div class="articulo">' +
            (a.foto_url ? '<img src="' + escHtml(a.foto_url) + '">' : '') +
            '<div><div><b>' + escHtml(a.codigo_lm) + '</b> · ' + escHtml(a.designacion || '') + '</div>' +
            '<div style="color:var(--text-500);font-size:12px;">' + escHtml(a.seccion || '') + '</div></div>' +
          '</div>'
        );
        fila.onclick = function () { seleccionarArticulo(a); };
        resultados.appendChild(fila);
      });
    }

    c.querySelector('#btnEscanear').onclick = function () { escanearArticulo_(this, seleccionarArticulo, pintarResultados); };

    inputBuscar.oninput = function () {
      articuloElegido = null;
      clearTimeout(timerBuscar);
      const texto = inputBuscar.value;
      timerBuscar = setTimeout(function () {
        if (texto.trim().length < 2) { resultados.innerHTML = ''; return; }
        gas('buscarArticulos', texto).then(pintarResultados);
      }, 300);
    };

    /** Refill: sin preguntar cantidad — se eligen palets enteros directamente. */
    function elegirPaletsRefill_(articulo) {
      gas('verificarAntesDeAnadir', LDAP, articulo.codigo_lm, 1).then(function (chk) {
        function continuar() {
          gas('listarSsccDisponibles', LDAP, articulo.codigo_lm).then(function (candidatos) {
            if (!candidatos.length) { kAlerta('No hay palets con stock de ' + articulo.codigo_lm + ' en almacén.'); return; }
            elegirPaletsModal_(candidatos).then(function (seleccionados) {
              if (!seleccionados || !seleccionados.length) return;
              lineas.push({
                codigoLm: articulo.codigo_lm, designacion: articulo.designacion,
                ean: articulo.ean, seccion: articulo.seccion, cantidad: seleccionados.length,
                sscc: seleccionados.map(function (s) { return s.sscc + ' (' + s.cantidad + 'ud)'; }).join(' + '),
                ubicacion: seleccionados.map(function (s) { return s.ubicacion; }).join(' + '),
              });
              inputBuscar.value = ''; articuloElegido = null;
              pintarLineas();
            });
          });
        }
        if (chk.duplicados.length) {
          kAlerta('Ya hay una petición abierta (' + (ETIQUETA_TIPO[chk.duplicados[0].tipo] || chk.duplicados[0].tipo) +
            ') con este artículo — se añadirá de todas formas.').then(continuar);
        } else {
          continuar();
        }
      });
    }

    function pedirCantidad() {
      const articulo = articuloElegido;
      // Se consulta el disponible ANTES de preguntar cantidad, para mostrarlo
      // en la propia pregunta (proactivo, no solo avisar si falla después).
      gas('verificarAntesDeAnadir', LDAP, articulo.codigo_lm, 1).then(function (chk) {
        // Pedido cliente: sin stock no se puede pedir (cesión solo avisa).
        const bloqueaSinStock = tipo === 'pedido_cliente';
        const yaEnPeticion = lineas
          .filter(function (l) { return l.codigoLm === articulo.codigo_lm; })
          .reduce(function (s, l) { return s + l.cantidad; }, 0);
        const restante = chk.disponible - yaEnPeticion;
        if (bloqueaSinStock && restante <= 0) {
          kAlerta(mensajeSinStock_(articulo.codigo_lm, chk, yaEnPeticion, 0));
          return;
        }
        const mostrar = bloqueaSinStock ? restante : chk.disponible;
        kPedirTexto('¿Cuántas ' + unidadLabel + ' de ' + articulo.codigo_lm + '? (disponibles: ' + mostrar + ')', { numerico: true }).then(function (cantidadTexto) {
          const cantidad = Number(cantidadTexto);
          if (!cantidad || cantidad <= 0) return;
          if (bloqueaSinStock && cantidad > restante) {
            kAlerta(mensajeSinStock_(articulo.codigo_lm, chk, yaEnPeticion, cantidad));
            return;
          }
          // El palet lo asigna el almacén internamente al preparar (como la
          // app original) — aquí no se elige, solo unidades.
          function anadir() {
            lineas.push({
              codigoLm: articulo.codigo_lm, designacion: articulo.designacion,
              ean: articulo.ean, seccion: articulo.seccion, cantidad: cantidad,
            });
            inputBuscar.value = ''; articuloElegido = null;
            pintarLineas();
          }
          function avisarDuplicadoYSeguir() {
            if (chk.duplicados.length) {
              kAlerta('Ya hay una petición abierta (' + (ETIQUETA_TIPO[chk.duplicados[0].tipo] || chk.duplicados[0].tipo) +
                ') con este artículo — se añadirá de todas formas.').then(anadir);
            } else {
              anadir();
            }
          }
          // Cesión: sin stock suficiente NO bloquea, solo avisa (pedido cliente
          // ya salió arriba).
          if (cantidad > chk.disponible) {
            kAlerta('Solo hay ' + chk.disponible + ' ' + unidadLabel + ' disponibles de ' + articulo.codigo_lm + ' en almacén — se añadirá de todas formas.')
              .then(avisarDuplicadoYSeguir);
          } else {
            avisarDuplicadoYSeguir();
          }
        });
      });
    }

    const btnEnviar = c.querySelector('#btnEnviar');
    btnEnviar.onclick = function () {
      const err = c.querySelector('#errForm');
      err.style.display = 'none';
      if (!lineas.length) { err.textContent = 'Añade al menos un artículo.'; err.style.display = 'block'; return; }
      var datos = { comentario: c.querySelector('#inComentario').value.trim() || null };
      if (tipo === 'pedido_cliente') {
        datos.numPedido = c.querySelector('#inNumPedido').value.trim();
        datos.transporte = c.querySelector('#inTransporte').checked;
        if (!datos.numPedido) { err.textContent = 'Falta el número de pedido.'; err.style.display = 'block'; return; }
      } else if (tipo === 'cesion') {
        datos.tiendaDestino = c.querySelector('#inDestino').value;
        datos.numCesion = c.querySelector('#inNumCesion').value.trim();
        if (!datos.numCesion) { err.textContent = 'Falta el número de cesión.'; err.style.display = 'block'; return; }
      } else {
        datos.motivo = c.querySelector('#inMotivo').value.trim();
        if (!datos.motivo) { err.textContent = 'Falta el motivo.'; err.style.display = 'block'; return; }
        datos.fechaEntrega = c.querySelector('#inFechaEntrega').value || null;
      }
      // Evita doble envío por doble clic/toque (bug real 2026-09-28: mismo
      // pedido creado dos veces) — el guardado real en el servidor bloquea
      // igual si esto fallara, pero así ni se intenta.
      btnEnviar.disabled = true; btnEnviar.textContent = 'Enviando…';
      gas('crearPeticion', LDAP, tipo, datos, lineas).then(function () {
        renderCola();
      }).catch(function (e) {
        btnEnviar.disabled = false; btnEnviar.textContent = 'Enviar petición';
        err.style.whiteSpace = 'pre-line';
        err.textContent = e.message; err.style.display = 'block';
      });
    };
    c.querySelector('#inComentario').onkeydown = function (e) { if (e.key === 'Enter') btnEnviar.click(); };
  }
</script>
<script>
  function renderDetalle(id, origen) {
    origen = origen || renderCola;
    app().innerHTML = '';
    pintarCabecera_();
    const c = el(
      '<div class="wrap"><div class="card" id="detalle">' +
        '<button class="btn btn-ghost" id="btnVolver">‹ Volver</button>' +
        '<p style="color:var(--text-500)">Cargando…</p>' +
      '</div></div>'
    );
    app().appendChild(c);
    c.querySelector('#btnVolver').onclick = origen;

    gas('obtenerDetallePeticion', LDAP, id).then(function (r) {
      const p = r.peticion;
      var camposTipo = '';
      if (p.tipo === 'pedido_cliente') {
        camposTipo = '<div><b>Nº pedido</b> ' + escHtml(p.num_pedido) + '</div>' +
          '<div><b>Transporte</b> ' + (p.transporte ? 'Sí (consolida en plataforma)' : 'No') + '</div>';
      } else if (p.tipo === 'cesion') {
        camposTipo = '<div><b>Nº cesión</b> ' + escHtml(p.num_cesion) + '</div>' +
          '<div><b>Destino</b> ' + escHtml(NOMBRE_TIENDA_DESTINO_[p.tienda_destino] || p.tienda_destino) + '</div>';
      }
      const filasLineas = r.lineas.map(function (l) {
        const esParcial = l.estado_negocio === 'Parcial';
        const esFaltante = ['Sin Palet', 'Sin Mercancía', 'Otras Incidencias'].indexOf(l.estado_negocio) !== -1;
        const estadoTexto = esParcial ? ('Parcial: ' + l.cantidad_preparada + '/' + l.cantidad) : (esFaltante ? l.estado_negocio : l.estado_preparacion);
        const avisoIncidencia = ((esParcial || esFaltante) && (l.incidencia_motivo || l.incidencia_nota_tienda))
          ? '<div style="color:var(--text-500);font-size:12px;margin:-2px 0 8px;">' +
            (l.incidencia_motivo ? 'Motivo: ' + escHtml(l.incidencia_motivo) : '') +
            (l.incidencia_motivo && l.incidencia_nota_tienda ? ' · ' : '') +
            (l.incidencia_nota_tienda ? 'Plataforma: ' + escHtml(l.incidencia_nota_tienda) : '') + '</div>'
          : '';
        return '<div class="linea-chip"><span>' + escHtml(l.codigo_lm) + ' · ' + escHtml(l.designacion || '—') +
          ' · ' + l.cantidad + ' ' + escHtml(l.unidad_medida) +
          (l.sscc ? ' · SSCC ' + escHtml(l.sscc) : '') +
          '</span>' +
          '<span class="estado' + ((esParcial || esFaltante) ? ' estado-anulada' : '') + '">' + escHtml(estadoTexto) + '</span></div>' + avisoIncidencia;
      }).join('');
      const etiquetaEstadoEnvio = (p.tipo === 'pedido_cliente' && p.transporte) ? 'Envío' : 'HODOS';
      const hodosLinea = r.hodosTexto ? '<div style="margin-top:8px;"><b>' + etiquetaEstadoEnvio + '</b> ' + escHtml(r.hodosTexto) + '</div>' : '';
      const puedeAnular = (ROL === 'gestor' || ROL === 'master') && p.estado !== 'cerrada' && p.estado !== 'anulada';
      const puedeCambiarFecha = (ROL === 'gestor' || ROL === 'master') && p.reservaFutura && p.estado === 'pendiente';

      const cont = app().querySelector('#detalle');
      cont.innerHTML =
        '<button class="btn btn-ghost" id="btnVolver2">‹ Volver</button>' +
        '<h2>' + escHtml(ETIQUETA_TIPO[p.tipo]) + '</h2>' +
        '<span class="estado">' + escHtml(p.estadoTexto) + '</span>' +
        '<div style="margin-top:8px;color:var(--text-500);">Pedido por ' + escHtml(p.solicitante_ldap || '—') + ' · ' + new Date(p.creada_en).toLocaleString('es-ES') + '</div>' +
        '<div style="margin-top:8px;">' + camposTipo + '</div>' +
        (p.motivo ? '<div style="margin-top:8px;"><b>Motivo</b> ' + escHtml(p.motivo) + '</div>' : '') +
        (p.fecha_entrega ? '<div style="margin-top:8px;"><b>Entrega</b> ' + escHtml(fechaCorta_(p.fecha_entrega)) + (p.reservaFutura ? ' · sale a preparación ' + escHtml(fechaCorta_(p.visible_desde)) : '') + '</div>' : '') +
        (puedeCambiarFecha
          ? '<div style="margin-top:8px;"><label style="display:block;color:var(--text-500);font-size:13px;" for="inNuevaFecha">Cambiar fecha de entrega</label>' +
            '<input class="entrada" id="inNuevaFecha" type="date" value="' + escHtml(p.fecha_entrega) + '">' +
            '<button class="btn btn-ghost" id="btnCambiarFecha">Guardar nueva fecha</button></div>'
          : '') +
        (p.motivo_anulacion ? '<div style="margin-top:8px;"><b>Motivo de anulación</b> ' + escHtml(p.motivo_anulacion) + '</div>' : '') +
        hodosLinea +
        (p.comentario ? '<div style="margin-top:8px;"><b>Comentario</b> ' + escHtml(p.comentario) + '</div>' : '') +
        (puedeAnular ? '<button class="btn btn-danger" id="btnAnular" style="margin-top:10px;">Anular petición</button>' : '') +
        '<hr style="border-color:var(--ink-800);margin:12px 0;">' +
        filasLineas;
      cont.querySelector('#btnVolver2').onclick = origen;
      if (puedeCambiarFecha) {
        const btnCambiarFecha = cont.querySelector('#btnCambiarFecha');
        btnCambiarFecha.onclick = function () {
          const nueva = cont.querySelector('#inNuevaFecha').value;
          if (!nueva) { kAlerta('Elige la nueva fecha.'); return; }
          btnCambiarFecha.disabled = true;
          gas('cambiarFechaEntrega', LDAP, id, nueva).then(function () { renderDetalle(id, origen); })
            .catch(function (e) { btnCambiarFecha.disabled = false; kAlerta(e.message); });
        };
        cont.querySelector('#inNuevaFecha').onkeydown = function (e) { if (e.key === 'Enter') btnCambiarFecha.click(); };
      }
      if (puedeAnular) {
        cont.querySelector('#btnAnular').onclick = function () {
          kPedirTexto('Motivo de la anulación:').then(function (motivo) {
            if (motivo === null) return;
            if (!motivo.trim()) { kAlerta('Escribe el motivo.'); return; }
            kConfirmar('¿Anular esta petición? No se puede deshacer.').then(function (ok) {
              if (!ok) return;
              gas('anularPeticion', LDAP, id, motivo.trim()).then(function () { renderDetalle(id, origen); })
                .catch(function (e) { kAlerta(e.message); });
            });
          });
        };
      }
    }).catch(function (e) {
      app().querySelector('#detalle').innerHTML = '<p class="error">' + escHtml(e.message) + '</p>';
    });
  }
</script>
<script>
  if (String(<?= esAdmin ?>) === 'true') {
    render = renderAdminLogin; // sustituye el router normal en esta pestaña
  }

  function renderAdminLogin() {
    app().innerHTML = '';
    pintarCabecera_();
    const c = el(
      '<div class="wrap"><div class="card">' +
        '<h2>Kairos · Admin</h2>' +
        '<input class="entrada" id="inPass" type="password" placeholder="Contraseña de administrador">' +
        '<div class="error" id="errAdmin" style="display:none;"></div>' +
        '<button class="btn btn-primary" id="btnAdminEntrar">Entrar</button>' +
      '</div></div>'
    );
    app().appendChild(c);
    c.querySelector('#btnAdminEntrar').onclick = function () {
      const pass = c.querySelector('#inPass').value;
      renderAdmin(pass);
    };
    c.querySelector('#inPass').onkeydown = function (e) { if (e.key === 'Enter') c.querySelector('#btnAdminEntrar').click(); };
  }

  function renderAdmin(passwordAdmin) {
    app().innerHTML = '';
    pintarCabecera_();
    const c = el(
      '<div class="wrap"><div class="card">' +
        '<h2>Pendientes de aprobar</h2>' +
        '<div id="listaAdmin"><p style="color:var(--text-500)">Cargando…</p></div>' +
      '</div></div>'
    );
    app().appendChild(c);
    const lista = c.querySelector('#listaAdmin');

    function cargar() {
      gas('listarPendientesAprobacion', passwordAdmin).then(function (filas) {
        lista.innerHTML = '';
        if (!filas.length) { lista.appendChild(el('<p style="color:var(--text-500)">No hay nadie pendiente.</p>')); return; }
        filas.forEach(function (u) {
          const fila = el(
            '<div class="fila" style="cursor:default;">' +
              '<div><b>' + escHtml(u.ldap) + '</b> · ' + escHtml(u.tiendaNombre) + ' · ' + escHtml(ETIQUETA_ROL[u.rol] || u.rol) + '</div>' +
              '<div>' +
                '<button class="btn-ghost" style="width:auto;padding:6px 10px;" data-a="ap">Aprobar</button> ' +
                '<button class="btn-ghost" style="width:auto;padding:6px 10px;color:var(--danger-fg);" data-a="re">Rechazar</button>' +
              '</div>' +
            '</div>'
          );
          fila.querySelector('[data-a="ap"]').onclick = function () {
            gas('aprobarUsuario', passwordAdmin, u.id).then(cargar);
          };
          fila.querySelector('[data-a="re"]').onclick = function () {
            kConfirmar('¿Rechazar a ' + u.ldap + '?').then(function (ok) {
              if (!ok) return;
              gas('rechazarUsuario', passwordAdmin, u.id).then(cargar);
            });
          };
          lista.appendChild(fila);
        });
      }).catch(function (e) {
        lista.innerHTML = '<p class="error">' + escHtml(e.message) + '</p>';
      });
    }
    cargar();
  }
</script>
