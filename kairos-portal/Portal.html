<title>Kairos · Portal de tienda</title>
<script>
  (function () {
    var m = 'light', t = 'lmgreen';
    try {
      m = localStorage.getItem('kairos_mode_pick') || 'light';
      t = localStorage.getItem('kairos_theme_pick') || 'lmgreen';
    } catch (e) {}
    document.documentElement.setAttribute('data-kmode', m);
    document.documentElement.setAttribute('data-ktheme', t);
  })();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Permanent+Marker&display=swap">
<style>
  :root {
    --ink-950:#090d13; --ink-900:#0f151e; --ink-850:#141b26; --ink-800:#1a2230;
    --ink-700:#28323f; --ink-600:#3a4757;
    --text-100:#eef2f7; --text-300:#c3ccd8; --text-500:#8b97a8; --text-600:#66707e;
    --ok:#34d17a; --ok-ink:#062b12;
    --warn-bg:#4a2c0b; --warn-fg:#ffcd8a; --warn-line:#7a4a15;
    --danger-bg:#3a1414; --danger-fg:#ffb0ab; --danger-line:#7a2a24;
    --radius-card:14px; --radius-btn:10px; --radius-chip:999px;
    --shadow-card:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.6);
    --tipo-refill:#3fb54a; --tipo-refill-bg:#123420; --tipo-refill-fg:#8fe0a4;
    --tipo-pedido:#4c7dff; --tipo-pedido-bg:#12213f; --tipo-pedido-fg:#8fb2ff;
    --tipo-cesion:#a855f7; --tipo-cesion-bg:#26123b; --tipo-cesion-fg:#d6a6ff;
  }
  [data-kmode="light"] {
    --ink-950:#f6f4f1; --ink-900:#ffffff; --ink-850:#fbfaf8; --ink-800:#e8e4de;
    --ink-700:#d7d2ca; --ink-600:#b6afa4;
    --text-100:#201f1c; --text-300:#4a473f; --text-500:#7a7568; --text-600:#96917f;
    --ok:#1a8f4c; --ok-ink:#eafff2;
    --warn-bg:#fff1d6; --warn-fg:#92400e; --warn-line:#f0c878;
    --danger-bg:#fde7e5; --danger-fg:#b91c1c; --danger-line:#f4b3ac;
    --shadow-card:0 1px 2px rgba(30,25,15,.04), 0 10px 24px -14px rgba(30,25,15,.18);
    --tipo-refill:#2f9e3f; --tipo-refill-bg:#e4f5e7; --tipo-refill-fg:#1a7a2c;
    --tipo-pedido:#1d4ed8; --tipo-pedido-bg:#e5edff; --tipo-pedido-fg:#1d4ed8;
    --tipo-cesion:#7e22ce; --tipo-cesion-bg:#f2e6ff; --tipo-cesion-fg:#7e22ce;
  }
  [data-ktheme="indigo"]   { --accent:#4c7dff; --accent-ink:#ffffff; --accent-dim:#1c2b52; --accent-line:#3a55a8; }
  [data-ktheme="lmgreen"]  { --accent:#3fb54a; --accent-ink:#04220a; --accent-dim:#123420; --accent-line:#2f7a3c; }
  [data-ktheme="taisared"] { --accent:#e2263a; --accent-ink:#ffffff; --accent-dim:#3a1216; --accent-line:#8a2530; }
  [data-ktheme="amber"]    { --accent:#f0a020; --accent-ink:#241400; --accent-dim:#3a2708; --accent-line:#93672a; }
  [data-kmode="light"][data-ktheme="lmgreen"]  { --accent:#2f9e3f; --accent-ink:#ffffff; --accent-dim:#e4f5e7; --accent-line:#a9dab4; }
  [data-kmode="light"][data-ktheme="taisared"] { --accent:#dc1a23; --accent-ink:#ffffff; --accent-dim:#fde6e6; --accent-line:#f0aaac; }
  [data-ktheme="retro80s"]                     { --accent:#FF1493; --accent-ink:#ffffff; --accent-dim:#3a0f28; --accent-line:#a80f5c; }
  [data-kmode="light"][data-ktheme="retro80s"] { --accent:#d6127a; --accent-ink:#ffffff; --accent-dim:#ffe0f0; --accent-line:#ffb3d9; }

  /* ——— Retro 80s Color-Block: tema opcional (rompevientos deportivo años 80-90),
     bandas diagonales de color sólido con paradas duras (NO degradados suaves).
     Solo decora cabecera/marca/botones/acentos — nunca texto de cuerpo ni tablas. ——— */
  [data-ktheme="retro80s"] .brand-head { position:relative; padding-top:16px; }
  [data-ktheme="retro80s"] .brand-head::before {
    content:""; position:absolute; top:0; left:0; right:0; height:6px; border-radius:3px;
    background:linear-gradient(135deg,
      #FF1493 0%, #FF1493 20%, #00C5B5 20%, #00C5B5 40%, #3B2F85 40%, #3B2F85 60%,
      #FFD700 60%, #FFD700 80%, #FF2400 80%, #FF2400 100%);
  }
  [data-ktheme="retro80s"] .brand-nombre {
    background:linear-gradient(135deg,
      #FF1493 0%, #FF1493 25%, #00C5B5 25%, #00C5B5 50%, #3B2F85 50%, #3B2F85 75%, #FFD700 75%, #FFD700 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  [data-ktheme="retro80s"] .btn-primary {
    background:linear-gradient(135deg,
      #FF1493 0%, #FF1493 20%, #00C5B5 20%, #00C5B5 40%, #3B2F85 40%, #3B2F85 60%,
      #FFD700 60%, #FFD700 80%, #FF2400 80%, #FF2400 100%);
    color:#fff;
  }

  * { box-sizing:border-box; }
  html, body { background:var(--ink-950); }
  body {
    background-image:
      radial-gradient(900px 620px at -10% -15%, var(--accent) 0%, transparent 55%),
      radial-gradient(800px 700px at 115% 10%, var(--accent-line) 0%, transparent 50%),
      linear-gradient(160deg, var(--ink-950) 0%, var(--ink-900) 55%, var(--ink-950) 100%);
    background-size: auto, auto, 100% 100%;
    background-position: 0 0, 0 0, 0 0;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  [data-kmode="light"] body {
    background-image:
      radial-gradient(900px 620px at -10% -15%, var(--accent) 0%, transparent 50%),
      radial-gradient(800px 700px at 115% 10%, var(--accent-line) 0%, transparent 42%),
      linear-gradient(160deg, var(--ink-950) 0%, var(--ink-800) 55%, var(--ink-950) 100%);
  }
  body { margin:0; color:var(--text-100); font-family:'Inter',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; transition:background .15s ease,color .15s ease; }
  h2 { font-size:18px; font-weight:800; margin:0 0 10px; letter-spacing:-.01em; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .wrap-ancho { max-width:1600px; }
  .tabla-historico-envoltorio { overflow-x:auto; border:1px solid var(--ink-800); border-radius:var(--radius-card); }
  table.tabla-historico { width:100%; border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums; }
  .tabla-historico thead th { position:sticky; top:0; text-align:left; color:var(--text-500); background:var(--ink-900); border-bottom:1px solid var(--ink-800); padding:9px 10px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; }
  .tabla-historico thead th.num { text-align:right; }
  .tabla-historico td { padding:8px 10px; border-bottom:1px solid var(--ink-800); color:var(--text-300); vertical-align:top; }
  .tabla-historico td.num { text-align:right; font-weight:700; color:var(--text-100); }
  .tabla-historico tbody tr:nth-child(even) { background:var(--ink-900); }
  .tabla-historico tbody tr.fila-historico { cursor:pointer; transition:background .1s ease; }
  .tabla-historico tbody tr.fila-historico:hover { background:var(--accent-dim); }
  .tabla-historico tbody tr:last-child td { border-bottom:none; }
  .estado-anulada { background:var(--danger-bg); color:var(--danger-fg); }
  .top { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--ink-800); }
  .card {
    background: linear-gradient(160deg, var(--ink-850) 0%, var(--ink-900) 100%);
    border:1px solid var(--ink-800); border-top:1px solid rgba(255,255,255,.07);
    border-radius:18px; padding:18px; margin-bottom:14px;
    box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 14px 34px -16px rgba(0,0,0,.65);
  }
  .btn {
    width:100%; padding:14px; min-height:52px; border-radius:14px; border:none;
    font-weight:800; font-size:15px; letter-spacing:.01em; cursor:pointer; margin-top:8px;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 70%, #000) 100%);
    color: var(--accent-ink);
    box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--accent) 70%, transparent), 0 1px 0 rgba(255,255,255,.25) inset;
  }
  .btn-primary:active { filter: brightness(.94); }
  .tabs {
    display:flex; background: linear-gradient(160deg, var(--ink-850), var(--ink-900));
    border:1px solid var(--ink-800); border-radius:22px; padding:6px; margin:0 16px 14px; gap:4px;
    box-shadow: 0 10px 26px -14px rgba(0,0,0,.6);
  }
  .tabs a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:10px 2px; border-radius:16px; text-decoration:none; color:var(--text-500); font-size:12px; font-weight:700; min-height:56px; transition: background .15s ease, color .15s ease; }
  .tabs a svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .tabs a { position:relative; }
  .tabs a span { text-align:center; line-height:1.1; }
  .badge-tab { position:absolute; top:3px; left:calc(50% + 6px); min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:#dc1a23; color:#fff; font-size:11px; font-weight:800; line-height:18px; text-align:center; }
  .tabs a.activa {
    background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 65%, #000) 100%);
    color: var(--accent-ink);
    box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .btn-primary { background:var(--accent); color:var(--accent-ink); }
  .btn-ghost { background:var(--ink-800); color:var(--text-300); border:1px solid var(--ink-700); }
  .btn-danger { background:var(--danger-bg); color:var(--danger-fg); border:1px solid var(--danger-line); }
  .entrada { width:100%; padding:10px 11px; border-radius:var(--radius-btn); border:1px solid var(--ink-700); background:var(--ink-900); color:var(--text-100); margin-bottom:8px; font-size:14px; }
  .fila {
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background: linear-gradient(160deg, var(--ink-850) 0%, var(--ink-900) 100%);
    border:1px solid var(--ink-800); border-top:1px solid rgba(255,255,255,.06);
    border-left:4px solid var(--ink-700);
    border-radius:14px; padding:12px 14px; margin-bottom:10px; cursor:pointer;
    box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 10px 24px -14px rgba(0,0,0,.55);
    transition: transform .12s ease;
  }
  .fila:active { transform: scale(.98); }
  .fila:last-child { margin-bottom:0; }
  .fila.tipo-refill { border-left-color: var(--tipo-refill); }
  .fila.tipo-pedido_cliente { border-left-color: var(--tipo-pedido); }
  .fila.tipo-cesion { border-left-color: var(--tipo-cesion); }
  .fila.tipo-revision_palet { border-left-color: var(--accent); }
  .estado { font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--ink-800); color:var(--text-500); white-space:nowrap; }
  .fila.tipo-refill .estado { background: var(--tipo-refill-bg); color: var(--tipo-refill-fg); }
  .fila.tipo-pedido_cliente .estado { background: var(--tipo-pedido-bg); color: var(--tipo-pedido-fg); }
  .fila.tipo-cesion .estado { background: var(--tipo-cesion-bg); color: var(--tipo-cesion-fg); }
  .grupo-titulo { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--text-500); margin:18px 0 8px; }
  .grupo-titulo:first-child { margin-top:0; }
  .error { color:var(--danger-fg); font-size:13px; margin-top:6px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .articulo { display:flex; gap:8px; align-items:center; padding:6px; border-radius:8px; cursor:pointer; }
  .articulo:hover { background:var(--ink-800); }
  .articulo img { width:36px; height:36px; object-fit:cover; border-radius:4px; background:#000; }
  .linea-chip { display:flex; justify-content:space-between; background:var(--ink-800); border-radius:8px; padding:8px; margin-top:6px; font-size:13px; color:var(--text-300); }

  .panel-pyxis { margin-top:10px; border:1px solid var(--ink-800); border-radius:var(--radius-card); padding:10px; }
  .linea-pyxis { display:flex; gap:10px; align-items:flex-start; padding:8px 2px; border-bottom:1px solid var(--ink-800); cursor:pointer; }
  .linea-pyxis:last-of-type { border-bottom:none; }
  .linea-pyxis.deshabilitada { opacity:.5; cursor:default; }
  .linea-pyxis .meta { font-size:11.5px; color:var(--text-500); }
  .chip-stock { display:inline-block; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:999px; margin-top:4px; }
  .chip-stock.ok { background:var(--ok-ink); color:var(--ok); }
  .chip-stock.parcial { background:var(--warn-bg); color:var(--warn-fg); }
  .chip-stock.sin { background:var(--danger-bg); color:var(--danger-fg); }

  .brand-head { display:flex; align-items:center; gap:10px; padding:10px 16px 0; }
  .brand-badge { background:#fff; border-radius:10px; padding:6px 10px; display:flex; align-items:center; box-shadow:0 2px 8px -3px rgba(0,0,0,.4); }
  .brand-badge img { display:block; height:30px; width:auto; }
  .brand-x { color:var(--text-600); font-size:14px; font-weight:600; }
  .brand-nombre {
    font-family:'Permanent Marker', cursive; font-size:38px; color:var(--accent); line-height:1; letter-spacing:.015em;
    -webkit-text-stroke:1px var(--ink-950); text-stroke:1px var(--ink-950);
    text-shadow:0 2px 0 rgba(0,0,0,.35), 0 6px 14px color-mix(in srgb, var(--accent) 55%, transparent);
  }
  [data-kmode="light"] .brand-nombre { -webkit-text-stroke:1px var(--ink-900); text-stroke:1px var(--ink-900); text-shadow:0 2px 0 rgba(0,0,0,.15), 0 6px 14px color-mix(in srgb, var(--accent) 45%, transparent); }
  .theme-toggle { margin-left:auto; }
  button.theme-btn { width:auto; background:var(--ink-800); color:var(--text-300); padding:7px 10px; font-size:12px; margin:0; border:1px solid var(--ink-700); border-radius:var(--radius-btn); cursor:pointer; font-weight:700; display:flex; align-items:center; gap:5px; }
  .theme-btn svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  .koverlay { position:fixed; inset:0; background:rgba(5,7,10,.6); display:flex; align-items:center; justify-content:center; padding:20px; z-index:1000; }
  .kmodal { background:var(--ink-900); border:1px solid var(--ink-800); border-radius:var(--radius-card); padding:18px; max-width:360px; width:100%; max-height:85vh; overflow-y:auto; box-shadow:var(--shadow-card); }
  .kmodal-ancho { max-width:min(960px, 95vw); }
  .paletes-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:14px; margin:10px 0; align-items:start; }
  .palet-card { min-width:0; }
  .kmodal p { margin:0 0 14px; font-size:14.5px; line-height:1.45; color:var(--text-100); }
  .kmodal input.entrada { margin-bottom:0; }
  .kmodal .fila-botones { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .kmodal .fila-botones .btn { width:auto; min-width:84px; margin-top:0; }
  .theme-panel { background:var(--ink-900); border:1px solid var(--ink-800); border-radius:var(--radius-card); padding:12px; margin:10px 16px 0; display:none; }
  .theme-panel.abierto { display:block; }
  .picker-row { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .picker-row:last-child { margin-bottom:0; }
  .picker-label { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-600); width:52px; flex:none; }
  .pick { display:flex; align-items:center; gap:7px; padding:7px 11px 7px 8px; border-radius:var(--radius-chip); background:var(--ink-800); border:1px solid var(--ink-700); color:var(--text-300); font-size:12.5px; font-weight:600; cursor:pointer; }
  .pick .dot { width:13px; height:13px; border-radius:50%; flex:none; }
  .pick[data-for="indigo"] .dot { background:#4c7dff; }
  .pick[data-for="lmgreen"] .dot { background:#3fb54a; }
  .pick[data-for="taisared"] .dot { background:#e2263a; }
  .pick[data-for="amber"] .dot { background:#f0a020; }
  .pick[data-for="retro80s"] .dot { background:linear-gradient(135deg,
    #FF1493 0%, #FF1493 20%, #00C5B5 20%, #00C5B5 40%, #3B2F85 40%, #3B2F85 60%,
    #FFD700 60%, #FFD700 80%, #FF2400 80%, #FF2400 100%); }
  .pick.active { background:var(--accent-dim); border-color:var(--accent-line); color:var(--accent-ink); }
  [data-kmode="light"] .pick.active { color:var(--accent); }
  .pick[data-hidden] { display:none; }
  .filtros-tipo { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .chip-tipo { padding:7px 14px; border-radius:var(--radius-chip); background:var(--ink-800); border:1px solid var(--ink-700); color:var(--text-300); font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .chip-tipo.activo { background:var(--accent-dim); border-color:var(--accent-line); color:var(--accent-ink); }
  [data-kmode="light"] .chip-tipo.activo { color:var(--accent); }

  /* ——— Adaptación a móvil (mismo patrón que Centinela): cabecera compacta,
     navegación abajo con zona segura, tarjetas que no se aplastan y nada que
     desborde en horizontal (si algo desborda, el móvil encoge toda la página). ——— */
  :root { --accent-text: color-mix(in srgb, var(--accent) 65%, white 35%); }
  [data-kmode="light"] { --accent-text: var(--accent); }
  html { -webkit-text-size-adjust:100%; }
  img, svg { max-width:100%; }
  .brand-head { flex-wrap:wrap; }
  .fila > div:first-child { min-width:0; overflow-wrap:anywhere; }
  .linea-chip { gap:10px; align-items:center; overflow-wrap:anywhere; }
  .linea-chip > span:first-child { min-width:0; }
  .kmodal { max-height:min(85vh, 85dvh); }
  .theme-btn-txt { display:inline; }
  .wrap > .btn + .card { margin-top:14px; }

  /* El "pointer:coarse and hover:none" se suma al ancho porque, dentro del
     iframe de Apps Script, el ancho CSS que ve la página a veces no coincide
     con el ancho real del móvil (confirmado: en real las pestañas salían en
     formato escritorio en un teléfono). El tipo de puntero sí es fiable. */
  @media (max-width: 768px), (pointer: coarse) and (hover: none) {
    body { background-attachment:scroll; }
    body:has(.tabs) { padding-bottom:calc(88px + env(safe-area-inset-bottom)); }

    h2 { font-size:21px; }

    .brand-head { gap:8px; padding:10px max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); }
    .brand-badge { padding:5px 8px; border-radius:9px; }
    .brand-badge img { height:24px; }
    .brand-x { font-size:12px; }
    .brand-nombre { font-size:28px; }
    button.theme-btn { min-height:40px; padding:8px 12px; font-size:13px; }
    .theme-panel { margin:10px 12px 0; }

    .top { flex-wrap:wrap; gap:8px 12px; padding:12px max(12px, env(safe-area-inset-right)) 12px max(12px, env(safe-area-inset-left)); }
    .top > div:first-child { flex:1 1 180px; min-width:0; font-size:15px; overflow-wrap:anywhere; }
    .top .btn-ghost, .top select.entrada { min-height:42px; font-size:14px; }

    /* max-width:none: dentro del iframe de Apps Script el ancho CSS a veces
       llega inflado (visto en real ~980px en vez del ancho del móvil), y con
       el límite de 720px puesto quedaba media pantalla vacía a cada lado. */
    .wrap { max-width:none; padding:12px max(10px, env(safe-area-inset-right)) 12px max(10px, env(safe-area-inset-left)); }
    .card { padding:18px 16px; border-radius:18px; }

    /* Navegación abajo, al alcance del pulgar, con la barra de gestos del móvil respetada */
    .tabs { position:fixed; left:0; right:0; bottom:0; margin:0; border:0; border-top:1px solid var(--ink-800); border-radius:0;
      padding:6px max(6px, env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-right));
      background:var(--ink-900); box-shadow:0 -8px 24px -12px rgba(0,0,0,.5); z-index:900; }
    .tabs a { min-height:56px; font-size:12px; border-radius:12px; }
    .tabs a svg { width:24px; height:24px; }
    .tabs a.activa { background:var(--accent-dim); color:var(--accent-text); box-shadow:none; }

    /* Botones grandes de verdad y con más peso visual: la pantalla es lo único que se toca */
    .btn { font-size:18px; min-height:76px; padding:20px; border-radius:18px; margin-top:12px; }
    .btn-primary { box-shadow: 0 16px 34px -12px color-mix(in srgb, var(--accent) 75%, transparent), 0 1px 0 rgba(255,255,255,.28) inset; }
    .btn-ghost { border-width:1.5px; box-shadow:0 6px 16px -10px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.05) inset; }
    .kmodal .fila-botones .btn { min-height:56px; padding:14px; font-size:16px; margin-top:0; }

    /* Campos a 16px: por debajo el iPhone hace zoom al enfocar y desmonta la pantalla */

    .linea-chip { font-size:14px; padding:10px; }
    .linea-chip .btn-ghost { min-height:38px; padding:6px 12px !important; flex:none; white-space:nowrap; }
    .fila .btn-ghost { min-height:42px; }
    .fila { padding:14px 16px; }
    .articulo { padding:10px 6px; }
    .estado { font-size:12.5px; padding:5px 12px; }

    .koverlay { padding:12px; }
    .kmodal { max-width:none; padding:18px; max-height:calc(100dvh - 24px); }
    .kmodal p { font-size:15.5px; }
    .kmodal .fila-botones { flex-wrap:wrap; }
    .kmodal .fila-botones .btn { flex:1 1 120px; }
  }

  /* Tarjetas: el texto ocupa todo el ancho y el estado va debajo (antes se lo comía la píldora) */
  @media (max-width: 520px), (pointer: coarse) and (hover: none) {
    .fila { flex-direction:column; align-items:stretch; gap:8px; }
    .fila .estado { align-self:flex-start; white-space:normal; }
  }

  /* Histórico: en móvil, cada fila de la tabla pasa a ser una tarjeta etiquetada */
  @media (max-width: 760px), (pointer: coarse) and (hover: none) {
    .tabla-historico-envoltorio { border:none; overflow:visible; border-radius:0; }
    table.tabla-historico, .tabla-historico tbody, .tabla-historico tr, .tabla-historico td { display:block; width:100%; }
    .tabla-historico thead { display:none; }
    .tabla-historico tbody tr.fila-historico, .tabla-historico tbody tr.fila-historico:nth-child(even) {
      background:linear-gradient(160deg, var(--ink-850) 0%, var(--ink-900) 100%);

    .tabla-historico td { display:flex; justify-content:space-between; gap:14px; padding:5px 0; border-bottom:1px dashed var(--ink-800); text-align:right; }
    .tabla-historico td:last-child { border-bottom:none; }
    .tabla-historico td::before { content:attr(data-label); flex:0 0 auto; color:var(--text-500); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; text-align:left; padding-top:2px; }
    .tabla-historico td[data-vacio] { display:none; }
  }
  @media (max-width: 350px) { .theme-btn-txt { display:none; } }

  // ——— Modal in-página (sustituye prompt/confirm nativos) ———
  function kModal_(opts) {
    return new Promise(function (resolve) {
      var overlay = document.createElement('div');
      overlay.className = 'koverlay';
      var inputHtml = opts.input
        ? '<input class="entrada" type="' + (opts.numerico ? 'number' : 'text') + '" id="kmodalInput" value="' + (opts.valorInicial || '') + '">'
        : '';
      var botonesHtml = opts.cancelar
        ? '<button class="btn btn-ghost" id="kmodalCancelar">Cancelar</button><button class="btn btn-primary" id="kmodalAceptar">' + (opts.textoAceptar || 'Aceptar') + '</button>'
        : '<button class="btn btn-primary" id="kmodalAceptar">' + (opts.textoAceptar || 'Aceptar') + '</button>';
      overlay.innerHTML = '<div class="kmodal"><p>' + opts.mensaje + '</p>' + inputHtml + '<div class="fila-botones">' + botonesHtml + '</div></div>';
      document.body.appendChild(overlay);
      var input = overlay.querySelector('#kmodalInput');
      if (input) { input.focus(); input.select(); }
      function cerrar(valor) { document.body.removeChild(overlay); resolve(valor); }
      overlay.querySelector('#kmodalAceptar').onclick = function () { cerrar(opts.input ? input.value : true); };
      var btnCancelar = overlay.querySelector('#kmodalCancelar');
      if (btnCancelar) btnCancelar.onclick = function () { cerrar(opts.input ? null : false); };
      if (input) input.onkeydown = function (e) { if (e.key === 'Enter') overlay.querySelector('#kmodalAceptar').click(); };
    });
  }
  function kAlerta(mensaje) { return kModal_({ mensaje: mensaje, cancelar: false }); }
  function kConfirmar(mensaje) { return kModal_({ mensaje: mensaje, cancelar: true }); }
  function kPedirTexto(mensaje, opts) {
    opts = opts || {};
    return kModal_({ mensaje: mensaje, input: true, numerico: opts.numerico, valorInicial: opts.valorInicial, cancelar: true });
  }

  /** Refill: cada palet se lleva ENTERO (con todo lo que contenga), no por
   *  unidades. Elegir uno o varios de los palets disponibles con ese código
   *  — obligatorio, sin límite de cuántos. Resuelve al array de palets
   *  elegidos {sscc, ubicacion, cantidad}[], o null si se cancela. */
  /** Lectura de códigos de barras: BarcodeDetector nativo si el navegador lo
   *  trae (Android Chrome); si no (iPhone, Chrome de PC), ZXing bajo demanda. */
  const FORMATOS_BARRAS_ = ['ean_13', 'ean_8', 'code_128', 'code_39', 'itf', 'upc_a', 'upc_e', 'data_matrix'];
  var zxingPromesa_ = null;

  function cargarZxing_() {
    if (window.ZXing) return Promise.resolve(window.ZXing);
    if (!zxingPromesa_) {
      zxingPromesa_ = new Promise(function (resolve, reject) {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
        s.onload = function () { window.ZXing ? resolve(window.ZXing) : reject(new Error('No se pudo iniciar el lector de códigos.')); };
        s.onerror = function () { zxingPromesa_ = null; reject(new Error('No se pudo cargar el lector de códigos. Escribe el código a mano.')); };
        document.head.appendChild(s);
      });
    }
    return zxingPromesa_;
  }

  function leerCodigoDeImagen_(file) {
    return new Promise(function (resolve, reject) {
      const url = URL.createObjectURL(file);
      const img = new Image();
      function fin(valor) {
        URL.revokeObjectURL(url);
        if (valor) resolve(valor); else reject(new Error('No se ha detectado ningún código en la foto. Acércate y vuelve a intentarlo, o escríbelo a mano.'));
      }
      function conZxing() {
        cargarZxing_().then(function (ZXing) {
          new ZXing.BrowserMultiFormatReader().decodeFromImageElement(img)
            .then(function (r) { fin(r && r.getText ? r.getText() : null); })
            .catch(function () { fin(null); });
        }).catch(function (e) { URL.revokeObjectURL(url); reject(e); });
      }
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('No se pudo abrir la foto.')); };
      img.onload = function () {
        if (!('BarcodeDetector' in window)) { conZxing(); return; }
        try {
          new BarcodeDetector({ formats: FORMATOS_BARRAS_ }).detect(img).then(function (codigos) {
            if (codigos && codigos.length) fin(codigos[0].rawValue); else conZxing();
          }).catch(function () { conZxing(); });
        } catch (e) {
          conZxing();
        }
      };
      img.src = url;
    });
  }

  /** Lee el código y busca el artículo (por EAN o código LM). Uno solo →
   *  alEncontrar(articulo); varios → mostrarLista(filas). El iframe de Apps
   *  Script no deja usar la cámara en directo (confirmado en real), pero una
   *  pestaña nueva sí puede — se abre ahí un escáner en vídeo que arranca
   *  solo. Si el navegador bloquea la pestaña, se cae a hacer foto (único
   *  caso en que se usa foto — no hay opción visible para elegirla). */
  function escanearArticulo_(boton, alEncontrar, mostrarLista) {
    function buscar(codigo) {
      const textoOriginal = boton.textContent;
      boton.disabled = true; boton.textContent = 'Buscando…';
      gas('buscarArticuloPorCodigo', codigo).then(function (filas) {
        if (!filas.length) { kAlerta('Leído <b>' + escHtml(codigo) + '</b>, pero no está en el catálogo. Búscalo por código LM o nombre.'); return; }
        if (filas.length === 1) alEncontrar(filas[0]); else mostrarLista(filas);
      }).catch(function (e) {
        kAlerta(escHtml(e.message));
      }).then(function () {
        boton.disabled = false; boton.textContent = textoOriginal;
      });
    }
    const ventana = window.open('', '_blank');
    if (!ventana) { escanearPorFoto_(boton, buscar); return; }
    abrirEscanerEnPestana_(ventana, buscar);
  }

  var escanerIdSeq_ = 0;
  /** Escribe el escáner en la pestaña ya abierta (tiene que ser la misma que
   *  abrió el clic del usuario, o Android bloquea el popup) y espera su
   *  postMessage: {codigo} al leer, {cancelado:true} si cierra. ev.source
   *  === ventana valida que el mensaje es de esa pestaña sin depender del
   *  origin (about:blank). */
  function abrirEscanerEnPestana_(ventana, alLeer) {
    const id = 'k' + (++escanerIdSeq_) + '_' + Math.random().toString(36).slice(2);
    function alMensaje(ev) {
      if (ev.source !== ventana || !ev.data || ev.data.kairosEscaner !== id) return;
      window.removeEventListener('message', alMensaje);
      clearInterval(vigilar);
      if (ev.data.codigo) alLeer(ev.data.codigo);
    }
    window.addEventListener('message', alMensaje);
    const vigilar = setInterval(function () {
      if (ventana.closed) { clearInterval(vigilar); window.removeEventListener('message', alMensaje); }
    }, 500);
    ventana.document.open();
    ventana.document.write(escanerHtml_(id));
    ventana.document.close();
  }

      'if(!f.length)throw new Error("sin formatos");' +
      'var det=new BarcodeDetector({formats:f});' +
      'return function(v){return det.detect(v).then(function(c){return c&&c.length?c[0].rawValue:null;});};' +
      '}).catch(function(){return lectorZxing();});' +
      '}' +
      'return lectorZxing();' +
      '}' +
      'function lectorZxing(){' +
      'return zxingPromesa().then(function(ZX){' +
      'var F=ZX.BarcodeFormat,hints=new Map();' +
      'hints.set(ZX.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.CODE_128,F.CODE_39,F.ITF,F.UPC_A,F.UPC_E,F.DATA_MATRIX]);' +
      'hints.set(ZX.DecodeHintType.TRY_HARDER,true);' +
      'var lector=new ZX.MultiFormatReader();lector.setHints(hints);' +
      'var cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});' +
      'return function(v){' +
      'var w=v.videoWidth,h=v.videoHeight;if(!w||!h)return Promise.resolve(null);' +
      'var cw=Math.round(w*.85),ch=Math.round(h*.5);cv.width=cw;cv.height=ch;' +
      'cx.drawImage(v,(w-cw)/2,(h-ch)/2,cw,ch,0,0,cw,ch);' +
      'try{var bm=new ZX.BinaryBitmap(new ZX.HybridBinarizer(new ZX.HTMLCanvasElementLuminanceSource(cv)));' +
      'var r=lector.decodeWithState(bm);return Promise.resolve(r?r.getText():null);' +
      '}catch(e){return Promise.resolve(null);}' +
      '};' +
      '});' +
      '}' +
      'var ERRORES={NotAllowedError:"La cámara está bloqueada para esta pestaña. Actívala en los permisos del navegador y reintenta.",SecurityError:"La cámara está bloqueada para esta pestaña. Actívala en los permisos del navegador y reintenta.",NotFoundError:"No se encuentra ninguna cámara.",OverconstrainedError:"No se encuentra ninguna cámara.",NotReadableError:"La cámara la está usando otra app. Ciérrala y reintenta."};' +
      'function error(e){' +
      'pararStream();estado.classList.add("error");' +
      'estado.textContent=(e&&ERRORES[e.name])||"No se pudo abrir la cámara.";' +
      'document.getElementById("visor").style.display="none";' +
      'btnReintentar.hidden=false;' +
      '}' +
      'function bucle(lector){' +
      'if(terminado)return;' +
      'lector(video).then(function(codigo){' +
      'if(terminado)return;' +
      'if(codigo){if(navigator.vibrate){try{navigator.vibrate(80);}catch(e){}}enviar({codigo:String(codigo).trim()});}' +
      'else setTimeout(function(){bucle(lector);},120);' +
      '},function(){setTimeout(function(){bucle(lector);},250);});' +
      '}' +
      'function arrancar(){' +
      'btnReintentar.hidden=true;' +
      'document.getElementById("visor").style.display="block";' +
      'estado.classList.remove("error");estado.textContent="Abriendo cámara…";' +
      'navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}}).then(function(s){' +
      'stream=s;video.srcObject=s;' +
      'return Promise.resolve(video.play()).then(function(){' +
      'var pista=s.getVideoTracks()[0],cap={};' +
      'try{cap=pista.getCapabilities&&pista.getCapabilities()||{};}catch(e){}' +
      'if(cap.focusMode&&cap.focusMode.indexOf("continuous")>=0)pista.applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(function(){});' +
      'if(cap.torch){var on=false;btnLinterna.hidden=false;btnLinterna.onclick=function(){on=!on;btnLinterna.textContent=on?"Apagar linterna":"Linterna";pista.applyConstraints({advanced:[{torch:on}]}).catch(function(){btnLinterna.hidden=true;});};}' +
      'estado.textContent="Apunta al código de barras";' +
      'crearLector().then(bucle).catch(error);' +
      '});' +
      '},error);' +
      '}' +
      'btnReintentar.onclick=arrancar;' +
      'arrancar();' +
      '</scr' + 'ipt></body></html>';
  }

  function escanearPorFoto_(boton, alLeer) {
    const viejo = document.getElementById('inputCamaraCodigo');
    if (viejo) viejo.parentNode.removeChild(viejo);
    const input = document.createElement('input');
    input.type = 'file';
    input.id = 'inputCamaraCodigo';
    input.accept = 'image/*';
    input.setAttribute('capture', 'environment');
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', function () {
      const foto = input.files && input.files[0];
      setTimeout(function () { if (input.parentNode) input.parentNode.removeChild(input); }, 500);
      if (!foto) return;
      const textoOriginal = boton.textContent;
      boton.disabled = true; boton.textContent = 'Leyendo…';
      leerCodigoDeImagen_(foto).then(function (codigo) {
        boton.disabled = false; boton.textContent = textoOriginal;
        alLeer(codigo);
      }).catch(function (e) {
        boton.disabled = false; boton.textContent = textoOriginal;
        kAlerta(escHtml(e.message));
      });
    });
    input.click();
  }

  /** Pedido cliente: por qué no se puede pedir esa cantidad. chk viene de
   *  verificarAntesDeAnadir; yaEnPeticion = unidades del mismo artículo ya
   *  añadidas en esta petición (aún sin enviar). */
  function mensajeSinStock_(codigo, chk, yaEnPeticion, cantidad) {
    const cod = escHtml(codigo);
    if (chk.fisico <= 0) return 'No hay stock de ' + cod + ' en almacén, así que no se puede pedir.';
    if (chk.disponible <= 0) {
      return 'Otras peticiones abiertas ya han agotado el stock de ' + cod + ': hay ' + chk.fisico +
        ' en almacén y ' + chk.comprometido + ' ya están comprometidas en otros pedidos. No se puede pedir.';
    }
    const restante = chk.disponible - yaEnPeticion;
    if (restante <= 0) return 'Ya has añadido en esta petición todas las unidades disponibles de ' + cod + ' (' + chk.disponible + ').';
    return 'Solo quedan ' + restante + ' unidades disponibles de ' + cod +
      (chk.comprometido > 0 ? ' — otras peticiones abiertas ya tienen comprometidas ' + chk.comprometido + ' de las ' + chk.fisico + ' que hay en almacén' : '') +
      '. Pides ' + cantidad + ': baja la cantidad.';
  }

  /** opts.titulo cambia la pregunta; opts.max limita cuántos palets se pueden marcar. */
  function elegirPaletsModal_(candidatos, opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var overlay = document.createElement('div');
      overlay.className = 'koverlay';
      var seleccion = [];
      function cerrar(valor) { document.body.removeChild(overlay); resolve(valor); }
      function pintar() {
        overlay.innerHTML = '<div class="kmodal kmodal-ancho">' +
          '<p>' + (opts.titulo || '¿Qué palet(es) mover? Se llevan enteros.') + '</p>' +
          '<div class="paletes-grid">' +
          candidatos.map(function (c) {
            var elegido = seleccion.indexOf(c.sscc) !== -1;
            var tabla = (c.contenido || []).map(function (x) {
              return '<div style="display:grid;grid-template-columns:60px 1fr 36px;gap:4px;font-size:11.5px;padding:2px 0;">' +
                '<span style="color:var(--text-500);">' + escHtml(x.codigo_lm) + '</span>' +
                '<span>' + escHtml(x.designacion || '—') + '</span>' +
                '<span style="text-align:right;">' + x.cantidad + '</span></div>';
            }).join('');
            return '<div class="palet-card">' +
              '<button class="btn ' + (elegido ? 'btn-primary' : 'btn-ghost') + '" style="width:100%;margin-bottom:2px;text-align:left;" data-sscc="' + escHtml(c.sscc) + '">' +
              (elegido ? '✓ ' : '') + 'SSCC ' + escHtml(c.sscc) + ' · ' + escHtml(c.ubicacion || '—') + ' · ' + c.cantidad + ' ud</button>' +
              '<div style="margin:0 0 4px 4px;">' + tabla + '</div></div>';
          }).join('') +
          '</div>' +
          (opts.botonBuscar ? '<button class="btn btn-ghost" id="kpaletBuscar" style="width:100%;margin:6px 0;">' + escHtml(opts.botonBuscar) + '</button>' : '') +
          '<div class="fila-botones">' +
          '<button class="btn btn-ghost" id="kpaletCancelar">Cancelar</button>' +
          '<button class="btn btn-primary" id="kpaletAceptar"' + (!seleccion.length ? ' disabled' : '') + '>Confirmar (' + seleccion.length + ')</button>' +
          '</div></div>';
        const btnBuscar = overlay.querySelector('#kpaletBuscar');
        if (btnBuscar) btnBuscar.onclick = function () { cerrar('BUSCAR'); };
        overlay.querySelectorAll('[data-sscc]').forEach(function (btn) {
          btn.onclick = function () {
            var sscc = btn.getAttribute('data-sscc');
            var idx = seleccion.indexOf(sscc);
            if (idx === -1) {
              if (opts.max && seleccion.length >= opts.max) return;
              seleccion.push(sscc);
            } else seleccion.splice(idx, 1);
            pintar();
          };
        });
        overlay.querySelector('#kpaletCancelar').onclick = function () { cerrar(null); };
        overlay.querySelector('#kpaletAceptar').onclick = function () {
          if (!seleccion.length) return;
          cerrar(candidatos.filter(function (c) { return seleccion.indexOf(c.sscc) !== -1; }));
        };
      }
      document.body.appendChild(overlay);
      pintar();
    });
  }

  /** Refill por SSCC: lista de LM que contiene ese palet, se elige uno con
   *  un click (resuelve a esa fila, o null si se cancela). */
  function elegirLmDePaletModal_(filas) {
    return new Promise(function (resolve) {
      var overlay = document.createElement('div');
      overlay.className = 'koverlay';
      overlay.innerHTML = '<div class="kmodal">' +
        '<p>SSCC ' + escHtml(filas[0].sscc) + ' · ' + escHtml(filas[0].ubicacion || '—') + ' — ¿qué LM pides?</p>' +
        filas.map(function (f, idx) {
          return '<button class="btn btn-ghost" style="width:100%;margin-bottom:6px;text-align:left;" data-idx="' + idx + '">' +
            escHtml(f.codigo_lm) + ' · ' + escHtml(f.designacion || '—') + ' · ' + f.cantidad + ' ud</button>';
        }).join('') +
        '<div class="fila-botones"><button class="btn btn-ghost" id="klmCancelar">Cancelar</button></div></div>';
      function cerrar(valor) { document.body.removeChild(overlay); resolve(valor); }
      overlay.querySelectorAll('[data-idx]').forEach(function (btn) {
        btn.onclick = function () { cerrar(filas[Number(btn.getAttribute('data-idx'))]); };
      });
      overlay.querySelector('#klmCancelar').onclick = function () { cerrar(null); };
      document.body.appendChild(overlay);
    });
  }

  /** Cablea las pestañas y pinta en "Incidencias" cuántas hay abiertas (y el
   *  aviso de la pantalla de inicio, si existe). Una sola función para todas
   *  las pantallas con pestañas. */
  var INCIDENCIAS_CACHE_ = null;
  function cablearTabsPortal_(tabs) {
    tabs.querySelector('#tabPeticiones').onclick = function (e) { e.preventDefault(); renderCola(); };
    tabs.querySelector('#tabTrazabilidad').onclick = function (e) { e.preventDefault(); renderTrazabilidad(); };
    tabs.querySelector('#tabRevisiones').onclick = function (e) { e.preventDefault(); renderRevisiones(); };
    tabs.querySelector('#tabIncidencias').onclick = function (e) { e.preventDefault(); renderIncidenciasPortal(); };
    tabs.querySelector('#tabHistorico').onclick = function (e) { e.preventDefault(); renderHistorico(); };

    function pintar(lista) {
      const abiertas = lista.filter(function (l) { return l.estadoIncidencia !== 'resuelta'; }).length;
      const a = tabs.querySelector('#tabIncidencias');
      if (a) {
        const viejo = a.querySelector('.badge-tab');
        if (viejo) viejo.remove();
        if (abiertas) a.appendChild(el('<b class="badge-tab">' + abiertas + '</b>'));
      }
      const aviso = document.getElementById('avisoIncidencias');
      if (aviso) {
        aviso.innerHTML = '';
        if (abiertas) {
          const b = el('<button class="btn btn-ghost" style="margin-bottom:10px;border-color:var(--danger-line);color:var(--danger-fg);">⚠ Tienes ' + abiertas + ' incidencia' + (abiertas === 1 ? '' : 's') + ' de preparación sin resolver — ver</button>');
          b.onclick = renderIncidenciasPortal;
          aviso.appendChild(b);
        }
      }
    }
    if (INCIDENCIAS_CACHE_) pintar(INCIDENCIAS_CACHE_);
    gas('listarMisIncidencias', LDAP).then(function (lista) {
      INCIDENCIAS_CACHE_ = lista;
      pintar(lista);
    }).catch(function () { /* el aviso es secundario: sin él la app sigue igual */ });
  }

    var p = document.getElementById('themePanel');
    if (p) p.classList.toggle('abierto');

  function setKModo(modo) {
    document.documentElement.setAttribute('data-kmode', modo);
    try { localStorage.setItem('kairos_mode_pick', modo); } catch (e) {}
    var actual = document.documentElement.getAttribute('data-ktheme');
    if (TEMAS_MODOS[actual].indexOf(modo) === -1) setKTema('taisared'); else sincronizarPickers_();
  }

  function setKTema(nombre) {
    document.documentElement.setAttribute('data-ktheme', nombre);
    try { localStorage.setItem('kairos_theme_pick', nombre); } catch (e) {}
    sincronizarPickers_();
  }

  function sincronizarPickers_() {
    var modo = document.documentElement.getAttribute('data-kmode');
    var tema = document.documentElement.getAttribute('data-ktheme');
    var picks = document.querySelectorAll('.pick[data-mode]');
    for (var i = 0; i < picks.length; i++) picks[i].classList.toggle('active', picks[i].getAttribute('data-mode') === modo);
    picks = document.querySelectorAll('.pick[data-for]');
    for (var j = 0; j < picks.length; j++) {
      var p = picks[j];
      var nombre = p.getAttribute('data-for');
      p.toggleAttribute('data-hidden', TEMAS_MODOS[nombre].indexOf(modo) === -1);
      p.classList.toggle('active', nombre === tema);
    }
  }

  var LDAP = localStorage.getItem('kairos_ldap') || '';

  var TIENDA_NOMBRE = localStorage.getItem('kairos_tienda_nombre') || '';
  var ROL = localStorage.getItem('kairos_rol') || '';
  var ETIQUETA_ROL = { vendedor: 'Reposición', logistico: 'Logística', gestor: 'Coordinación', master: 'Master' };

  function salir() {
    localStorage.removeItem('kairos_ldap');
    localStorage.removeItem('kairos_tienda');
    localStorage.removeItem('kairos_tienda_nombre');
    localStorage.removeItem('kairos_rol');
    LDAP = ''; TIENDA = ''; TIENDA_NOMBRE = ''; ROL = '';
    render();
  }

  function app() { return document.getElementById('app'); }

  function render() {
    app().innerHTML = '';
    if (!LDAP) { renderEntrar(); return; }
    renderCola();

    if (!LDAP) return;
    renderCola();

  document.addEventListener('DOMContentLoaded', function () { render(); });
